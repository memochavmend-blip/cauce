<script>
/* ══════════════════════════════════════════════════════════════════════
   CAUCE v8 · la nota

   Rediseñado desde tres post-its de un sistema de papel que ya funcionaba.
   Lo que enseñaban:

   1) Es UNA lista. Gym, Documentos MBA, Amazon, Meditación y Trading
      Strategy viven en la misma columna. No hay secciones.
   2) El número es un nivel, no un orden: varios renglones comparten el 1.
   3) La lista se reescribe entera cada día, y al reescribirla se
      reprioriza. Entre el 6 y el 10 de marzo, Gym bajó de 1 a 2 y Job
      opps subió de 3 a 2. Nadie arrastró nada: lo volvió a escribir.
   4) Lo que se reescribe muchas veces sin tacharse es la señal. «Trading
      Strategy» lleva tres notas en nivel 1, sin tachar.
   5) Cabe en un post-it: nueve renglones. El papel es el límite de WIP.

   De ahí las reglas de esta versión:
   — Una pantalla con la lista del día, y nada más que decidir.
   — Tocar la fila la tacha. Tocar el número cicla 1→2→3.
   — El pase diario reemplaza el arrastre automático: lo abierto se
     confirma o se va, y se cuenta cuántas veces se ha confirmado.
   — El trabajo no entra: tiene su propio tracker. Aquí van las acciones que
     llevan al propósito, y los pendientes sueltos.
   — La semana es la unidad de la rutina: la meta es el 100%, el 80% ya
     cuenta. No hay flama que se llene, porque llegar a la meta no es
     contable; lo contable es si las acciones están pasando.
   ══════════════════════════════════════════════════════════════════════ */

/* ════════ 1 · BASE ════════ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const DIA_MS = 86400000;
const aISO = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const deISO = s => { const p = String(s).split("-").map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const hoyISO = () => aISO(new Date());
const sumarDias = (s, n) => { const d = deISO(s); d.setDate(d.getDate() + n); return aISO(d); };
const diasEntre = (a, b) => Math.round((deISO(b) - deISO(a)) / DIA_MS);
const lunesDe = s => { const d = deISO(s), n = (d.getDay() + 6) % 7; d.setDate(d.getDate() - n); return aISO(d); };
const semanaDe = s => { const l = lunesDe(s); return Array.from({ length: 7 }, (_, i) => sumarDias(l, i)); };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS_NOM = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const LETRAS = ["D", "L", "M", "M", "J", "V", "S"];
const fechaLarga = f => { const d = deISO(f); return DIAS_NOM[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]; };
const fechaCorta = f => { const d = deISO(f); return d.getDate() + " " + MESES[d.getMonth()].slice(0, 3); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const ICO = {
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l3 3 6-7"/></svg>',
  mas: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  ajustes: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
  llama: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6c2.6 3.1 5.6 5.4 5.6 9.5a5.6 5.6 0 0 1-11.2 0c0-2 .9-3.4 2.1-4.9.5 1 1.1 1.7 1.9 2.1-.3-2.5.2-4.6 1.6-6.7z"/></svg>',
  /* Subir o bajar una parte cambia su peso; el galón las abre en su sitio */
  arriba: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  abajo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ════════ 2 · GUARDADO ════════ */
const Guardado = (() => {
  const memoria = {};
  const claude = () => typeof window !== "undefined" && !!window.storage && typeof window.storage.get === "function";
  const local = (() => { try { const k = "cauce:probe"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; } catch (e) { return false; } })();
  async function leer(k) {
    if (claude()) { try { const v = await window.storage.get(k); if (v) return typeof v === "string" ? JSON.parse(v) : v; } catch (e) {} }
    if (local) { try { const v = window.localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) {} }
    return memoria[k] || null;
  }
  function escribir(k, v) {
    memoria[k] = v;
    if (claude()) { try { window.storage.set(k, JSON.stringify(v)); } catch (e) {} }
    if (local) { try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  }
  return { leer, escribir, persistente: () => claude() || local };
})();

const VERSION = 8;
const CLAVE = "cauce:estado:v8";
const VIEJAS = ["cauce:estado:v7", "cauce:estado:v6", "cauce:estado:v5", "cauce:estado:v4", "cauce:estado:v3"];
const TOPE = 9;   /* el post-it: nueve renglones */
let E = null;

/* ════════ 3 · ESQUEMA ════════
   Dos tipos de ítem y una sola lista.
   · rutina — se repite con cadencia semanal. La semana es su unidad.
   · suelto — pasa una vez. Lleva cuenta de cuántos pases ha sobrevivido.
   El nivel (1, 2, 3) vive en el ítem: tocarlo hoy lo deja así mañana,
   igual que al reescribir la nota a mano.                                */
function rutinaNueva(o) {
  const base = Object.assign({ id: uid(), tipo: "rutina", texto: "", nivel: 2, hora: "", area: "",
    orden: 0, dias: [1, 2, 3, 4, 5], semanal: 0,
    meta: null, pausada: false, pasos: [] }, o || {});
  /* Sin franja explícita, la hora decide dónde cae la primera vez. De ahí en
     adelante manda el campo: arrastrar tiene que poder contradecir al reloj. */
  if (!FRANJAS.some(x => x.id === base.franja)) base.franja = franjaDeHora(base.hora);
  return base;
}
function sueltoNuevo(o) {
  return Object.assign({ id: uid(), tipo: "suelto", texto: "", nivel: 2, hora: "", orden: 0,
    meta: null, creado: hoyISO(), pases: 0, hecha: false, hechaEl: null, archivada: false }, o || {});
}
function diaVacio() { return { hechas: {}, fuera: [], sub: {}, porti: [], pase: false }; }
function diaDe(f) { return Object.assign(diaVacio(), E.dias[f] || {}); }
function diaMut(f) { const d = E.dias[f] = Object.assign(diaVacio(), E.dias[f] || {}); return d; }

const horaEnMin = h => { const p = String(h || "").split(":");
  return p.length === 2 ? (+p[0] || 0) * 60 + (+p[1] || 0) : 9999; };
const franjaDeHora = h => { const m = horaEnMin(h); if (m === 9999) return "jornada";
  const f = FRANJAS.find(x => m >= x.desde * 60 && m < x.hasta * 60); return f ? f.id : "jornada"; };
/* Ejemplos para arrancar. Son lo que son: cosas que nadie exige. */
const POR_TI = ["Leer un libro", "Caminar en el parque", "Tomar el sol",
  "Darme tiempo sin hacer nada", "Escuchar música sin otra cosa de fondo",
  "Hablar con alguien que quiero", "Cocinar algo que me guste"];
const FRANJAS = [
  { id: "manana", nombre: "Mañana", desde: 5, hasta: 7 },
  { id: "jornada", nombre: "Jornada", desde: 7, hasta: 18 },
  { id: "tarde", nombre: "Tarde", desde: 18, hasta: 21 },
  { id: "noche", nombre: "Noche", desde: 21, hasta: 24 }
];

/* Migración desde v7 y anteriores. Nada de lo capturado se pierde: lo que
   no cabe en la lista de nueve entra archivado y se puede traer desde
   «lo abierto». Mejor guardado y fuera de la vista que borrado. */
function desdeViejo(g) {
  const metas = (g.metas || []).map(m => ({ id: m.id, nombre: m.nombre, lane: m.lane || "oficio" }));
  /* El trabajo no vive aquí. Este tracker sigue las acciones que llevan al
     propósito; las tareas del día del oficio tienen su propio tracker, y las
     juntas y los 1:1 son calendario, no lista. Se conservan en pausa
     —visibles y recuperables— en vez de borrarse al importar. */
  const esTrabajo = r => r.area === "Trabajo";
  const rutinas = (g.rutinas || []).filter(r => r.frecuencia !== "mes").map(r => rutinaNueva({
    id: r.id, texto: r.nombre, hora: r.hora || "", area: r.area || "", dias: r.dias || [],
    franja: FRANJAS.some(x => x.id === r.franja) ? r.franja : franjaDeHora(r.hora),
    semanal: r.semanal || 0, pasos: (r.pasos || []).slice(),
    meta: r.meta || null, pausada: !!r.pausada || esTrabajo(r),
    nivel: r.peso ? 1 : (r.semanal >= 5 ? 1 : 2)
  }));
  /* Las mensuales conservan su día del mes */
  (g.rutinas || []).filter(r => r.frecuencia === "mes").forEach(r => rutinas.push(rutinaNueva({
    id: r.id, texto: r.nombre, hora: r.hora || "", area: r.area || "", dias: [], semanal: 0,
    mensual: r.diaMes || 1, pasos: (r.pasos || []).slice(),
    meta: r.meta || null, nivel: 2, pausada: esTrabajo(r)
  })));
  /* Solo lo de los próximos días entra a la lista; lo demás queda guardado y
     se trae cuando toque. Una lista heredada de 50 renglones no es una lista. */
  const pronto = sumarDias(hoyISO(), 7);
  const sueltos = (g.pendientes || []).map(p => sueltoNuevo({
    id: p.id, texto: p.texto, creado: p.creado || p.fecha || hoyISO(),
    hecha: !!p.hecha, hechaEl: p.hechaEl || null, nivel: 1,
    archivada: !p.hecha && !!p.fecha && p.fecha > pronto
  }));
  (g.ideas || []).forEach(i => sueltos.push(sueltoNuevo({ id: i.id, texto: i.texto, nivel: 3, archivada: true })));
  /* Las acciones de la ruta vieja entran guardadas: estaban para una
     estructura que ya no existe. Nada se pierde, pero nada inunda el día. */
  (g.acciones || []).filter(a => !a.hecha).forEach(a => sueltos.push(sueltoNuevo({
    id: a.id, texto: a.texto, meta: a.metaId || null,
    nivel: (a.compromiso && a.compromiso.con) ? 1 : 3, archivada: true
  })));
  (g.metas || []).forEach(m => (m.hitos || []).filter(h => !h.hecho).forEach(h => sueltos.push(sueltoNuevo({
    id: h.id, texto: h.texto + " · " + fechaCorta(h.fecha), meta: m.id, nivel: 1, archivada: true
  }))));
  /* Numerar al migrar: si todo queda en cero, arrastrar no tiene contra qué
     ordenar y el primer movimiento barajaría la lista entera. */
  FRANJAS.forEach(fr => rutinas.filter(r => r.franja === fr.id)
    .sort((a, b) => horaEnMin(a.hora) - horaEnMin(b.hora))
    .forEach((r, i) => { r.orden = (i + 1) * 10; }));
  [1, 2, 3].forEach(n => sueltos.filter(x => x.nivel === n).forEach((x, i) => { x.orden = (i + 1) * 10; }));
  return {
    v: VERSION,
    ajustes: { nombre: (g.ajustes || {}).nombre || "", tema: (g.ajustes || {}).tema || "sistema",
      proposito: (g.ajustes || {}).proposito || "", vista: "nivel" },
    metas, rutinas, sueltos, dias: {}, marcas: { onboarding: true, ultimoDia: null }
  };
}

function normalizar(e) {
  e.ajustes = Object.assign({ nombre: "", tema: "sistema", proposito: "", vista: "nivel",
    metodo: 0, dormir: 15, volumen: 0.5 }, e.ajustes || {});
  ["metas", "rutinas", "sueltos", "porti"].forEach(k => { if (!Array.isArray(e[k])) e[k] = []; });
  /* «Haz algo solo por ti» no es una obligación: no tiene nivel, ni cadencia,
     ni fecha. Es una lista de la que se escoge, no una lista que se cumple. */
  if (!e.porti.length) e.porti = POR_TI.map(t => ({ id: uid(), texto: t }));
  Object.values(e.dias).forEach(d => { if (!Array.isArray(d.porti)) d.porti = []; });
  e.dias = e.dias && typeof e.dias === "object" ? e.dias : {};
  e.marcas = Object.assign({ onboarding: false, ultimoDia: null, tocado: false }, e.marcas || {});
  /* Si ya hay días capturados, esto no es una instalación en blanco aunque
     la marca falte: falla del lado de conservar, no del de pisar. */
  if (Object.keys(e.dias || {}).length) e.marcas.tocado = true;
  /* Empates en el orden hacen que arrastrar baraje la lista: se desempatan aquí */
  const desempatar = (lista, clave) => {
    const grupos = {};
    lista.forEach(x => { const k = x[clave]; (grupos[k] = grupos[k] || []).push(x); });
    Object.values(grupos).forEach(g => {
      const ords = g.map(x => x.orden);
      if (new Set(ords).size !== g.length) g.forEach((x, i) => { x.orden = (i + 1) * 10; });
    });
  };
  /* La franja se dedujo de la hora la primera vez; de ahí en adelante manda
     el campo, porque arrastrar tiene que poder contradecir al reloj. */
  e.rutinas.forEach(r => { r.tipo = "rutina"; if (!Array.isArray(r.dias)) r.dias = [];
    if (!Array.isArray(r.pasos)) r.pasos = []; if (typeof r.area !== "string") r.area = "";
    if (!FRANJAS.some(x => x.id === r.franja)) r.franja = franjaDeHora(r.hora);
    if (typeof r.orden !== "number") r.orden = horaEnMin(r.hora);
    if (typeof r.semanal !== "number") r.semanal = 0; if (![1, 2, 3].includes(r.nivel)) r.nivel = 2;
    if (typeof r.hora !== "string") r.hora = ""; if (r.meta && !e.metas.some(m => m.id === r.meta)) r.meta = null; });
  e.sueltos.forEach((s, i) => { s.tipo = "suelto"; if (![1, 2, 3].includes(s.nivel)) s.nivel = 2;
    if (typeof s.orden !== "number") s.orden = i;
    if (typeof s.pases !== "number") s.pases = 0; if (typeof s.hora !== "string") s.hora = "";
    if (s.meta && !e.metas.some(m => m.id === s.meta)) s.meta = null; });
  desempatar(e.rutinas, "franja");
  desempatar(e.sueltos.filter(x => !x.archivada && !x.hecha), "nivel");
  e.v = VERSION;
  return e;
}
/* Los días viejos se borran solos: esto no es un archivo histórico */
function podar(e) {
  const lim = sumarDias(hoyISO(), -70);
  Object.keys(e.dias).forEach(k => { if (k < lim) delete e.dias[k]; });
  e.sueltos = e.sueltos.filter(s => !(s.hecha && s.hechaEl && s.hechaEl < sumarDias(hoyISO(), -14)));
}

/* ════════ 4 · LECTURAS ════════ */
const Rg = {
  item: id => E.rutinas.find(r => r.id === id) || E.sueltos.find(s => s.id === id) || null,
  meta: id => E.metas.find(m => m.id === id) || null,
  tocaRutina: (r, f) => {
    if (r.pausada) return false;
    if (r.mensual) return deISO(f).getDate() === r.mensual;
    return (r.dias || []).includes(deISO(f).getDay());
  },
  hecha: (x, f) => x.tipo === "rutina" ? !!diaDe(f).hechas[x.id] : !!x.hecha,
  /* LA LISTA DEL DÍA — rutinas que tocan hoy + sueltos abiertos, en una sola
     columna, como el papel. Ordena por nivel y, dentro del nivel, por hora. */
  lista: f => {
    const d = diaDe(f);
    const rs = E.rutinas.filter(r => Rg.tocaRutina(r, f) && !d.fuera.includes(r.id));
    const ss = E.sueltos.filter(s => !s.archivada && (!s.hecha || s.hechaEl === f));
    return rs.concat(ss).sort((a, b) =>
      (a.nivel - b.nivel) ||
      ((a.hora || "99:99").localeCompare(b.hora || "99:99")) ||
      (a.tipo === b.tipo ? 0 : a.tipo === "rutina" ? -1 : 1));
  },
  /* ── DOS COSAS SEPARADAS, UNA DEBAJO DE LA OTRA ──
     · TU DÍA      — la rutina por franjas, con sus partes. Son las obligaciones:
       lo que hay que hacer para que las metas avancen. Se repite.
     · PENDIENTES  — el 3×3. Pasa una vez, y no tiene por qué llevar a una meta.
     No se mezclan: una rutina nunca aparece entre los pendientes ni al revés.
     Lo hecho sale de aquí y se va al repositorio, en su propio apartado.      */
  pendientes: f => E.sueltos.filter(s => !s.archivada && !s.hecha)
    .sort((a, b) => (a.nivel - b.nivel) || (a.orden - b.orden)),
  /* ── Las partes de una actividad ──
     El orden es el peso: la primera pesa más (n − i). Con cinco partes los
     pesos son 5·4·3·2·1 y las tres de arriba ya valen el 80%. Eso es lo que
     hace que exista un 20% que soltar; con pesos iguales, soltar una de
     cuatro sería el 25% y no habría holgura ninguna. */
  sub: (r, d) => (d.sub && d.sub[r.id]) ? d.sub[r.id] : (r.pasos || []).map(t => ({ t, h: false })),
  pesoSub: (i, n) => n - i,
  totalSub: n => n * (n + 1) / 2,
  pctSub: (i, n) => n ? Math.round((n - i) * 100 / Rg.totalSub(n)) : 0,
  bastanSub: n => { const t = Rg.totalSub(n); let a = 0;
    for (let k = 0; k < n; k++) { a += Rg.pesoSub(k, n); if (a * 5 >= t * 4) return k + 1; } return n; },
  estadoSub: (r, d) => {
    const sub = Rg.sub(r, d), n = sub.length, total = Rg.totalSub(n);
    const peso = sub.reduce((a, x, i) => a + (x.h ? Rg.pesoSub(i, n) : 0), 0);
    return { sub, n, total, peso, hechas: sub.filter(x => x.h).length,
      pct: total ? Math.round(peso * 100 / total) : 0,
      basta: Rg.bastanSub(n), lista: n > 0 && peso * 5 >= total * 4 };
  },
  /* La rutina de hoy, por franja y en el orden que él puso. La hora es una
     etiqueta, no el criterio: arrastrar manda sobre el reloj. */
  porHora: f => {
    const d = diaDe(f);
    const rs = E.rutinas.filter(r => Rg.tocaRutina(r, f) && !d.fuera.includes(r.id));
    return FRANJAS.map(fr => ({ fr, items: rs.filter(x => x.franja === fr.id)
      .sort((a, b) => (a.orden - b.orden) || horaEnMin(a.hora) - horaEnMin(b.hora)) }));
  },
  /* Los pendientes en tres grupos: arrastrar de uno a otro cambia el nivel */
  porNivel: f => [1, 2, 3].map(n => ({ n, items: Rg.pendientes(f).filter(x => x.nivel === n)
    .sort((a, b) => a.orden - b.orden) })),
  /* LA SEMANA — la unidad de la rutina. La meta es el 100%; el 80% ya cuenta,
     pero se dice en días, no en porcentaje: con 5, cuatro bastan. */
  objetivo: r => r.semanal > 0 ? r.semanal : (r.dias || []).length,
  basta: r => { const m = Rg.objetivo(r); return m >= 4 ? m - 1 : m; },
  semana: (r, f) => {
    const hoy = hoyISO(), dias = semanaDe(f);
    const hechos = dias.map(k => ({ fecha: k, hecha: k <= hoy && !!((E.dias[k] || {}).hechas || {})[r.id],
      toca: Rg.tocaRutina(r, k), futuro: k > hoy }));
    const n = hechos.filter(x => x.hecha).length, obj = Rg.objetivo(r), suf = Rg.basta(r);
    return { dias: hechos, n, obj, suf, completo: obj > 0 && n >= obj, cuenta: obj > 0 && n >= suf };
  },
  seguidas: () => E.rutinas.filter(r => !r.pausada && !r.mensual && Rg.objetivo(r) > 0),
  abiertos: () => E.sueltos.filter(s => !s.hecha && !s.archivada).sort((a, b) => (b.pases - a.pases) || a.nivel - b.nivel),
  archivados: () => E.sueltos.filter(s => !s.hecha && s.archivada),
  /* Los que quedaron abiertos de días pasados: lo que el pase diario revisa */
  paraPase: f => E.sueltos.filter(s => !s.hecha && !s.archivada && s.creado < f),
  /* LA FLAMA — un estado, no una barra. No mide qué tan cerca está la meta,
     porque eso no es contable. Mide si las acciones están pasando: arde
     cuando las rutinas de esa meta van en cadencia, y se apaga cuando no. */
  flama: m => {
    const rs = E.rutinas.filter(r => r.meta === m.id && !r.pausada && Rg.objetivo(r) > 0);
    if (!rs.length) return { estado: "sin", rs: 0, n: 0, de: 0, pct: 0 };
    const f = hoyISO();
    let n = 0, de = 0;
    rs.forEach(r => { const s = Rg.semana(r, f); n += Math.min(s.n, s.obj); de += s.obj; });
    /* Se mide contra lo que tocaría a estas alturas de la semana, no contra el
       total: un martes con 2 de 5 va bien, y un viernes con 2 de 5 no. */
    const hoyIdx = (deISO(f).getDay() + 6) % 7, parte = Math.max(1, hoyIdx + 1) / 7;
    const esperado = Math.max(1, de * parte), r2 = n / esperado;
    return { estado: r2 >= 0.8 ? "viva" : r2 >= 0.4 ? "tibia" : "apagada", rs: rs.length, n, de,
      /* Lo que necesita el dibujo: qué tan alto arde, de 0 a 100 */
      pct: Math.max(0, Math.min(100, Math.round(r2 * 100))) };
  },
  cuenta: f => { const l = Rg.lista(f); return { n: l.length, hechas: l.filter(x => Rg.hecha(x, f)).length,
    uno: l.filter(x => x.nivel === 1).length, unoHechas: l.filter(x => x.nivel === 1 && Rg.hecha(x, f)).length }; },
  /* El progreso del día, en dos cuentas separadas porque son dos cosas */
  marcador: f => {
    const r = E.rutinas.filter(x => Rg.tocaRutina(x, f) && !diaDe(f).fuera.includes(x.id));
    const abiertos = Rg.pendientes(f);
    const hoyHechos = E.sueltos.filter(s => s.hecha && s.hechaEl === f).length;
    return { rut: r.length, rutH: r.filter(x => Rg.hecha(x, f)).length,
      pend: abiertos.length + hoyHechos, pendH: hoyHechos,
      uno: abiertos.filter(x => x.nivel === 1).length + E.sueltos.filter(s => s.hecha && s.hechaEl === f && s.nivel === 1).length,
      unoH: E.sueltos.filter(s => s.hecha && s.hechaEl === f && s.nivel === 1).length };
  },
  /* ── Por ti ──
     No se cuenta cuántas, ni se compara con nada. Solo si hubo o no hubo:
     en un día, y en cuántos días de la semana. Convertirlo en una meta sería
     exactamente lo contrario de para qué está. */
  portiHoy: f => diaDe(f).porti || [],
  portiHubo: f => (diaDe(f).porti || []).length > 0,
  portiSemana: f => semanaDe(f).map(k => ({ fecha: k, hubo: ((E.dias[k] || {}).porti || []).length > 0,
    futuro: k > hoyISO() })),
  portiDias: f => semanaDe(f).filter(k => k <= hoyISO() && ((E.dias[k] || {}).porti || []).length > 0).length,
  /* El repositorio: lo hecho sale de la lista y se guarda por día */
  hechos: () => {
    const ss = E.sueltos.filter(s => s.hecha && s.hechaEl).sort((a, b) => b.hechaEl.localeCompare(a.hechaEl));
    const porDia = [];
    ss.forEach(s => { const g = porDia.find(x => x.f === s.hechaEl);
      if (g) g.items.push(s); else porDia.push({ f: s.hechaEl, items: [s] }); });
    return porDia;
  }
};

/* ════════ 5 · ACCIONES ════════ */
const A = {
  marcar(x, f) {
    if (x.tipo === "rutina") {
      const d = diaMut(f), v = !d.hechas[x.id];
      if (v) d.hechas[x.id] = true; else delete d.hechas[x.id];
      const sub = Rg.sub(x, d);
      if (sub.length) d.sub[x.id] = sub.map(y => ({ t: y.t, h: v }));
    } else { x.hecha = !x.hecha; x.hechaEl = x.hecha ? f : null; }
  },
  /* Al llegar al 80% del peso, la actividad se da por hecha sola */
  marcarSub(r, i, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    if (!sub[i]) return null;
    sub[i].h = !sub[i].h;
    const antes = !!d.hechas[r.id], e = Rg.estadoSub(r, d);
    if (e.lista) d.hechas[r.id] = true; else delete d.hechas[r.id];
    return { antes, ahora: e.lista, e };
  },
  nuevaSub(r, texto, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    sub.push({ t: texto, h: false });
    if (!Rg.estadoSub(r, d).lista) delete d.hechas[r.id];
  },
  quitarSub(r, i, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    sub.splice(i, 1);
    const e = Rg.estadoSub(r, d);
    if (sub.length && e.lista) d.hechas[r.id] = true; else delete d.hechas[r.id];
  },
  /* ── Mover un renglón ──
     Soltar en otra franja la cambia de bloque; soltar en otro nivel cambia la
     prioridad. El orden queda renumerado de 10 en 10 para que siempre quepa
     uno nuevo en medio sin tener que tocar los demás. */
  mover(x, destino, antesDe) {
    const lista = x.tipo === "rutina"
      ? (x.franja = destino, E.rutinas.filter(r => r.franja === destino && r.id !== x.id))
      : (x.nivel = +destino, E.sueltos.filter(y => !y.archivada && !y.hecha && y.nivel === +destino && y.id !== x.id));
    lista.sort((a, b) => a.orden - b.orden);
    const i = antesDe ? lista.findIndex(y => y.id === antesDe) : -1;
    const dentro = i >= 0 ? i : lista.length;
    lista.splice(dentro, 0, x);
    lista.forEach((y, k) => { y.orden = (k + 1) * 10; });
    return true;
  },
  /* Agregar una obligación directo al bloque donde la quiere */
  nuevaRutina(texto, franja) {
    const fr = FRANJAS.find(x => x.id === franja) || FRANJAS[1];
    const hermanas = E.rutinas.filter(r => r.franja === fr.id);
    const r = rutinaNueva({ texto: texto.trim(), franja: fr.id, hora: pad2(fr.desde) + ":00",
      orden: (hermanas.length + 1) * 10, dias: [1, 2, 3, 4, 5], semanal: 5 });
    E.rutinas.push(r); return r;
  },
  /* Mover una parte cambia su peso: subir es «esta pesa más» */
  moverSub(r, i, paso, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    const j = i + paso; if (!sub[i] || !sub[j]) return false;
    const t = sub[i]; sub[i] = sub[j]; sub[j] = t;
    if (Rg.estadoSub(r, d).lista) d.hechas[r.id] = true; else delete d.hechas[r.id];
    return true;
  },
  /* Tocar el número cicla 1→2→3→1 y se queda así mañana, como al reescribir */
  nivel(x) { x.nivel = x.nivel >= 3 ? 1 : x.nivel + 1; },
  /* Subir y bajar un pendiente un lugar en el orden visible, cruzando de
     nivel cuando ya está en el borde. Con el dedo no se puede arrastrar: el
     navegador entiende el movimiento vertical como scroll y cancela el
     gesto antes de que empiece. Dos flechas sí funcionan en todas partes. */
  pendsDe(n) { return E.sueltos.filter(y => !y.archivada && !y.hecha && y.nivel === n)
    .sort((a, b) => a.orden - b.orden); },
  subirPend(x) {
    const l = A.pendsDe(x.nivel), i = l.findIndex(y => y.id === x.id);
    if (i > 0) { A.mover(x, x.nivel, l[i - 1].id); return true; }
    if (x.nivel > 1) { A.mover(x, x.nivel - 1, null); return true; }  /* al final del de arriba */
    return false;
  },
  bajarPend(x) {
    const l = A.pendsDe(x.nivel), i = l.findIndex(y => y.id === x.id);
    if (i >= 0 && i < l.length - 1) { A.mover(x, x.nivel, l[i + 2] ? l[i + 2].id : null); return true; }
    if (x.nivel < 3) {
      const sig = A.pendsDe(x.nivel + 1)[0];
      A.mover(x, x.nivel + 1, sig ? sig.id : null); return true;      /* al principio del de abajo */
    }
    return false;
  },
  agregar(texto, nivel) {
    const n = nivel || 2;
    const hermanos = E.sueltos.filter(x => !x.archivada && !x.hecha && x.nivel === n);
    const s = sueltoNuevo({ texto: texto.trim(), nivel: n, orden: (hermanos.length + 1) * 10 });
    E.sueltos.push(s); return s;
  },
  quitar(x, f) {
    if (x.tipo === "rutina") { const d = diaMut(f); if (!d.fuera.includes(x.id)) d.fuera.push(x.id); }
    else x.archivada = true;
  },
  traer(s) { s.archivada = false; s.creado = hoyISO(); },
  /* Marcar algo por ti: se puede quitar igual de fácil, sin ceremonia */
  porti(id, f) {
    const d = diaMut(f); d.porti = d.porti || [];
    const i = d.porti.indexOf(id);
    if (i >= 0) { d.porti.splice(i, 1); return false; }
    d.porti.push(id); return true;
  },
  nuevoPorti(texto) { const x = { id: uid(), texto: texto.trim() }; E.porti.push(x); return x; },
  quitarPorti(id) { E.porti = E.porti.filter(x => x.id !== id);
    Object.values(E.dias).forEach(d => { if (Array.isArray(d.porti)) d.porti = d.porti.filter(y => y !== id); }); },
  borrar(x) {
    if (x.tipo === "rutina") E.rutinas = E.rutinas.filter(r => r.id !== x.id);
    else E.sueltos = E.sueltos.filter(s => s.id !== x.id);
  },
  /* EL PASE — la versión digital de volver a escribir la nota. Lo que
     sobrevive suma un pase; eso es lo que después delata lo que lleva
     semanas en la lista sin hacerse. */
  pasar(ids, f) {
    Rg.paraPase(f).forEach(s => { if (ids.includes(s.id)) { s.pases += 1; s.creado = f; } else s.archivada = true; });
    diaMut(f).pase = true;
  }
};

/* ════════ 6 · VISTAS ════════ */
const S = { tab: "hoy", cara: "rutina", hoja: null, abiertas: [], pase: [] };

function pintar() {
  if (!E) return;
  $$(".tab").forEach(t => { const on = t.dataset.tab === S.tab;
    t.classList.toggle("activo", on); if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
  if (S.tab === "hoy") pintarHoy();
  else if (S.tab === "hecho") pintarHecho();
  else if (S.tab === "sonido") pintarSonido();
  else pintarSemana();
  lineaDia();
}
/* ── La línea de la izquierda ──
   Antes marcaba la hora, que es un dato que el reloj ya da: no servía de
   nada. Ahora marca lo andado del día —rutina y pendientes juntos— así que
   sube cuando tachas, no cuando pasa el tiempo. Sigue sin números. */
function lineaDia() {
  if (!E) return;
  const mk = Rg.marcador(hoyISO());
  const total = mk.rut + mk.pend, hechas = mk.rutH + mk.pendH;
  const p = total ? Math.max(0, Math.min(1, hechas / total)) : 0;
  const el = $("#cauceAndado"), lz = $("#cauceLuz"), cz = $("#cauce");
  if (el) el.style.height = (p * 100) + "%";
  if (lz) { lz.style.top = (p * 100) + "%"; lz.style.opacity = total ? "1" : "0"; }
  if (cz) cz.setAttribute("aria-label", total ? hechas + " de " + total + " del día" : "");
}

/* Un pendiente: nivel a la izquierda, se tacha al tocarlo, ⋯ para editarlo */
function filaPend(x) {
  const m = x.meta ? Rg.meta(x.meta) : null;
  const sub = [];
  if (x.pases > 0) sub.push(x.pases === 1 ? "1 pase" : x.pases + " pases");
  if (m) sub.push(m.nombre);
  return `<li class="it n${x.nivel}" data-arr="pen" data-id="${x.id}">` +
    `<button class="it-n n${x.nivel}" data-accion="nivel" data-id="${x.id}" aria-label="Nivel ${x.nivel} de ${esc(x.texto)}. Tocar para cambiar.">${x.nivel}</button>` +
    `<button class="it-t" data-accion="marcar" data-id="${x.id}" aria-pressed="false">` +
      `<span class="it-x">${esc(x.texto)}</span>` +
      (sub.length ? `<span class="it-s">${esc(sub.join(" · "))}</span>` : "") + `</button>` +
    `<span class="it-m" data-nodrag>` +
      `<button class="it-mv" data-nodrag data-accion="subir-pend" data-id="${x.id}" aria-label="Subir ${esc(x.texto)}: más prioridad">${ICO.arriba}</button>` +
      `<button class="it-mv" data-nodrag data-accion="bajar-pend" data-id="${x.id}" aria-label="Bajar ${esc(x.texto)}: menos prioridad">${ICO.abajo}</button>` +
    `</span>` +
    `<button class="it-mas" data-nodrag data-accion="ver-item" data-id="${x.id}" aria-label="Opciones de ${esc(x.texto)}">⋯</button></li>`;
}

/* Una obligación de la rutina. Si tiene partes, el galón las despliega aquí
   mismo: sin hoja que abrir ni pantalla que cerrar. */
/* El renglón de abajo de una rutina: hora, área, cadencia y partes. Sale
   aparte porque al marcar se vuelve a escribir solo él, sin repintar nada. */
function subRutina(x, f) {
  const d = diaDe(f), sem = Rg.semana(x, f), e = Rg.estadoSub(x, d);
  const partes = !e.n ? "" : e.hechas >= e.n ? "las " + e.n + ", hechas"
    : e.lista ? e.pct + "% del peso · ya cuenta"
    : e.hechas ? e.hechas + " de " + e.n + " · " + e.pct + "%"
    : e.n + " partes · con " + e.basta + " de arriba basta";
  return [x.hora || "", x.area || "",
    sem.obj > 0 ? (sem.n ? sem.n + " de " + sem.obj + " esta semana" : sem.obj + " por semana") : "",
    partes].filter(Boolean).join(" · ");
}

function filaRutina(x, f) {
  const d = diaDe(f), hecha = Rg.hecha(x, f), e = Rg.estadoSub(x, d);
  const abierta = S.abiertas.includes(x.id);
  const sub = subRutina(x, f);
  let h = `<li class="rt${hecha ? " hecha" : ""}" data-arr="rut" data-id="${x.id}">` +
    `<button class="rt-c" data-accion="marcar" data-id="${x.id}" role="checkbox" aria-checked="${hecha}" aria-label="${hecha ? "Desmarcar" : "Marcar"}: ${esc(x.texto)}"><span>${ICO.check}</span></button>` +
    `<button class="rt-t" data-accion="ver-item" data-id="${x.id}">` +
      `<span class="rt-x">${esc(x.texto)}</span>` +
      `<span class="rt-s">${esc(sub)}</span></button>` +
    (e.n ? `<button class="rt-ch${abierta ? " on" : ""}" data-nodrag data-accion="plegar" data-id="${x.id}" aria-expanded="${abierta}" aria-label="${abierta ? "Ocultar" : "Ver"} las partes de ${esc(x.texto)}">${ICO.abajo}</button>` : `<span class="rt-ch vacio"></span>`) +
    `</li>`;
  if (e.n && abierta) {
    h += `<li class="partes"><ul class="pl">` + e.sub.map((y, i) =>
      `<li class="pa${y.h ? " hecha" : ""}">` +
      `<button class="pa-t" data-accion="marcar-sub" data-id="${x.id}" data-i="${i}" role="checkbox" aria-checked="${y.h}">` +
        `<span class="pa-c">${ICO.check}</span><span class="pa-x">${esc(y.t)}</span>` +
        `<span class="pa-p">${Rg.pctSub(i, e.n)}%</span></button>` +
      `<span class="pa-m">` +
        (i > 0 ? `<button class="mover" data-accion="subir-sub" data-id="${x.id}" data-i="${i}" aria-label="Subir: ${esc(y.t)} pesa más">${ICO.arriba}</button>` : "") +
        (i < e.n - 1 ? `<button class="mover" data-accion="bajar-sub" data-id="${x.id}" data-i="${i}" aria-label="Bajar: ${esc(y.t)} pesa menos">${ICO.abajo}</button>` : "") +
        `<button class="mover x" data-accion="quitar-sub" data-id="${x.id}" data-i="${i}" aria-label="Quitar ${esc(y.t)}">✕</button>` +
      `</span></li>`).join("") +
      `</ul>` + filaAgregar(`sub_${x.id}`, "sub", "Agregar parte de hoy", true, ` data-rut="${x.id}"`) + `</li>`;
  }
  return h;
}

function saludo() {
  const h = new Date().getHours();
  return h < 6 ? "Buena madrugada" : h < 12 ? "Buenos días" : h < 20 ? "Buenas tardes" : "Buenas noches";
}
const reloj = () => { const d = new Date();
  return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };

/* ── La portada ──
   Lo primero al abrir: quién eres, qué día es, una frase, y cómo vas. El
   resumen son tres cuentas y nada más —rutina, pendientes, por ti— porque un
   tablero que mide seis cosas deja de leerse de un vistazo. La flama al lado
   es la del propósito: lo que ya sabe arder cuando las acciones pasan. */
function portada(f, mk) {
  const nom = (E.ajustes.nombre || "").trim();
  const meta = E.metas[0] || null, fl = meta ? Rg.flama(meta) : null;
  /* Un aro por cuenta. Dentro del círculo va solo el número hecho, centrado;
     el total baja a la etiqueta. Con «1/4» dentro, el grupo quedaba centrado
     pero el número no, y el aro se veía chueco. */
  const anillo = (hechas, total, et, clase) => {
    const pct = total ? hechas / total : 0, C = 100.5;   /* 2πr con r=16 */
    return `<div class="res ${clase}">` +
      `<svg viewBox="0 0 40 40" aria-hidden="true"><circle class="res-pista" cx="20" cy="20" r="16"></circle>` +
      `<circle class="res-prog" cx="20" cy="20" r="16" style="stroke-dasharray:${C};stroke-dashoffset:${(C * (1 - pct)).toFixed(1)}"></circle></svg>` +
      `<span class="res-n">${total ? hechas : "—"}</span>` +
      `<span class="res-et">${et}<i>${total ? "de " + total : "nada hoy"}</i></span></div>`;
  };
  const m = momento(new Date().getHours());
  return `<header class="port">` +
    `<button class="icono port-aj" data-accion="ajustes" aria-label="Ajustes">${ICO.ajustes}</button>` +
    `<p class="port-mom">${MOMENTO_ET[m]}</p>` +
    `<h1 class="port-h" tabindex="-1">${esc(saludo())}${nom ? ", " + esc(nom) : ""}</h1>` +
    `<p class="port-f">${esc(fechaLarga(f))} · <span id="portReloj">${reloj()}</span></p>` +
    `<p class="port-sep"><span>La palabra de hoy</span></p>` +
    `<p class="port-palabra">${esc(palabraDelDia(f, m))}</p>` +
    `<div class="resumen">` +
      anillo(mk.rutH, mk.rut, "Rutina", "r1") +
      anillo(mk.pendH, mk.pend, "Pendientes", "r2") +
      `<div class="res porti${Rg.portiHubo(f) ? " si" : ""}">` +
        `<svg viewBox="0 0 40 40" aria-hidden="true"><circle class="res-pista" cx="20" cy="20" r="16"></circle>` +
        (Rg.portiHubo(f) ? `<circle class="res-prog" cx="20" cy="20" r="16" style="stroke-dasharray:100.5;stroke-dashoffset:0"></circle>` : "") +
        `</svg><span class="res-n">${Rg.portiHubo(f) ? "sí" : "—"}</span>` +
        `<span class="res-et">Por ti<i>${Rg.portiHubo(f) ? "hoy sí" : "aún no"}</i></span></div>` +
    `</div>` +
    (meta && fl ? `<button class="port-meta" data-accion="ver-meta" data-id="${meta.id}">` +
      flamaSVG(fl.pct) + `<span class="port-meta-x"><span class="port-meta-n">${esc(meta.nombre)}</span>` +
      `<span class="port-meta-s">${fl.estado === "sin" ? "sin rutinas que la alimenten" : fl.estado === "viva" ? "va en cadencia esta semana"
        : fl.estado === "tibia" ? "va a medias esta semana" : fl.n ? "va atrás esta semana" : "esta semana no se ha movido"}</span></span></button>` : "") +
    `</header>`;
}

/* Las tres caras del día, una al lado de otra: se pasa con el dedo o tocando
   el nombre. Es el mismo gesto de Instagram, y aquí sirve porque son tres
   cosas distintas que no caben de corrido sin volverse una pared. */
const CARAS = [["rutina", "Rutina"], ["pend", "Pendientes"], ["porti", "Por ti"]];

/* Dónde empieza cada cara, medido en el momento. No se calcula multiplicando
   el ancho: si mañana el CSS le pone una sangría, la cuenta se desfasa y el
   rótulo de arriba se queda mintiendo. Preguntarle al navegador no falla. */
function caraX(c, i) { const h = c.children; return h[i] && h[0] ? h[i].offsetLeft - h[0].offsetLeft : 0; }
function caraIr(v, suave) {
  const c = $("#caras"); if (!c) return;
  const i = CARAS.findIndex(x => x[0] === v); if (i < 0) return;
  c.scrollTo({ left: caraX(c, i), behavior: suave ? "smooth" : "instant" });
}
/* Cuál está a la vista: la más cercana al scroll, no la que toca por cuenta */
function caraVista(c) {
  let j = 0, min = Infinity;
  for (let i = 0; i < c.children.length; i++) {
    const d = Math.abs(caraX(c, i) - c.scrollLeft);
    if (d < min) { min = d; j = i; }
  }
  return CARAS[j] ? CARAS[j][0] : "rutina";
}

function pintarHoy() {
  const f = hoyISO(), mk = Rg.marcador(f), bloques = Rg.porHora(f), ps = Rg.pendientes(f);
  const ahora = new Date().getHours();
  const cara = CARAS.some(c => c[0] === S.cara) ? S.cara : "rutina";
  let h = portada(f, mk);

  h += `<div class="caras-nav" role="tablist">${CARAS.map(c =>
    `<button class="cara-b${cara === c[0] ? " on" : ""}" role="tab" aria-selected="${cara === c[0]}" data-accion="cara" data-v="${c[0]}">${c[1]}</button>`).join("")}</div>`;
  h += `<div class="caras" id="caras">`;

  /* ── RUTINA ── */
  h += `<section class="cara" data-cara="rutina">`;
  h += `<p class="bloque-s">Tu rutina, en el orden en que ocurre. Si una actividad tiene partes, el galón las abre aquí mismo.</p>`;
  h += bloques.map(({ fr, items }) => {
    const hechos = items.filter(x => Rg.hecha(x, f)).length;
    const enCurso = ahora >= fr.desde && ahora < fr.hasta;
    return `<div class="franja-g${enCurso ? " ahora" : ""}" data-fr="${fr.id}"><p class="franja">${esc(fr.nombre)}` +
      `<span>${fr.desde}:00–${fr.hasta === 24 ? "24" : fr.hasta}:00</span>` +
      `<em>${items.length ? hechos + " de " + items.length : "libre"}</em></p>` +
      `<ul class="rutl" data-zona="${fr.id}">${items.map(x => filaRutina(x, f)).join("") ||
        `<li class="zona-vacia">Suelta algo aquí, o escribe abajo.</li>`}</ul>` +
      filaAgregar(`rut_${fr.id}`, "rutina", `Agregar a ${fr.nombre.toLowerCase()}`, true, ` data-franja="${fr.id}"`) + `</div>`;
  }).join("");
  h += `</section>`;

  /* ── PENDIENTES ── */
  h += `<section class="cara" data-cara="pend">`;
  h += `<p class="bloque-s">Lo suelto: pasa una vez y no tiene por qué llevar a una meta. Tres niveles; toca el número para cambiarlo.</p>`;
  const NIV = [["Primero", "lo que sí o sí hoy"], ["Después", "si el día lo permite"], ["Si da tiempo", "sin prisa"]];
  h += Rg.porNivel(f).map(({ n, items }) =>
    `<p class="niv niv${n}"><span class="niv-b">${n}</span>${NIV[n - 1][0]}<em>${NIV[n - 1][1]}</em></p>` +
    `<ul class="nota" data-zona="${n}">${items.map(filaPend).join("") || `<li class="zona-vacia">—</li>`}</ul>`).join("");
  h += filaAgregar("nuevo", "nuevo", "Agregar pendiente");
  if (ps.length > TOPE) h += `<p class="aviso-tope">Son ${ps.length} pendientes. En papel cabían nueve. Baja a nivel 3 lo que no sea de esta semana.</p>`;
  const viejo = ps.filter(x => x.pases >= 3)[0];
  if (viejo) h += `<p class="senal">${esc(viejo.texto)} lleva ${viejo.pases} pases sin hacerse. O es más chico de lo que parece, o no es de nivel ${viejo.nivel}.</p>`;
  if (mk.pendH) h += `<p class="nota-pie"><button class="enlace" data-accion="ir-hecho">${mk.pendH === 1 ? "1 pendiente hecho hoy" : mk.pendH + " pendientes hechos hoy"} · verlos</button></p>`;
  h += `</section>`;

  /* ── POR TI ──
     Sin niveles, sin horas, sin cadencia. Se escoge de la lista, no se cumple.
     Lo único que se guarda es que hubo algo: el día que no, tampoco pasa nada. */
  const hechoHoy = Rg.portiHoy(f), sem = Rg.portiSemana(f), dd = Rg.portiDias(f);
  h += `<section class="cara" data-cara="porti">`;
  /* Lo de hoy y lo de la semana juntos: eso es lo que hay que leer de un
     vistazo. La lista de abajo es solo de dónde escoger. */
  h += `<div class="porti-alza${hechoHoy.length ? " si" : ""}">` +
    `<p class="porti-t">${hechoHoy.length ? "Hoy hiciste algo por ti." : "Haz alguna cosa por ti hoy."}</p>` +
    `<p class="porti-s">${hechoHoy.length
      ? (hechoHoy.length === 1 ? "Una cosa, y con eso basta." : hechoHoy.length + " cosas. Nadie las pidió.")
      : "Nada de esto es obligación. Toca lo que sí hiciste."}</p>` +
    `<div class="porti-sem">` +
      `<span class="cad-d">${sem.map((d, i) => `<span class="d${d.hubo ? " on" : ""}${d.futuro ? " fut" : ""}">${LETRAS[(i + 1) % 7]}</span>`).join("")}</span>` +
      `<span class="porti-sem-t">${dd === 0 ? "ningún día esta semana" : dd === 1 ? "un día esta semana" : dd + " días esta semana"}</span>` +
    `</div></div>`;
  h += `<ul class="porti-l">${E.porti.map(x => {
    const on = hechoHoy.includes(x.id);
    return `<li class="pt${on ? " on" : ""}"><button class="pt-b" data-accion="porti" data-id="${x.id}" aria-pressed="${on}">` +
      `<span class="pt-c">${ICO.check}</span><span class="pt-x">${esc(x.texto)}</span></button>` +
      `<button class="pt-x2" data-nodrag data-accion="porti-quitar" data-id="${x.id}" aria-label="Quitar ${esc(x.texto)} de la lista">✕</button></li>`;
  }).join("") || `<li class="zona-vacia">La lista está vacía. Escribe abajo algo que te gustaría hacer.</li>`}</ul>`;
  h += filaAgregar("nuevoPorti", "porti", "Agregar algo que te gustaría");
  h += `</section>`;

  h += `</div>`;
  $("#vista").innerHTML = h;
  /* Dejar la cara donde estaba, sin animación: la pintada no es un gesto */
  const cont = $("#caras");
  if (cont) {
    caraIr(cara, false);
    /* Si pasa la cara con el dedo, el nombre de arriba tiene que seguirlo.
       Sin esto el panel se mueve y el rótulo se queda en el de antes. */
    let pide = 0;
    cont.addEventListener("scroll", () => {
      if (pide) return;
      pide = requestAnimationFrame(() => { pide = 0; marcarCara(caraVista(cont)); });
    }, { passive: true });
  }
}

/* Deja una sola cara como activa: el estado y el rótulo, nada más.
   No repinta —el panel ya está donde está— y así el gesto no se corta. */
function marcarCara(v) {
  if (S.cara === v) return;
  S.cara = v;
  $$(".cara-b").forEach(b => { const on = b.dataset.v === v;
    b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
}

/* ── El repositorio: lo hecho, por día. No se persigue, se consulta. ── */
function pintarHecho() {
  const dias = Rg.hechos(), n = dias.reduce((a, g) => a + g.items.length, 0);
  let h = `<header class="cab"><div><h1 class="dia" tabindex="-1">Hecho</h1>` +
    `<p class="dia-s">${n ? n + (n === 1 ? " pendiente cerrado" : " pendientes cerrados") + ", del más reciente al más viejo." : "Todavía no hay nada aquí."}</p></div></header>`;
  h += dias.map(g => `<p class="franja">${esc(fechaLarga(g.f))}<em>${g.items.length}</em></p>` +
    `<ul class="nota">${g.items.map(s => `<li class="it hecha">` +
      `<span class="it-n n${s.nivel}">${s.nivel}</span>` +
      `<button class="it-t" data-accion="reabrir" data-id="${s.id}" aria-label="Reabrir ${esc(s.texto)}">` +
      `<span class="it-x">${esc(s.texto)}</span><span class="it-s">tocar para reabrir</span></button></li>`).join("")}</ul>`).join("")
    || `<p class="vacio">Cuando marques un pendiente como hecho, se guarda aquí.</p>`;
  $("#vista").innerHTML = h;
}


/* ── La flama viva ──
   El dibujo viene tal cual de la app devocional: la elipse de brillo detrás, el cuerpo de
   la llama y el núcleo claro, respirando con `llamaViva`. Lo que cambia es qué
   la alimenta: allá una práctica, aquí las semanas del mes que llegaron al
   80/20. No se llena como una barra —arde más alto o más bajo— porque llegar
   a una meta no es contable y fingir un porcentaje sería mentir. */
/* La flama baja no es una flama apagada: al mínimo se quedaba en un tercio
   del alto y a 34px se leía como un punto, no como una flama chica. El piso
   sube a la mitad; lo que cambia sigue siendo el alto, no si se ve o no. */
function flamaSVG(pct, clase) {
  const alto = (0.5 + 0.5 * (pct / 100)).toFixed(2);
  const brillo = (0.14 + 0.3 * (pct / 100)).toFixed(2);
  return `<span class="flama-v ${clase || ""}" aria-hidden="true"><svg viewBox="0 0 120 130">` +
    `<ellipse class="nivel-glow" cx="60" cy="64" rx="44" ry="50" style="--go:${brillo}"></ellipse>` +
    `<path class="nivel-flama" style="--fl:${alto};transform-origin:50% 98px" d="M60 18 C80 52 80 82 60 98 C40 82 40 52 60 18 Z"></path>` +
    `<path class="nivel-nucleo" style="--fl:${alto};transform-origin:50% 96px" d="M60 51 C71 69 71 86 60 96 C49 86 49 69 60 51 Z"></path>` +
    `</svg></span>`;
}

function pintarSemana() {
  const f = hoyISO(), seg = Rg.seguidas(), ab = Rg.abiertos(), ar = Rg.archivados();
  let h = `<header class="cab"><div><h1 class="dia" tabindex="-1">Semana</h1>` +
    `<p class="dia-s">Del ${esc(fechaCorta(lunesDe(f)))} al ${esc(fechaCorta(sumarDias(lunesDe(f), 6)))}. La meta es la semana completa; con uno menos ya cuenta.</p></div></header>`;

  if (E.metas.length) h += `<div class="metas">${E.metas.map(m => { const fl = Rg.flama(m);
    return `<button class="meta-c ${fl.estado}" data-accion="ver-meta" data-id="${m.id}">` +
      flamaSVG(fl.pct) +
      `<span class="meta-n">${esc(m.nombre)}</span>` +
      `<span class="meta-s">${fl.estado === "sin" ? "sin rutinas" : fl.estado === "viva" ? "va en cadencia"
        : fl.estado === "tibia" ? "va a medias" : fl.n ? "va atrás" : "sin movimiento"}</span></button>`; }).join("")}</div>`;

  h += `<section class="sec"><h2 class="sec-t">Rutina</h2>`;
  h += seg.length ? `<ul class="cad">${seg.map(r => { const s = Rg.semana(r, f);
    return `<li class="cad-f${s.completo ? " completo" : s.cuenta ? " cuenta" : ""}">` +
      `<button class="cad-b" data-accion="ver-item" data-id="${r.id}">` +
      `<span class="cad-n">${esc(r.texto)}</span>` +
      `<span class="cad-d" aria-hidden="true">${s.dias.map((d, i) => `<span class="d${d.hecha ? " on" : ""}${d.futuro ? " fut" : ""}${d.toca ? "" : " no"}">${LETRAS[(i + 1) % 7]}</span>`).join("")}</span>` +
      `</button><span class="cad-c">${s.n} de ${s.obj}</span></li>`; }).join("")}</ul>`
    : `<p class="vacio">Ninguna rutina lleva cadencia semanal todavía.</p>`;
  h += `</section>`;

  h += `<section class="sec"><div class="sec-cab"><h2 class="sec-t">Pendientes abiertos</h2><span class="cuenta">${ab.length}</span></div>` +
    `<p class="sec-s">Ordenados por cuántos pases llevan. Lo de arriba es lo que más veces ha reescrito sin hacer.</p>`;
  h += ab.length ? `<ul class="nota">${ab.map(s => `<li class="it"><span class="it-n n${s.nivel}">${s.nivel}</span>` +
    `<button class="it-t" data-accion="ver-item" data-id="${s.id}"><span class="it-x">${esc(s.texto)}</span>` +
    `<span class="it-s">${s.pases ? (s.pases === 1 ? "1 pase" : s.pases + " pases") : "nuevo"}${s.meta ? " · " + esc((Rg.meta(s.meta) || {}).nombre) : ""}</span></button></li>`).join("")}</ul>`
    : `<p class="vacio">Nada abierto.</p>`;
  h += `</section>`;

  if (ar.length) h += `<details class="plegable"><summary><h2 class="sec-t">Guardado (${ar.length})</h2><span class="mas">+</span></summary>` +
    `<p class="sec-s">Fuera de la lista del día, no borrado. Tráelo cuando toque.</p><ul class="nota">` +
    ar.map(s => `<li class="it"><span class="it-n n${s.nivel}">${s.nivel}</span>` +
      `<button class="it-t" data-accion="traer" data-id="${s.id}"><span class="it-x">${esc(s.texto)}</span><span class="it-s">traer al día</span></button></li>`).join("") +
    `</ul></details>`;

  $("#vista").innerHTML = h;
}

/* ════════ 7 · HOJAS ════════ */
function hoja(tit, sub, cuerpo) {
  const a = document.activeElement;
  hoja.volver = a && a !== document.body ? a : null;
  $("#hojas").innerHTML = `<div class="velo" data-accion="cerrar-hoja"></div><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTit">` +
    `<div class="asa" aria-hidden="true"></div><h2 class="hoja-t" id="hojaTit" tabindex="-1">${tit}</h2>` +
    (sub ? `<p class="hoja-s">${sub}</p>` : "") + cuerpo + `</div>`;
  $("#appShell").setAttribute("inert", "");
  setTimeout(() => { const t = $("#hojas [data-autofoco]") || $("#hojaTit"); if (t) try { t.focus({ preventScroll: true }); } catch (e) {} }, 50);
}
/* Al cerrar, el foco vuelve al botón que la abrió. Si no, cae al body y
   quien navega con teclado o lector de pantalla pierde el lugar. */
function cerrarHoja() {
  const v = hoja.volver;
  $("#hojas").innerHTML = ""; $("#appShell").removeAttribute("inert");
  hoja.volver = null;
  if (v && document.contains(v)) { try { v.focus({ preventScroll: true }); } catch (e) {} }
}
/* ── La fila de agregar ──
   Es un <form> de verdad, no un div con un input suelto. Dos razones, las
   dos de iOS: con form, la tecla de retorno manda «Ir» y dispara submit;
   sin form a veces no dispara nada y se escribe sin que pase nada. Y el
   botón es type=submit, así que funciona aunque el teclado se cierre.
   El + además no le quita el foco al campo (ver el pointerdown de abajo). */
function filaAgregar(id, enter, ph, chico, extra) {
  return `<form class="agregar${chico ? " chico" : ""}" data-enviar="${id}">` +
    `<button type="submit" class="agregar-mas" aria-label="${esc(ph)}">${ICO.mas}</button>` +
    `<input id="${id}" data-enter="${enter}"${extra || ""} placeholder="${esc(ph)}…" ` +
    `enterkeyhint="go" autocomplete="off" autocorrect="off" aria-label="${esc(ph)}"></form>`;
}

const campo = (id, et, val, ph, tipo) => `<label class="campo"><span class="campo-et">${esc(et)}</span>` +
  `<input id="${id}" class="campo-i" type="${tipo || "text"}" value="${esc(val || "")}" placeholder="${esc(ph || "")}"></label>`;
const btn = (t, a, id, cl) => `<button class="accion${cl ? " " + cl : ""}" data-accion="${a}"${id ? ` data-id="${id}"` : ""}>${t}</button>`;
const dos = (a, b) => `<div class="acciones">${a}${b || ""}</div>`;
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };

function hojaItem(id) {
  const x = Rg.item(id); if (!x) return;
  const esRut = x.tipo === "rutina";
  const metas = [["", "Ninguna"]].concat(E.metas.map(m => [m.id, m.nombre]));
  hoja(esc(x.texto) || "Renglón",
    esRut ? "Se repite con cadencia. La semana es su unidad: la meta es completa, y con uno menos ya cuenta."
      : "Pasa una vez. Cada pase que sobrevive queda contado.",
    campo("iTxt", "Qué es", x.texto, "") +
    `<p class="campo-et">Nivel</p><div class="chips">${[1, 2, 3].map(n =>
      `<button class="chip${x.nivel === n ? " on" : ""}" data-accion="set-nivel" data-id="${x.id}" data-v="${n}">${n}</button>`).join("")}</div>` +
    campo("iHora", "Hora (opcional)", x.hora, "", "time") +
    (esRut ? `<p class="campo-et">Días</p><div class="dias">${[1, 2, 3, 4, 5, 6, 0].map(d =>
        `<button class="dia-b${(x.dias || []).includes(d) ? " on" : ""}" data-accion="set-dia" data-id="${x.id}" data-v="${d}" aria-pressed="${(x.dias || []).includes(d)}" aria-label="${DIAS_NOM[d]}">${LETRAS[d]}</button>`).join("")}</div>` +
      `<label class="campo"><span class="campo-et">¿Cuántas veces por semana quieres?</span>` +
      `<select id="iSem" class="campo-i">${[0, 1, 2, 3, 4, 5, 6, 7].map(n =>
        `<option value="${n}"${x.semanal === n ? " selected" : ""}>${n ? n + (n === 1 ? " vez" : " veces") : "Las que estén programadas"}</option>`).join("")}</select></label>` +
      `<p class="campo-ayuda">Con 4 o más, saltarte una sigue contando. Pero la semana completa es la meta.</p>` : "") +
    `<label class="campo"><span class="campo-et">Alimenta</span><select id="iMeta" class="campo-i">` +
      metas.map(m => `<option value="${m[0]}"${(x.meta || "") === m[0] ? " selected" : ""}>${esc(m[1])}</option>`).join("") + `</select></label>` +
    `<div class="acciones" style="margin-top:4px"><button class="accion" data-accion="enfocar" data-id="${x.id}">Enfocar ${METODOS[E.ajustes.metodo || 0].foco} min en esto</button></div>` +
    dos(btn("Cancelar", "cerrar-hoja"), btn("Guardar", "guardar-item", x.id, "llena")) +
    `<div class="hoja-pie">` +

/* ════════ 8 · EL PASE DIARIO ════════
   Reemplaza el arrastre automático. En papel, lo que sobrevive se vuelve a
   escribir — y esa fricción es el filtro: lo que no vale la pena reescribir,
   no valía la pena. Aquí son dos toques por renglón, no una pluma, pero la
   decisión es la misma y queda contada.                                      */
function abrirPase() {
  const f = hoyISO(), ps = Rg.paraPase(f);
  if (!ps.length) { diaMut(f).pase = true; guardar(); return; }
  S.pase = ps.map(s => s.id);
  pintarPase();
}
function pintarPase() {
  const f = hoyISO(), ps = Rg.paraPase(f);
  const cuerpo = `<div class="pase-l">${ps.map(s => {
    const on = S.pase.includes(s.id);
    return `<button class="pase-i${on ? " on" : ""}" data-accion="pase-toggle" data-id="${s.id}" aria-pressed="${on}">` +
      `<span class="pase-c" aria-hidden="true">${ICO.check}</span>` +
      `<span class="pase-x"><span class="pase-t">${esc(s.texto)}</span>` +
      `<span class="pase-s">${s.pases ? (s.pases === 1 ? "lo has pasado 1 vez" : "lo has pasado " + s.pases + " veces") : "de ayer"}</span></span></button>`;
  }).join("")}</div>`;
  $("#flujoCont").innerHTML = `<h1 class="paso-t">Lo que quedó abierto</h1>` +
    `<p class="paso-s">Marca lo que sigue hoy. Lo que no, se guarda — no se borra.</p>` +
    `<p class="gesto">${esc(fraseDelDia("pase", f))}</p>` + cuerpo +
    `<div class="paso-acc"><button class="accion llena" data-accion="pase-ok">Escribir la lista</button></div>`;
  $("#flujo").classList.remove("oculto");
  $("#appShell").setAttribute("inert", "");
}
function cerrarPase() { $("#flujo").classList.add("oculto"); $("#appShell").removeAttribute("inert"); }

/* ════════ 9 · MANEJADORES ════════ */
/* El guardado espera 200 ms para no escribir en cada tecla. En el teléfono
   la app puede morir dentro de esa espera —cambiar de app, bloquear la
   pantalla—, así que al ocultarse se escribe de inmediato. */
let guardarT = null;
function guardarYa() { clearTimeout(guardarT); guardarT = null;
  if (E) { Guardado.escribir(CLAVE, E); Sync.pendiente(); } }
function guardar() { clearTimeout(guardarT); guardarT = setTimeout(guardarYa, 200); }
function cambiar(fn) { fn(); if (E && E.marcas) E.marcas.tocado = true; guardar(); pintar(); }

/* ── Marcar sin repintar ──
   Volver a escribir toda la vista en cada toque tiene dos costos que no se
   ven en una captura: el renglón nuevo nace ya tachado, así que la línea
   nunca se dibuja, y el botón que se tocó deja de existir, así que el foco
   cae al body y un lector de pantalla pierde el lugar. Aquí se cambia la
   clase del nodo que ya está y se reescriben solo las cifras. */
function refrescarCifras(f) {
  if (!E) return;
  const mk = Rg.marcador(f), C = 100.5;
  const aro = (sel, hechas, total, pie) => {
    const e = $(sel); if (!e) return;
    const p = e.querySelector(".res-prog"), n = e.querySelector(".res-n"), i = e.querySelector(".res-et i");
    if (p) p.style.strokeDashoffset = (C * (1 - (total ? hechas / total : 0))).toFixed(1);
    if (n) n.textContent = total ? hechas : "—";
    if (i) i.textContent = total ? "de " + total : "nada hoy";
  };
  aro(".res.r1", mk.rutH, mk.rut);
  aro(".res.r2", mk.pendH, mk.pend);
  const pt = $(".res.porti"), hubo = Rg.portiHubo(f);
  if (pt) {
    pt.classList.toggle("si", hubo);
    const p = pt.querySelector(".res-prog"), n = pt.querySelector(".res-n"), i = pt.querySelector(".res-et i");
    if (p) p.style.strokeDashoffset = hubo ? "0" : String(C);
    if (n) n.textContent = hubo ? "sí" : "—";
    if (i) i.textContent = hubo ? "hoy sí" : "aún no";
  }
  /* La flama: se mueven las variables del nodo que ya está, para que la
     transición de --fl corra. Si se reemplazara el SVG, nacería en su sitio
     final y el cambio no se vería. */
  const meta = E.metas[0];
  if (meta) {
    const fl = Rg.flama(meta), alto = (0.5 + 0.5 * (fl.pct / 100)).toFixed(2);
    $$(".port-meta .nivel-flama, .port-meta .nivel-nucleo").forEach(e => e.style.setProperty("--fl", alto));
    const g = $(".port-meta .nivel-glow");
    if (g) g.style.setProperty("--go", (0.14 + 0.3 * (fl.pct / 100)).toFixed(2));
    const s = $(".port-meta-s");
    if (s) s.textContent = fl.estado === "sin" ? "sin rutinas que la alimenten"
      : fl.estado === "viva" ? "va en cadencia esta semana"
      : fl.estado === "tibia" ? "va a medias esta semana"
      : fl.n ? "va atrás esta semana" : "esta semana no se ha movido";
  }
  /* La cuenta de cada franja */
  Rg.porHora(f).forEach(({ fr, items }) => {
    const e = $(`.franja-g[data-fr="${fr.id}"] .franja em`); if (!e) return;
    const h = items.filter(x => Rg.hecha(x, f)).length;
    e.textContent = items.length ? h + " de " + items.length : "libre";
  });
  lineaDia();
}

/* Devuelve false si no pudo hacerlo en su sitio: entonces toca repintar. */
function marcarEnSitio(x, f) {
  if (x.tipo !== "rutina" || S.abiertas.includes(x.id)) return false;
  const li = $(`.rt[data-id="${x.id}"]`); if (!li) return false;
  const hecha = Rg.hecha(x, f);
  li.classList.toggle("hecha", hecha);
  const c = li.querySelector(".rt-c");
  if (c) { c.setAttribute("aria-checked", String(hecha));
    c.setAttribute("aria-label", (hecha ? "Desmarcar" : "Marcar") + ": " + x.texto); }
  const s = li.querySelector(".rt-s");
  if (s) s.textContent = subRutina(x, f);
  refrescarCifras(f);
  return true;
}
function nota(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(nota.t); nota.t = setTimeout(() => t.classList.remove("on"), 2400); }
function aplicarTema() {
  const t = E.ajustes.tema;
  const osc = t === "oscuro" || (t === "sistema" && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.modo = osc ? "oscuro" : "claro";
  const mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute("content", osc ? "#0E0D0C" : "#FAF8F3");
}

const ACC = {

    cambiar(() => { res = A.marcarSub(r, +d.i, hoyISO()); });

    const antes = Rg.marcador(f);
    /* Una rutina plegada se marca en su sitio: así se ve el tachado y el
       foco se queda en el botón. Un pendiente se va de la lista, y lo que
       está desplegado cambia de forma: ahí sí hay que volver a pintar. */
    A.marcar(x, f);
    if (E.marcas) E.marcas.tocado = true;
    guardar();

    const desp = Rg.marcador(f);

    if (desp.uno && desp.unoH === desp.uno && antes.unoH < desp.unoH) nota(frase("cierra"));
    else if (x.tipo === "suelto" && x.hecha) nota(frase("listo"));

      else if (s.obj && s.n === s.suf && s.suf < s.obj) nota(x.texto + ": " + s.n + " de " + s.obj + ". Ya cuenta; la completa sigue ahí."); } },

/* ════════ ARRASTRAR ════════
   Mantener presionado un renglón lo levanta; moverlo lo reubica; soltarlo
   lo deja donde esté. Pointer events, así que el dedo y el ratón corren por
   el mismo camino. Antes de que el renglón se levante, el gesto sigue siendo
   un scroll normal: si mueve el dedo antes de los 320 ms, la lista se
   desplaza y no pasa nada más. Esa espera es lo que deja convivir
   «desplazarme» con «mover esto» sin un control extra en cada fila.          */
const Arr = {
  t: null, el: null, fantasma: null, id: null, tipo: null, dx: 0, dy: 0, viva: false, y0: 0, x0: 0,

  inicio(e) {
    const fila = e.target.closest("[data-arr]");
    if (!fila || e.button > 0) return;
    /* El cuerpo del renglón es un botón —marcar de un toque— así que no se
       puede descartar «todo botón»: solo los controles que no deben
       secuestrarse (el ⋯, el galón, los campos). */
    if (e.target.closest("input, select, textarea, a, [data-nodrag]")) return;
    Arr.cancelar();
    Arr.el = fila; Arr.id = fila.dataset.id; Arr.tipo = fila.dataset.arr;
    Arr.x0 = e.clientX; Arr.y0 = e.clientY;
    Arr.t = setTimeout(() => Arr.levantar(e), 320);
  },

  levantar(e) {
    if (!Arr.el) return;
    Arr.viva = true;
    const r = Arr.el.getBoundingClientRect();
    Arr.dx = Arr.x0 - r.left; Arr.dy = Arr.y0 - r.top;
    const g = Arr.el.cloneNode(true);
    g.className = (Arr.tipo === "rut" ? "rutl " : "nota ") + "fantasma";
    g.style.cssText = `position:fixed;left:0;top:0;width:${r.width}px;z-index:90;pointer-events:none;margin:0;padding:0;list-style:none`;
    g.style.transform = `translate(${r.left}px,${r.top}px)`;
    document.body.appendChild(g);
    Arr.fantasma = g;
    Arr.el.classList.add("hueco");
    document.body.classList.add("arrastrando");
    try { navigator.vibrate && navigator.vibrate(12); } catch (err) {}
  },

  mueve(e) {
    if (!Arr.el) return;
    if (!Arr.viva) {
      if (Math.abs(e.clientY - Arr.y0) > 8 || Math.abs(e.clientX - Arr.x0) > 8) Arr.cancelar();
      return;
    }
    e.preventDefault();

    Arr.colocar(e.clientX, e.clientY);

       proporcional: fija, en una pantalla alta se comía media lista y
       arrastraba la vista justo cuando el destino ya estaba a la vista. */
    const h = window.innerHeight, banda = Math.min(80, h * 0.1);
    if (e.clientY < banda) $("#lienzo").scrollBy(0, -8);
    else if (e.clientY > h - banda) $("#lienzo").scrollBy(0, 8);
  },

  /* Dónde caería ahora mismo: qué zona y antes de qué renglón.
     Si no cae dentro de ninguna, gana la más cercana: soltar un poco pasado
     el último grupo debe funcionar igual, no perder el movimiento. */
  colocar(x, y) {
    const zonas = $$("[data-zona]");
    let zona = null, mejor = Infinity;
    zonas.forEach(z => { const r = z.getBoundingClientRect();
      const d = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
      if (d < mejor) { mejor = d; zona = z; } });
    $$(".zona-on").forEach(z => z.classList.remove("zona-on"));
    $$(".hueco-antes").forEach(z => z.classList.remove("hueco-antes"));
    if (!zona || mejor > 160) { Arr.destino = null; return; }
    zona.classList.add("zona-on");
    const filas = Array.from(zona.querySelectorAll("[data-arr]")).filter(f => f !== Arr.el);
    let antes = null;
    for (const f of filas) {
      const r = f.getBoundingClientRect();
      if (y < r.top + r.height / 2) { antes = f.dataset.id; f.classList.add("hueco-antes"); break; }
    }
    Arr.destino = { zona: zona.dataset.zona, antes };
  },

  fin() {
    if (Arr.t) { clearTimeout(Arr.t); Arr.t = null; }
    if (!Arr.viva) { Arr.limpiar(); return; }
    Arr.comer = true; setTimeout(() => { Arr.comer = false; }, 360);
    const d = Arr.destino, id = Arr.id;
    Arr.limpiar();
    if (!d) { pintar(); return; }
    const x = Rg.item(id); if (!x) return;
    const antesNivel = x.tipo === "suelto" ? x.nivel : null;
    const antesFranja = x.tipo === "rutina" ? x.franja : null;
    cambiar(() => A.mover(x, d.zona, d.antes));
    if (antesFranja && x.franja !== antesFranja) {
      const fr = FRANJAS.find(f => f.id === x.franja);
      nota(x.texto + " pasó a " + (fr ? fr.nombre.toLowerCase() : x.franja) + ".");
    } else if (antesNivel && x.nivel !== antesNivel) {
      nota(x.texto + ": ahora es nivel " + x.nivel + ".");
    }
  },

  cancelar() { if (Arr.t) { clearTimeout(Arr.t); Arr.t = null; } if (!Arr.viva) Arr.limpiar(); },
  /* Después de soltar viene un click: si no se traga, el renglón se marcaría */
  comer: false,
  limpiar() {
    if (Arr.t) { clearTimeout(Arr.t); Arr.t = null; }
    if (Arr.fantasma) Arr.fantasma.remove();
    if (Arr.el) Arr.el.classList.remove("hueco");
    $$(".zona-on").forEach(z => z.classList.remove("zona-on"));
    $$(".hueco-antes").forEach(z => z.classList.remove("hueco-antes"));
    document.body.classList.remove("arrastrando");
    Arr.el = null; Arr.fantasma = null; Arr.id = null; Arr.viva = false; Arr.destino = null;
  }
};
document.addEventListener("click", e => { if (Arr.comer) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener("pointerdown", Arr.inicio, { passive: true });
document.addEventListener("pointermove", Arr.mueve, { passive: false });
document.addEventListener("pointerup", Arr.fin);
document.addEventListener("pointercancel", () => Arr.limpiar());
document.addEventListener("scroll", () => { if (!Arr.viva) Arr.cancelar(); }, true);

      try{ m.forEach(x=>{ try{ x.stop(); x.disconnect(); }catch(_){} }); }catch(e){}
      try{ if(mst) mst.disconnect(); }catch(e){}

/* ════════ LOS GESTOS ════════
   La idea viene de la app devocional: una frase corta en los momentos que marcan el día,
   sin felicitar y sin regañar. No son logros ni rachas; es una voz que
   acompaña y se calla. La del día no se rifa en cada pintada —se queda la
   misma hasta mañana— para que no parpadee cada vez que marcas algo.        */
const FRASES = {
  abrir: ["Empieza por lo de arriba.", "Lo de hoy cabe en una lista.",
    "No tienes que hacerlo todo. Tienes que empezar.", "El día es tuyo.",
    "Una cosa a la vez, y la primera primero.", "Lo que importa hoy ya está escrito."],
  cierra: ["Lo que importaba, salió. Lo demás es extra.", "El día cuenta.",
    "Ya está lo que tenía que estar.", "Con esto basta. Lo que siga es de más."],
  listo: ["Queda hecho.", "Una menos.", "Va.", "Hecho.", "Sigue."],
  pase: ["Lo que no salió, vuelve a estar.", "Escribe la lista de nuevo.",
    "Lo que no vale la pena volver a escribir, no valía la pena."]
};
const frase = k => { const p = FRASES[k] || []; return p[Math.floor(Math.random() * p.length)] || ""; };
function fraseDelDia(k, f) {
  const p = FRASES[k] || []; if (!p.length) return "";
  return p[revoltura(k + f) % p.length];
}
/* Un número estable a partir de un texto: la misma fecha da siempre la misma
   frase, y dos fechas distintas casi nunca la misma. */
function revoltura(t) { let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return h; }

/* De qué momento es una hora. La noche empieza a las 20, no a medianoche:

function pedirPantalla() {
  try { if (navigator.wakeLock && !pantallaViva) navigator.wakeLock.request("screen").then(w => { pantallaViva = w; }).catch(() => {}); } catch (e) {}
}

function reproducirSonido(escena) {

}

  clearInterval(sonDormirTick); sonDormirTick = null; sonDormirFin = 0;

function iniciarDormir() {
  const min = E.ajustes.dormir || 15;
  reproducirSonido(sonidoManual || "oceano");
  sonDormirFin = Date.now() + min * 60000;
  clearTimeout(sonDormirId); sonDormirId = setTimeout(() => detenerDormir(true), min * 60000 + 400);
  clearInterval(sonDormirTick);

  hojaSonido();

  clearTimeout(sonDormirId); sonDormirId = null;

function pintarConcentra() {

  const num = $("#concentraNum"); if (num) num.textContent = m + ":" + String(sg).padStart(2, "0");
  const fase = $("#concentraFase"); if (fase) fase.textContent = Pomo.modo === "foco" ? "Enfoque" : "Descanso";
  const qu = $("#concentraQue"); if (qu) qu.textContent = Pomo.tarea || "";
  const total = (Pomo.modo === "foco" ? Pomo.foco : Pomo.descanso) * 60;
  const prog = total > 0 ? (total - r) / total : 0;
  const ring = $("#concentraProg");
  if (ring) ring.style.strokeDashoffset = String(289.03 * (1 - Math.min(1, Math.max(0, prog))));
}
function tickPomo() {
  try {
    if (!Pomo.activo) return;
    if (Date.now() >= Pomo.finMs) {
      try { Pad.campana(); } catch (e) {}
      if (Pomo.modo === "foco") {
        Pomo.vueltas += 1;
        Pomo.modo = "descanso"; Pomo.finMs = Date.now() + Pomo.descanso * 60000;
        detenerSonido();
      } else {
        Pomo.modo = "foco"; Pomo.finMs = Date.now() + Pomo.foco * 60000;
        reproducirSonido(Pomo.escena);
      }
      concentraMensaje(); pintarConcentra();
      return;
    }
    pintarConcentra();
  } catch (e) {}
}
function iniciarPomo(tarea, id) {
  const m = METODOS[E.ajustes.metodo || 0] || METODOS[0];
  Pomo.foco = m.foco; Pomo.descanso = m.descanso;
  Pomo.activo = true; Pomo.modo = "foco"; Pomo.finMs = Date.now() + Pomo.foco * 60000;
  Pomo.tarea = tarea || ""; Pomo.id = id || null; Pomo.vueltas = 0;
  reproducirSonido(Pomo.escena);
  try { cerrarHoja(); } catch (e) {}
  pedirPantalla();
  const ov = $("#concentra"); if (ov) ov.classList.remove("oculto");
  const ring = $("#concentraProg");
  if (ring) { ring.style.transition = "none"; ring.style.strokeDashoffset = "289.03"; void ring.offsetWidth;
    ring.style.transition = "stroke-dashoffset 1s linear"; }
  concentraMensaje(); pintarConcentra();
  clearInterval(Pomo.timer); Pomo.timer = setInterval(tickPomo, 1000);
  clearInterval(Pomo.msgTimer); Pomo.msgTimer = setInterval(() => { if (Pomo.activo) concentraMensaje(); }, 34000);
}
function detenerPomo() {
  const vueltas = Pomo.vueltas + (Pomo.modo === "foco" && pomoRestante() === 0 ? 1 : 0);
  Pomo.activo = false;
  clearInterval(Pomo.timer); Pomo.timer = null;
  clearInterval(Pomo.msgTimer); Pomo.msgTimer = null;
  const ov = $("#concentra"); if (ov) ov.classList.add("oculto");
  soltarPantalla(); detenerSonido();
  if (vueltas > 0) nota(vueltas === 1 ? "Un bloque de enfoque. Queda hecho." : vueltas + " bloques de enfoque.");
}

/* ════════ SINCRONIZAR ════════
   Dos dispositivos, un gist privado de GitHub. Sin servidor y sin cuenta
   nueva: solo un token guardado en cada navegador.

   Lo importante es cómo se juntan los cambios. «El último que guarda gana»
   habría sido más corto, pero pierde trabajo de verdad: marcar el gimnasio
   en el celular borraría la rutina que acaba de editar en la computadora.
   En vez de eso se comparan tres versiones —la local, la remota y la última
   que se sincronizó— y se acepta lo que cambió de un solo lado. Solo cuando
   algo cambió en los dos hay que elegir, y ahí gana lo de este dispositivo,
   avisando.                                                                */
const idx = arr => { const o = {}; (arr || []).forEach(x => { o[x.id] = x; }); return o; };
const mismo = (a, b) => JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);

/* Un día tocado en los dos lados se une en vez de elegirse: una marca es un
   hecho positivo, y perder «fui al gimnasio» sería peor que conservarlo. */
function unirDia(a, b) {
  const d = Object.assign({}, b, a);
  d.hechas = Object.assign({}, b.hechas || {}, a.hechas || {});
  d.sub = Object.assign({}, b.sub || {}, a.sub || {});
  d.fuera = [...new Set([...(a.fuera || []), ...(b.fuera || [])])];
  /* Lo que se hizo por uno se hizo, lo haya anotado el celular o la compu */
  d.porti = [...new Set([...(a.porti || []), ...(b.porti || [])])];
  d.pase = !!(a.pase || b.pase);
  return d;
}

function fusionar(base, local, remoto) {
  const out = JSON.parse(JSON.stringify(local));
  let choques = 0;

  ["metas", "rutinas", "sueltos", "porti"].forEach(k => {
    const B = idx(base && base[k]), L = idx(local[k]), R = idx(remoto[k]);
    const res = [];
    new Set([...Object.keys(L), ...Object.keys(R), ...Object.keys(B)]).forEach(id => {
      const b = B[id], l = L[id], r = R[id];
      let v = null;
      if (l && r) {
        const cl = !mismo(l, b), cr = !mismo(r, b);
        if (cl && cr && !mismo(l, r)) { v = l; choques++; } else v = cl ? l : r;
      } else if (l && !r) {
        v = (b && mismo(l, b)) ? null : l;   /* borrado allá y sin tocar aquí */
      } else if (!l && r) {
        v = (b && mismo(r, b)) ? null : r;   /* borrado aquí y sin tocar allá */
      }
      if (v) res.push(v);
    });
    out[k] = res;
  });

  const bd = (base && base.dias) || {}, ld = local.dias || {}, rd = remoto.dias || {};
  const dias = {};
  new Set([...Object.keys(ld), ...Object.keys(rd)]).forEach(f => {
    const b = bd[f], l = ld[f], r = rd[f];
    if (l && r) {
      const cl = !mismo(l, b), cr = !mismo(r, b);
      if (cl && cr && !mismo(l, r)) { dias[f] = unirDia(l, r); choques++; }
      else dias[f] = cl ? l : r;
    } else dias[f] = l || r;
  });
  out.dias = dias;
  /* Los ajustes son uno solo: si aquí no se tocaron, vale lo de allá */
  if (base && mismo(local.ajustes, base.ajustes) && remoto.ajustes) out.ajustes = remoto.ajustes;
  return { e: out, choques };
}

const Sync = {
  CLAVE_CFG: "cauce:gh", CLAVE_BASE: "cauce:base:v8", ARCHIVO: "cauce.json",
  cfg: null, estado: "apagado", cuando: null, t: null, yendo: false,

  cargar() { try { Sync.cfg = JSON.parse(localStorage.getItem(Sync.CLAVE_CFG) || "null"); } catch (e) { Sync.cfg = null; } return Sync.cfg; },
  poner(c) { Sync.cfg = c; try { localStorage.setItem(Sync.CLAVE_CFG, JSON.stringify(c)); } catch (e) {} },
  olvidar() { Sync.cfg = null; Sync.estado = "apagado";
    try { localStorage.removeItem(Sync.CLAVE_CFG); localStorage.removeItem(Sync.CLAVE_BASE); } catch (e) {} },
  activo: () => !!(Sync.cfg && Sync.cfg.token),
  base() { try { return JSON.parse(localStorage.getItem(Sync.CLAVE_BASE) || "null"); } catch (e) { return null; } },
  ponBase(e) { try { localStorage.setItem(Sync.CLAVE_BASE, JSON.stringify(e)); } catch (err) {} },

  async api(ruta, opts) {
    const r = await fetch("https://api.github.com" + ruta, Object.assign({
      headers: { Authorization: "Bearer " + Sync.cfg.token, Accept: "application/vnd.github+json" }
    }, opts || {}));
    if (r.status === 401) throw new Error("el token no sirve o caducó");
    if (r.status === 404) throw new Error("no encuentro ese gist");
    if (!r.ok) throw new Error("GitHub respondió " + r.status);
    return r.json();
  },

  /* Al cambiar algo no se sube de inmediato: se espera a que pare de teclear */
  pendiente() {
    if (!Sync.activo()) return;
    clearTimeout(Sync.t);
    Sync.t = setTimeout(() => Sync.ciclo(), 6000);
  },

  async ciclo(callado) {
    if (!Sync.activo() || Sync.yendo) return;
    Sync.yendo = true; Sync.estado = "sincronizando"; Sync.repinta();
    try {
      if (Sync.cfg.gist) {
        const g = await Sync.api("/gists/" + Sync.cfg.gist);
        const f = g.files && g.files[Sync.ARCHIVO];
        if (f) {
          const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
          let remoto = JSON.parse(txt);
          if (!(+remoto.v >= 8)) remoto = desdeViejo(remoto);
          remoto = normalizar(remoto);
          /* Un dispositivo recién estrenado trae su propia semilla, con ids
             nuevos para las mismas cosas. Fusionarla duplicaría la rutina
             entera, así que si aquí nunca se tocó nada se adopta lo de allá
             tal cual. En cuanto hay algo capturado, se fusiona. */
          if (!Sync.base() && !E.marcas.tocado) {
            E = remoto; podar(E);
            Guardado.escribir(CLAVE, E); pintar();
            if (!callado) nota("Listo: este dispositivo quedó con tus datos.");
          } else {
            const { e: fus, choques } = fusionar(Sync.base(), E, remoto);
            E = normalizar(fus); podar(E);
            Guardado.escribir(CLAVE, E); pintar();
            if (choques && !callado) nota(choques === 1
              ? "Una cosa cambió en los dos dispositivos: se quedó la de aquí."
              : choques + " cosas cambiaron en los dos dispositivos: se quedaron las de aquí.");
          }
        }
      }
      await Sync.subir();
      Sync.estado = "al día"; Sync.cuando = Date.now();
    } catch (err) {
      Sync.estado = "sin sincronizar · " + err.message;
    }
    Sync.yendo = false; Sync.repinta();
  },

  async subir() {
    const contenido = JSON.stringify(E);
    if (!Sync.cfg.gist) {
      const g = await Sync.api("/gists", { method: "POST", body: JSON.stringify({
        description: "Cauce · estado", public: false, files: { [Sync.ARCHIVO]: { content: contenido } } }) });
      Sync.poner(Object.assign({}, Sync.cfg, { gist: g.id }));
    } else {
      await Sync.api("/gists/" + Sync.cfg.gist, { method: "PATCH",
        body: JSON.stringify({ files: { [Sync.ARCHIVO]: { content: contenido } } }) });
    }
    Sync.ponBase(E);
  },

  repinta() { const el = document.getElementById("syncEstado"); if (el) el.textContent = Sync.linea(); },
  linea() {
    if (!Sync.activo()) return "No está conectado. Este dispositivo guarda solo lo suyo.";
    if (Sync.estado === "al día" && Sync.cuando) {
      const m = Math.round((Date.now() - Sync.cuando) / 60000);
      return "Al día · " + (m < 1 ? "hace un momento" : m < 60 ? "hace " + m + " min" : "hace " + Math.round(m / 60) + " h");
    }
    return Sync.estado.charAt(0).toUpperCase() + Sync.estado.slice(1);
  }
};
/* Al cerrar o esconder la app, subir lo último antes de que se vaya */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && Sync.activo()) { clearTimeout(Sync.t); Sync.ciclo(true); }
});

/* ════════ 10 · SEMILLA ════════ */

/* ════════ 11 · ARRANQUE ════════ */

/* Vertical y ya. Solo funciona instalada como app —en el navegador el
   permiso no existe y tira error—, así que si falla no importa: queda el
   aviso de girar el teléfono, que es la misma idea sin permisos. */
try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(() => {}); } catch (e) {}

/* El día cambia a medianoche, no al abrir la app. Instalada como PWA puede
   seguir viva de un día para otro: sin revisar esto al volver, a la mañana
   siguiente muestra la lista de ayer, ya tachada. */
function revisarDia() {
  if (!E) return;
  const f = hoyISO();
  if (E.marcas.ultimoDia === f) return;
  E.marcas.ultimoDia = f; guardarYa(); pintar();
  if (!diaDe(f).pase) abrirPase();
}
/* El reloj de la portada no se vuelve a pintar solo: sin esto se queda con
   la hora de cuando se abrió la app, que es peor que no ponerla. */
function tocarReloj() { const e = $("#portReloj"); if (e) e.textContent = reloj(); }
setInterval(tocarReloj, 30000);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { guardarYa(); return; }
  revisarDia(); tocarReloj();
});
addEventListener("pagehide", guardarYa);

async function arrancar() {
  let g = await Guardado.leer(CLAVE);
  if (!g) {
    for (const k of VIEJAS) { const v = await Guardado.leer(k); if (v && Array.isArray(v.metas)) { g = desdeViejo(v); break; } }
  }
  if (!g) g = semilla();
  E = normalizar(g); podar(E); aplicarTema(); pintar();
  const f = hoyISO();
  if (E.marcas.ultimoDia !== f) { E.marcas.ultimoDia = f; guardar(); if (!diaDe(f).pase) abrirPase(); }
  /* Lo del otro dispositivo llega después de pintar: la app abre al instante
     aunque la red esté lenta o no haya. */
  Sync.cargar();
  if (Sync.activo()) setTimeout(() => Sync.ciclo(true), 400);
}
arrancar();

/* Service worker: la app abre sin señal y, con señal, siempre con la
   última versión. Si el navegador no lo soporta, no pasa nada: la página
   sigue funcionando igual, solo pierde el modo sin conexión. */
if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});

}
