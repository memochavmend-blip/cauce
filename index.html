/* ════════ ARRASTRAR ════════
   Mantener presionado un renglón lo levanta; moverlo lo reubica; soltarlo
   lo deja donde esté. Pointer events, así que el dedo y el ratón corren por
   el mismo camino. Antes de que el renglón se levante, el gesto sigue siendo
   un scroll normal: si mueve el dedo antes de los 320 ms, la lista se
   desplaza y no pasa nada más. Esa espera es lo que deja convivir
   «desplazarme» con «mover esto» sin un control extra en cada fila.          */
const Arr = {
  t: null, el: null, fantasma: null, id: null, tipo: null, dx: 0, dy: 0, viva: false, y0: 0, x0: 0,

  inicio(e) {
    const fila = e.target.closest("[data-arr]");
    if (!fila || e.button > 0) return;
    /* El cuerpo del renglón es un botón —marcar de un toque— así que no se
       puede descartar «todo botón»: solo los controles que no deben
       secuestrarse (el ⋯, el galón, los campos). */
    if (e.target.closest("input, select, textarea, a, [data-nodrag]")) return;
    Arr.cancelar();
    Arr.el = fila; Arr.id = fila.dataset.id; Arr.tipo = fila.dataset.arr;
    Arr.x0 = e.clientX; Arr.y0 = e.clientY;
    Arr.t = setTimeout(() => Arr.levantar(e), 320);
  },

  levantar(e) {
    if (!Arr.el) return;
    Arr.viva = true;
    const r = Arr.el.getBoundingClientRect();
    Arr.dx = Arr.x0 - r.left; Arr.dy = Arr.y0 - r.top;
    const g = Arr.el.cloneNode(true);
    g.className = (Arr.tipo === "rut" ? "rutl " : "nota ") + "fantasma";
    g.style.cssText = `position:fixed;left:0;top:0;width:${r.width}px;z-index:90;pointer-events:none;margin:0;padding:0;list-style:none`;
    g.style.transform = `translate(${r.left}px,${r.top}px)`;
    document.body.appendChild(g);
    Arr.fantasma = g;
    Arr.el.classList.add("hueco");
    document.body.classList.add("arrastrando");
    try { navigator.vibrate && navigator.vibrate(12); } catch (err) {}
  },

  mueve(e) {
    if (!Arr.el) return;
    if (!Arr.viva) {
      if (Math.abs(e.clientY - Arr.y0) > 8 || Math.abs(e.clientX - Arr.x0) > 8) Arr.cancelar();
      return;
    }
    e.preventDefault();
    Arr.fantasma.style.transform = `translate(${e.clientX - Arr.dx}px,${e.clientY - Arr.dy}px)`;
    Arr.colocar(e.clientX, e.clientY);
    /* Cerca de un borde la pantalla acompaña al dedo, pero con una banda
       proporcional: fija, en una pantalla alta se comía media lista y
       arrastraba la vista justo cuando el destino ya estaba a la vista. */
    const h = window.innerHeight, banda = Math.min(80, h * 0.1);
    if (e.clientY < banda) $("#lienzo").scrollBy(0, -8);
    else if (e.clientY > h - banda) $("#lienzo").scrollBy(0, 8);
  },

  /* Dónde caería ahora mismo: qué zona y antes de qué renglón.
     Si no cae dentro de ninguna, gana la más cercana: soltar un poco pasado
     el último grupo debe funcionar igual, no perder el movimiento. */
  colocar(x, y) {
    const zonas = $$("[data-zona]");
    let zona = null, mejor = Infinity;
    zonas.forEach(z => { const r = z.getBoundingClientRect();
      const d = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
      if (d < mejor) { mejor = d; zona = z; } });
    $$(".zona-on").forEach(z => z.classList.remove("zona-on"));
    $$(".hueco-antes").forEach(z => z.classList.remove("hueco-antes"));
    if (!zona || mejor > 160) { Arr.destino = null; return; }
    zona.classList.add("zona-on");
    const filas = Array.from(zona.querySelectorAll("[data-arr]")).filter(f => f !== Arr.el);
    let antes = null;
    for (const f of filas) {
      const r = f.getBoundingClientRect();
      if (y < r.top + r.height / 2) { antes = f.dataset.id; f.classList.add("hueco-antes"); break; }
    }
    Arr.destino = { zona: zona.dataset.zona, antes };
  },

  fin() {
    if (Arr.t) { clearTimeout(Arr.t); Arr.t = null; }
    if (!Arr.viva) { Arr.limpiar(); return; }
    Arr.comer = true; setTimeout(() => { Arr.comer = false; }, 360);
    const d = Arr.destino, id = Arr.id;
    Arr.limpiar();
    if (!d) { pintar(); return; }
    const x = Rg.item(id); if (!x) return;
    const antesNivel = x.tipo === "suelto" ? x.nivel : null;
    const antesFranja = x.tipo === "rutina" ? x.franja : null;
    cambiar(() => A.mover(x, d.zona, d.antes));
    if (antesFranja && x.franja !== antesFranja) {
      const fr = FRANJAS.find(f => f.id === x.franja);
      nota(x.texto + " pasó a " + (fr ? fr.nombre.toLowerCase() : x.franja) + ".");
    } else if (antesNivel && x.nivel !== antesNivel) {
      nota(x.texto + ": ahora es nivel " + x.nivel + ".");
    }
  },

  cancelar() { if (Arr.t) { clearTimeout(Arr.t); Arr.t = null; } if (!Arr.viva) Arr.limpiar(); },

      master.gain.linearRampToValueAtTime(.0001, ctx.currentTime + Math.max(.05,s));
    }catch(e){}
    clearInterval(prog); prog = null; marea = null;
    const f = fuentes, m = moduladores, mst = master, bs = bus; vivo=false;
    // Detenemos y desconectamos nodos, pero NO cerramos el contexto (se reutiliza).
    setTimeout(()=>{
      try{ f.forEach(x=>{ try{ x.stop(); x.disconnect(); }catch(_){} }); }catch(e){}
      try{ m.forEach(x=>{ try{ x.stop(); x.disconnect(); }catch(_){} }); }catch(e){}
      try{ if(mst) mst.disconnect(); }catch(e){}
      try{ if(bs) bs.disconnect(); }catch(e){}
    }, s*1000+400);
    fuentes=[]; moduladores=[]; master=null; bus=null;
  }
  function campana(){
    try{
      const c = contexto(); if(!c) return; try{ c.resume(); }catch(e){}
      const t = c.currentTime;
      [880, 1318.5].forEach((f,i)=>{
        const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f;
        const g = c.createGain();
        g.gain.setValueAtTime(0, t + i*0.18);
        g.gain.linearRampToValueAtTime(0.14, t + i*0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.18 + 0.6);
        o.connect(g); g.connect(c.destination);
        o.start(t + i*0.18); o.stop(t + i*0.18 + 0.65);
      });
    }catch(e){}
  }
  function respirar(abierto, ms){
    if(!vivo || !ctx) return;
    const c = ctx, t = c.currentTime, tc = Math.max(.3, (ms || 4000)/1000) / 3;
    try{
      if(marea){
        marea.filtro.frequency.setTargetAtTime(abierto ? 2600 : 380, t, tc);
        marea.ola.gain.setTargetAtTime(abierto ? 1.0 : .14, t, tc);
        marea.dron.gain.setTargetAtTime(abierto ? .7 : .3, t, tc);
        if(abierto && marea.dentro !== true) nota(c, t + .02, 659.25, 0, .22, bus);   // campanita al empezar a inhalar
        marea.dentro = !!abierto;
      } else if(bus && actual !== "descenso"){
        bus.gain.setTargetAtTime(abierto ? 1 : .8, t, tc);
      }
    }catch(e){}
  }
  function escuchar(fn){ oyente = fn || null; }
  return { iniciar, detener, volumen, activo:()=>vivo, escena:()=>(vivo ? actual : null), desbloquear, campana, respirar, escuchar };
})();

/* ════════ LOS GESTOS ════════
   La idea viene de la app devocional: una frase corta en los momentos que marcan el día,
   sin felicitar y sin regañar. No son logros ni rachas; es una voz que
   acompaña y se calla. La del día no se rifa en cada pintada —se queda la
   misma hasta mañana— para que no parpadee cada vez que marcas algo.        */
const FRASES = {
  abrir: ["Empieza por lo de arriba.", "Lo de hoy cabe en una lista.",
    "No tienes que hacerlo todo. Tienes que empezar.", "El día es tuyo.",
    "Una cosa a la vez, y la primera primero.", "Lo que importa hoy ya está escrito."],
  cierra: ["Lo que importaba, salió. Lo demás es extra.", "El día cuenta.",
    "Ya está lo que tenía que estar.", "Con esto basta. Lo que siga es de más."],
  listo: ["Queda hecho.", "Una menos.", "Va.", "Hecho.", "Sigue."],
  pase: ["Lo que no salió, vuelve a estar.", "Escribe la lista de nuevo.",
    "Lo que no vale la pena volver a escribir, no valía la pena."]
};
const frase = k => { const p = FRASES[k] || []; return p[Math.floor(Math.random() * p.length)] || ""; };
function fraseDelDia(k, f) {
  const p = FRASES[k] || []; if (!p.length) return "";
  let h = 0; const t = k + f;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return p[h % p.length];
}

/* ════════ SINCRONIZAR ════════
   Dos dispositivos, un gist privado de GitHub. Sin servidor y sin cuenta
   nueva: solo un token guardado en cada navegador.

   Lo importante es cómo se juntan los cambios. «El último que guarda gana»
   habría sido más corto, pero pierde trabajo de verdad: marcar el gimnasio
   en el celular borraría la rutina que acaba de editar en la computadora.
   En vez de eso se comparan tres versiones —la local, la remota y la última
   que se sincronizó— y se acepta lo que cambió de un solo lado. Solo cuando
   algo cambió en los dos hay que elegir, y ahí gana lo de este dispositivo,
   avisando.                                                                */
const idx = arr => { const o = {}; (arr || []).forEach(x => { o[x.id] = x; }); return o; };
const mismo = (a, b) => JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);

/* Un día tocado en los dos lados se une en vez de elegirse: una marca es un
   hecho positivo, y perder «fui al gimnasio» sería peor que conservarlo. */
function unirDia(a, b) {
  const d = Object.assign({}, b, a);
  d.hechas = Object.assign({}, b.hechas || {}, a.hechas || {});
  d.sub = Object.assign({}, b.sub || {}, a.sub || {});
  d.fuera = [...new Set([...(a.fuera || []), ...(b.fuera || [])])];
  d.pase = !!(a.pase || b.pase);
  return d;
}

function fusionar(base, local, remoto) {
  const out = JSON.parse(JSON.stringify(local));
  let choques = 0;

  ["metas", "rutinas", "sueltos"].forEach(k => {
    const B = idx(base && base[k]), L = idx(local[k]), R = idx(remoto[k]);
    const res = [];
    new Set([...Object.keys(L), ...Object.keys(R), ...Object.keys(B)]).forEach(id => {
      const b = B[id], l = L[id], r = R[id];
      let v = null;
      if (l && r) {
        const cl = !mismo(l, b), cr = !mismo(r, b);
        if (cl && cr && !mismo(l, r)) { v = l; choques++; } else v = cl ? l : r;
      } else if (l && !r) {
        v = (b && mismo(l, b)) ? null : l;   /* borrado allá y sin tocar aquí */
      } else if (!l && r) {
        v = (b && mismo(r, b)) ? null : r;   /* borrado aquí y sin tocar allá */
      }
      if (v) res.push(v);
    });
    out[k] = res;
  });

  const bd = (base && base.dias) || {}, ld = local.dias || {}, rd = remoto.dias || {};
  const dias = {};
  new Set([...Object.keys(ld), ...Object.keys(rd)]).forEach(f => {
    const b = bd[f], l = ld[f], r = rd[f];
    if (l && r) {
      const cl = !mismo(l, b), cr = !mismo(r, b);
      if (cl && cr && !mismo(l, r)) { dias[f] = unirDia(l, r); choques++; }
      else dias[f] = cl ? l : r;
    } else dias[f] = l || r;
  });
  out.dias = dias;
  /* Los ajustes son uno solo: si aquí no se tocaron, vale lo de allá */
  if (base && mismo(local.ajustes, base.ajustes) && remoto.ajustes) out.ajustes = remoto.ajustes;
  return { e: out, choques };
}

const Sync = {
  CLAVE_CFG: "cauce:gh", CLAVE_BASE: "cauce:base:v8", ARCHIVO: "cauce.json",
  cfg: null, estado: "apagado", cuando: null, t: null, yendo: false,

  cargar() { try { Sync.cfg = JSON.parse(localStorage.getItem(Sync.CLAVE_CFG) || "null"); } catch (e) { Sync.cfg = null; } return Sync.cfg; },
  poner(c) { Sync.cfg = c; try { localStorage.setItem(Sync.CLAVE_CFG, JSON.stringify(c)); } catch (e) {} },
  olvidar() { Sync.cfg = null; Sync.estado = "apagado";
    try { localStorage.removeItem(Sync.CLAVE_CFG); localStorage.removeItem(Sync.CLAVE_BASE); } catch (e) {} },
  activo: () => !!(Sync.cfg && Sync.cfg.token),
  base() { try { return JSON.parse(localStorage.getItem(Sync.CLAVE_BASE) || "null"); } catch (e) { return null; } },
  ponBase(e) { try { localStorage.setItem(Sync.CLAVE_BASE, JSON.stringify(e)); } catch (err) {} },

  async api(ruta, opts) {
    const r = await fetch("https://api.github.com" + ruta, Object.assign({
      headers: { Authorization: "Bearer " + Sync.cfg.token, Accept: "application/vnd.github+json" }
    }, opts || {}));
    if (r.status === 401) throw new Error("el token no sirve o caducó");
    if (r.status === 404) throw new Error("no encuentro ese gist");
    if (!r.ok) throw new Error("GitHub respondió " + r.status);
    return r.json();
  },

  /* Al cambiar algo no se sube de inmediato: se espera a que pare de teclear */
  pendiente() {
    if (!Sync.activo()) return;
    clearTimeout(Sync.t);
    Sync.t = setTimeout(() => Sync.ciclo(), 6000);
  },

  async ciclo(callado) {
    if (!Sync.activo() || Sync.yendo) return;
    Sync.yendo = true; Sync.estado = "sincronizando"; Sync.repinta();
    try {
      if (Sync.cfg.gist) {
        const g = await Sync.api("/gists/" + Sync.cfg.gist);
        const f = g.files && g.files[Sync.ARCHIVO];
        if (f) {
          const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
          let remoto = JSON.parse(txt);
          if (!(+remoto.v >= 8)) remoto = desdeViejo(remoto);
          remoto = normalizar(remoto);
          /* Un dispositivo recién estrenado trae su propia semilla, con ids
             nuevos para las mismas cosas. Fusionarla duplicaría la rutina
             entera, así que si aquí nunca se tocó nada se adopta lo de allá
             tal cual. En cuanto hay algo capturado, se fusiona. */
          if (!Sync.base() && !E.marcas.tocado) {
            E = remoto; podar(E);
            Guardado.escribir(CLAVE, E); pintar();
            if (!callado) nota("Listo: este dispositivo quedó con tus datos.");
          } else {
            const { e: fus, choques } = fusionar(Sync.base(), E, remoto);
            E = normalizar(fus); podar(E);
            Guardado.escribir(CLAVE, E); pintar();
            if (choques && !callado) nota(choques === 1
              ? "Una cosa cambió en los dos dispositivos: se quedó la de aquí."
              : choques + " cosas cambiaron en los dos dispositivos: se quedaron las de aquí.");
          }
        }
      }
      await Sync.subir();
      Sync.estado = "al día"; Sync.cuando = Date.now();
    } catch (err) {
      Sync.estado = "sin sincronizar · " + err.message;
    }
    Sync.yendo = false; Sync.repinta();
  },

  async subir() {
    const contenido = JSON.stringify(E);
    if (!Sync.cfg.gist) {
      const g = await Sync.api("/gists", { method: "POST", body: JSON.stringify({
        description: "Cauce · estado", public: false, files: { [Sync.ARCHIVO]: { content: contenido } } }) });
      Sync.poner(Object.assign({}, Sync.cfg, { gist: g.id }));
    } else {
      await Sync.api("/gists/" + Sync.cfg.gist, { method: "PATCH",
        body: JSON.stringify({ files: { [Sync.ARCHIVO]: { content: contenido } } }) });
    }
    Sync.ponBase(E);
  },

  repinta() { const el = document.getElementById("syncEstado"); if (el) el.textContent = Sync.linea(); },
  linea() {
    if (!Sync.activo()) return "No está conectado. Este dispositivo guarda solo lo suyo.";
    if (Sync.estado === "al día" && Sync.cuando) {
      const m = Math.round((Date.now() - Sync.cuando) / 60000);
      return "Al día · " + (m < 1 ? "hace un momento" : m < 60 ? "hace " + m + " min" : "hace " + Math.round(m / 60) + " h");
    }
    return Sync.estado.charAt(0).toUpperCase() + Sync.estado.slice(1);
  }
};
/* Al cerrar o esconder la app, subir lo último antes de que se vaya */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && Sync.activo()) { clearTimeout(Sync.t); Sync.ciclo(true); }
});

/* ════════ 10 · SEMILLA ════════ */
function semilla() {
  const pasion = { id: uid(), nombre: "Xaman", lane: "pasion" };
  const r = (texto, o) => rutinaNueva(Object.assign({ texto }, o));
  return normalizar({
    v: VERSION,
    /* Sin nombre a propósito: la app no lo necesita y la página es pública.
       Se pone desde Ajustes, y eso vive solo en el navegador de cada quien. */
    ajustes: { nombre: "", tema: "sistema", proposito: "Llevar el volante de mi vida. Que avance por acciones mías y no por la corriente.", vista: "nivel" },
    metas: [pasion],
    rutinas: [
      r("Gym", { nivel: 1, hora: "05:30", area: "Cuerpo", dias: [1, 2, 3, 4, 5], semanal: 5,
        pasos: ["Fuerza", "Calentar", "Cardio", "Estirar"] }),
      r("Trading · posiciones después del cierre", { nivel: 1, hora: "15:15", dias: [1, 2, 3, 4, 5], semanal: 5 }),
      r("MBA · una hora, el envío al día", { nivel: 2, hora: "18:00", dias: [1, 2, 3, 4, 5], semanal: 5 }),
      r("Oración y meditación", { nivel: 2, hora: "06:30", dias: [1, 2, 3, 4, 5, 6, 0], semanal: 7 }),
      r("Xaman · sesión de música", { nivel: 2, hora: "19:30", area: "Otro", dias: [2, 4, 6], semanal: 3, meta: pasion.id,
        pasos: ["Grabar o mezclar 60 minutos en una toma", "Elegir y preparar tracks nuevos", "Escuchar lo grabado y anotar tres cosas", "Mover una pieza de producción"] }),

    ],

    ],
    dias: {}, marcas: { onboarding: true, ultimoDia: null, tocado: false }
  });
}

/* ════════ 11 · ARRANQUE ════════ */
async function arrancar() {
  let g = await Guardado.leer(CLAVE);
  if (!g) {
    for (const k of VIEJAS) { const v = await Guardado.leer(k); if (v && Array.isArray(v.metas)) { g = desdeViejo(v); break; } }
  }
  if (!g) g = semilla();
  E = normalizar(g); podar(E); aplicarTema(); pintar();
  const f = hoyISO();
  if (E.marcas.ultimoDia !== f) { E.marcas.ultimoDia = f; guardar(); if (!diaDe(f).pase) abrirPase(); }
  /* Lo del otro dispositivo llega después de pintar: la app abre al instante
     aunque la red esté lenta o no haya. */
  Sync.cargar();
  if (Sync.activo()) setTimeout(() => Sync.ciclo(true), 400);
}
arrancar();

</script>
<script>
/* Service worker: la app abre sin señal y, con señal, siempre con la
   última versión. Si el navegador no lo soporta, no pasa nada: la página
   sigue funcionando igual, solo pierde el modo sin conexión. */
if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
