/* ── Cerrar el día ── */
function flujoCerrarDia(){
  const f = hoyISO(), d = diaDe(f);
  const acciones = d.tres.concat(d.sec).map(accion).filter(Boolean);
  const abiertasA = acciones.filter(a => !a.hecha), abiertosP = Rg.pendHoy(f).filter(p => !p.hecha);
  const hechas = E.acciones.filter(a => a.hecha && a.hechaEl === f).map(a => a.texto)
    .concat(Rg.rutinasHoy(f).filter(r => d.rutHechas[r.id]).map(r => r.nombre), E.pendientes.filter(p => p.hecha && p.hechaEl === f).map(p => p.texto));
  const ctx = { dec: {} };
  abiertasA.forEach(a => { ctx.dec[a.id] = "manana"; }); abiertosP.forEach(p => { ctx.dec[p.id] = "manana"; });
  const final = { sinAtras: true,
    html: () => P.tit("Listo por hoy.") + P.txt("Mañana empiezas limpio. Lo que pasó a mañana te estará esperando como sugerencia al planear.") + P.btn("Cerrar"),
    montar: c => {
      if(c.aplicado) return; const man = sumarDias(hoyISO(), 1);
      abiertasA.forEach(a => { if(c.dec[a.id] === "manana") A.posponer(a); else { delete a.sugerir; a.pospuesta = 0; } });
      abiertosP.forEach(p => { if(c.dec[p.id] === "soltar") E.pendientes = E.pendientes.filter(x => x.id !== p.id); else p.fecha = man; });
      diaMut(hoyISO()).cerrado = true; c.aplicado = true; guardar();
    } };
  const pasos = [{ html: () => P.tit("Lo que hiciste hoy") + (hechas.length ? `<div class="lista" style="margin:0 0 24px">${hechas.map(t => `<div class="tarea hecha"><span class="check" aria-hidden="true"><span class="check-c">${ICO.check}</span></span><span class="tarea-cuerpo"><span class="tarea-t" style="text-decoration:none">${esc(t)}</span></span></div>`).join("")}</div>` : P.txt("Hoy no marcaste nada. Pasa; mañana empiezas limpio.")) + P.btn("Seguir") }];
  if(abiertasA.length || abiertosP.length) pasos.push({
    html: c => P.tit("Lo que quedó abierto") + P.txt("Sin culpa. Decide a dónde va cada cosa; por defecto, a mañana.") +
      `<div class="lista" style="margin:0 0 24px">${abiertasA.map(a => filaDecision(a.id, a.texto, [["manana", "Mañana"], ["lista", "A su lista"]], c)).join("")}${abiertosP.map(p => filaDecision(p.id, p.texto, [["manana", "Mañana"], ["soltar", "Soltar"]], c)).join("")}</div>` + P.btn("Seguir"),
    leer: c => { const rep = abiertasA.filter(a => c.dec[a.id] === "manana" && (a.pospuesta || 0) >= 1 && !(a.compromiso && a.compromiso.con));
      restantes(rep.map(a => pasoCompromiso(a.id)).concat([pasoDiario, final])); }
  });
  pasos.push(pasoDiario, final);
  abrirFlujo(pasos, { ctx });
}
/* Lo que ya se movió dos veces no se destraba solo: o se compromete con alguien, o se hace más chico */
const pasoCompromiso = id => ({
  html: () => { const a = accion(id); if(!a) return P.tit("—") + P.btn("Seguir");
    return P.tit("Esto ya lo moviste " + ((a.pospuesta || 0) + 1) + " veces") + P.txt("No es falta de disciplina: le falta un compromiso. Dile a alguien, ponle fecha con otra persona, o hazlo más chico.") +
      `<p class="paso-preg">${esc(a.texto)}</p>` +

/* ── Etapas: aplicar una lista nueva sin perder acciones ── */
function aplicarEtapas(m, nombres){
  const viejas = m.etapas.slice(), usadas = new Set();
  m.etapas = nombres.map((n, k) => {
    let ex = viejas.find(e => e.nombre === n && !usadas.has(e.id));
    if(!ex && viejas[k] && !usadas.has(viejas[k].id) && !nombres.includes(viejas[k].nombre)) ex = viejas[k];
    if(ex){ usadas.add(ex.id); ex.nombre = n; return ex; }
    return { id: uid(), nombre: n, hecha: false };
  });
  const ids = new Set(m.etapas.map(e => e.id)), destino = (Rg.etapaActual(m) || m.etapas[0] || {}).id || null;
  E.acciones.forEach(a => { if(a.metaId === m.id && !ids.has(a.etapaId)) a.etapaId = destino; });
}

/* ── Revisar metas (cada temporada) ── */
function flujoRevisarMetas(){
  const ctx = { fin: domingoTras(hoyISO(), 12) };
  const pasos = [{ html: () => P.tit("Revisar metas") + P.txt("Tienes dos lugares: uno manda y otro acompaña. Aquí decides si tus metas siguen, si terminaron o si cambias alguna. Lo que espera puede ocupar un lugar libre.") + P.btn("Empezar") }];
  Rg.activas().forEach(m => pasos.push(pasoRMeta(m.id)));
  pasos.push(pasoRLugar);
  abrirFlujo(pasos.concat(colaRevisar()), { ctx });
}
const colaRevisar = () => [pasoRPrincipal, pasoRFecha, pasoRFin];
const pasoRMeta = id => ({
  html: c => {
    const m = Rg.meta(id); if(!m) return P.tit("—") + P.btn("Seguir");

      (m.protegida ? P.inp("rpRaz", "Es tu activo principal: si deja de ser meta, ¿por qué?", "", "Solo si eliges «Terminó» o «La cambio»") : "") + P.err() +
      `<div class="onb-opts">${P.opc("Sigue", "sigue", "Continúa esta temporada con su ruta.")}${P.opc("Terminó", "termino", "Ya existe lo que querías. Libera su lugar.")}${P.opc("La cambio", "cambio", "Sale de tus metas y pasa a En espera.")}</div>`;
  },

const pasoRDefinir = {
  html: c => {
    const i = c.origen.indexOf("i:") === 0 ? E.ideas.find(x => x.id === c.origen.slice(2)) : null, vieja = i && i.metaId ? Rg.meta(i.metaId) : null;
    return P.tit("Defínela por su final") + P.inp("dmNom", "Nombre", vieja ? vieja.nombre : i ? i.texto : "", "Ej. Trading") +
      P.area("dmRes", "Resultado: ¿qué va a existir?", vieja ? vieja.resultado : "", "Algo que se pueda ver", 2) +
      P.area("dmFin", "Terminado cuando…", vieja ? vieja.terminadoCuando : "", "La versión suficiente, no la perfecta", 2) +
      P.area("dmEt", "Etapas (una por línea, en orden)", vieja ? vieja.etapas.map(e => e.nombre).join("\n") : "", "Ej.\nSimplificar el manual\nProbar con reglas congeladas\nOperar", 4) + P.err() + P.btn("Guardar meta");
  },
  leer: c => {
    if(c.definida) return;
    const nom = val("dmNom"), res = val("dmRes"), et = val("dmEt").split("\n").map(x => x.trim()).filter(Boolean);
    if(!nom || !res) return errorPaso("Faltan el nombre y el resultado.");
    if(!et.length) return errorPaso("Escribe al menos una etapa: es lo que te dirá por dónde empezar.");
    const i = c.origen.indexOf("i:") === 0 ? E.ideas.find(x => x.id === c.origen.slice(2)) : null;
    const rol = c.libres.includes("principal") ? "principal" : "secundaria";

    c.definida = true;
  }
};

  "mueve": d => { const a = pieza(d.id); if(!a) return; let r; cambiar(() => { r = A.mueve(a); diaMut(hoyISO()).planeado = true; });
    if(r === "lleno") return errorPaso("Ya tienes dos. Quita una primero: son el 20%, no la lista completa.");
    cerrarHoja(); nota(r === "quitada" ? "Fuera de las 2." : "Es una de las 2 que mueven hoy."); },
  "elegir": d => hojaElegir(d.cual),
  "elegir-hoy": d => { const a = pieza(d.id); if(!a) return; let r;
    if(d.cual === "mueven"){ cambiar(() => { r = A.mueve(a); diaMut(hoyISO()).planeado = true; });
      if(r === "lleno") return errorPaso("Ya tienes dos. Quita una primero."); cerrarHoja(); nota("Es una de las 2 que mueven hoy."); return; }
    cambiar(() => { r = A.aHoy(a); const dd = diaMut(hoyISO()); if(dd.tres.length >= MAX_TRES) dd.planeado = true; });
    if(r === "lleno") return errorPaso("Ya tienes tus 3 para hoy. Termina o quita una primero."); cerrarHoja(); nota("Sumada a tu día."); },
  "para-hoy": d => { const a = accion(d.id); if(!a) return; let r; cambiar(() => { r = A.aHoy(a); });
    if(r === "lleno") return errorPaso("Ya tienes tus 3 para hoy. Termina o quita una primero."); cerrarHoja(); nota(r === "ya" ? "Ya estaba en tu día." : "Sumada a tu día."); },
  "quitar-hoy": d => { const a = accion(d.id); if(!a) return; cambiar(() => A.quitarDeHoy(a)); cerrarHoja(); nota("Quitada de hoy. Sigue en su ruta."); },
  "guardar-accion": d => { const a = accion(d.id); if(!a) return;
    cambiar(() => { a.texto = val("aTxt") || a.texto; const e = val("aEtapa"); if(e && e !== a.etapaId){ a.etapaId = e; a.orden = 9999; }
      const fr = val("aFranja"); if(fr) A.aFranja(a, fr); A.comprometer(a, val("aCon"), val("aCuando")); });
    cerrarHoja(); nota(a.compromiso && a.compromiso.con ? "Comprometida con " + a.compromiso.con + "." : "Guardada."); },
  "borrar-accion": d => { const a = accion(d.id); if(!a) return; cambiar(() => A.borrarAccion(a)); cerrarHoja(); nota("Acción eliminada."); },
  "etapa-hecha": d => { const m = Rg.meta(d.id), e = Rg.etapaActual(m); if(!e) return; cambiar(() => A.etapaHecha(m, e)); refrescarRuta(); const sig = Rg.etapaActual(m); nota(sig ? "Siguiente etapa: " + sig.nombre + "." : "Ruta completa. Toca revisar esta meta."); },
  "reabrir-etapa": d => { const m = Rg.meta(d.id); if(!m) return; const hechas = m.etapas.filter(e => e.hecha); if(!hechas.length) return; cambiar(() => { hechas[hechas.length - 1].hecha = false; }); refrescarRuta(); nota("Regresaste a «" + hechas[hechas.length - 1].nombre + "»."); },
  "ruta": d => hojaRuta(d.id),
  "editar-meta": d => hojaEditarMeta(d.id),
  "guardar-meta": d => { const m = Rg.meta(d.id); if(!m) return; const et = val("mEtapas").split("\n").map(x => x.trim()).filter(Boolean);
    cambiar(() => { m.nombre = val("mNom") || m.nombre; m.lane = S.lane || m.lane; m.resultado = val("mRes") || m.resultado; m.terminadoCuando = val("mFin"); m.abre = val("mAbre"); if(et.length) aplicarEtapas(m, et); }); cerrarHoja(); nota("Meta guardada."); },
  "ver-base": d => hojaBase(d.id),
  "nueva-base": () => { const b = { id: uid(), nombre: "", forma: "" }; E.base.push(b); hojaBase(b.id); },
  "guardar-base": d => { const b = E.base.find(x => x.id === d.id); if(!b) return; cambiar(() => { b.nombre = val("bNom") || b.nombre || "Sin nombre"; b.forma = val("bForma"); }); cerrarHoja(); nota("Base guardada."); },
  "quitar-base": d => { cambiar(() => { E.base = E.base.filter(x => x.id !== d.id); }); cerrarHoja(); nota("Quitado de la base."); },

  /* operación */
  "marcar-rutina": d => { const r = rutina(d.id); if(!r) return; const antes = Rg.diaCuenta(diaDe(hoyISO()));
    cambiar(() => A.marcarRutina(r, hoyISO()));
    const dd = diaDe(hoyISO());
    if(!antes && Rg.diaCuenta(dd)) nota("El día cuenta. Lo demás es extra.");
    else if(dd.rutHechas[r.id] && Rg.metaSemanal(r) >= 3){ const w = Rg.semanaRutina(r, hoyISO());
      if(w.hechas === w.suf) nota(r.nombre + ": " + w.hechas + " de " + w.meta + ". Ya es suficiente esta semana."); } },
  "marcar-sub": d => { const r = rutina(d.id); if(!r) return; let res;
    const antesDia = Rg.diaCuenta(diaDe(hoyISO()));
    cambiar(() => { res = A.marcarSub(r, +d.i, hoyISO()); });
    if(d.hoja) hojaRutinaHoy(r.id);
    if(res && !res.antes && res.ahora){
      if(!antesDia && Rg.diaCuenta(diaDe(hoyISO()))) nota("El día cuenta. Lo demás es extra.");
      else nota(r.nombre + ": " + res.e.hechas + " de " + res.e.n + ". Suficiente, queda hecha.");
    } },
  "quitar-sub": d => { const r = rutina(d.id); if(!r) return; cambiar(() => A.quitarSub(r, +d.i, hoyISO())); hojaRutinaHoy(r.id); },
  "plegar": d => { const i = S.abiertas.indexOf(d.id); if(i >= 0) S.abiertas.splice(i, 1); else S.abiertas.push(d.id); pintar(); },
  "ver-rutina-hoy": d => hojaRutinaHoy(d.id),
  "omitir-rutina": d => { cambiar(() => { const dd = diaMut(hoyISO()); if(!dd.omitidas.includes(d.id)) dd.omitidas.push(d.id); }); cerrarHoja(); nota("Hoy no. Mañana aparece como siempre."); },
  "recuperar-rutina": d => cambiar(() => { const dd = diaMut(hoyISO()); dd.omitidas = dd.omitidas.filter(x => x !== d.id); }),
  "editar-rutina": d => hojaRutina(d.id),
  "nueva-rutina": () => { S.rutBorrador = { id: uid(), nombre: "", area: "Trabajo", franja: "jornada", frecuencia: "semana", dias: [1,2,3,4,5], diaMes: 1, pasos: [] }; hojaRutina(S.rutBorrador.id); },
  "rut-franja": (d, b) => { S.rut.franja = d.v; $$('#hojas [data-accion="rut-franja"]').forEach(x => x.classList.toggle("on", x === b)); },
  "rut-area": (d, b) => { S.rut.area = d.v; $$('#hojas [data-accion="rut-area"]').forEach(x => x.classList.toggle("on", x === b)); },
  "rut-frec": (d, b) => { S.rut.frec = d.v; $$('#hojas [data-accion="rut-frec"]').forEach(x => x.classList.toggle("activo", x === b)); $("#rutDias").hidden = d.v === "mes"; $("#rutMes").hidden = d.v !== "mes"; const sm = $("#rutSemanal"); if(sm) sm.hidden = d.v === "mes"; },
  "rut-peso": (d, b) => { S.rut.peso = !S.rut.peso; b.classList.toggle("on", S.rut.peso); b.setAttribute("aria-checked", String(S.rut.peso)); },
  "rut-dia": (d, b) => { const v = +d.v, i = S.rut.dias.indexOf(v); if(i >= 0) S.rut.dias.splice(i, 1); else S.rut.dias.push(v); const on = S.rut.dias.includes(v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); },
  "guardar-rutina": d => {
    let r = E.rutinas.find(x => x.id === d.id); const nuevo = !r; if(nuevo) r = S.rutBorrador; if(!r) return;
    const nombre = val("rNom"); if(!nombre) return errorPaso("Ponle un nombre a la rutina.");
    if(S.rut.frec !== "mes" && !S.rut.dias.length) return errorPaso("Elige al menos un día.");
    cambiar(() => { Object.assign(r, { nombre, area: S.rut.area, franja: S.rut.franja, frecuencia: S.rut.frec, dias: S.rut.dias.slice().sort(), diaMes: +val("rDiaMes") || 1, semanal: +val("rSemanal") || 0, peso: !!S.rut.peso, pasos: val("rPasos").split("\n").map(x => x.trim()).filter(Boolean) }); if(nuevo){ delete r.nueva; E.rutinas.push(r); S.rutBorrador = null; } });
    cerrarHoja(); nota(nuevo ? "Rutina creada. Aparece en Hoy los días que toca." : "Rutina guardada.");
  },
  "borrar-rutina": d => { cambiar(() => { E.rutinas = E.rutinas.filter(x => x.id !== d.id); }); S.rutBorrador = null; cerrarHoja(); nota("Rutina eliminada."); },
  "pausar-rutina": d => { const r = E.rutinas.find(x => x.id === d.id); if(!r) return; cambiar(() => { r.pausada = !r.pausada; }); cerrarHoja(); nota(r.pausada ? "En pausa: no aparece en Hoy." : "Reactivada."); },
  "rutinas-ok": () => cambiar(() => { E.marcas.rutinasDeEjemplo = false; }),

  /* pendientes */
  "marcar-pend": d => { const p = E.pendientes.find(x => x.id === d.id); if(!p) return; cambiar(() => A.marcarPend(p)); },
  "ver-pend": d => hojaPend(d.id),
  "pend-manana": d => { const p = E.pendientes.find(x => x.id === d.id); if(!p) return; cambiar(() => { p.fecha = man(); p.hecha = false; }); cerrarHoja(); nota("Pasó a mañana."); },
  "guardar-pend": d => { const p = E.pendientes.find(x => x.id === d.id); if(!p) return; cambiar(() => { p.texto = val("pTxt") || p.texto; }); cerrarHoja(); },
  "borrar-pend": d => { cambiar(() => { E.pendientes = E.pendientes.filter(x => x.id !== d.id); }); cerrarHoja(); nota("Soltado."); }
};


Object.assign(ACC, {
  /* ideas */
  "ver-idea": d => hojaIdea(d.id),
  "idea-accion": d => { const i = E.ideas.find(x => x.id === d.id), m = Rg.meta(d.meta); if(!i || !m) return; cambiar(() => A.ideaAAccion(i, m)); cerrarHoja(); nota("Ahora es una acción de " + m.nombre + ", en su etapa actual."); },
  "decidir-idea": d => { const i = E.ideas.find(x => x.id === d.id); if(!i) return; const t = val("iDec"); if(!t) return errorPaso("Escribe qué decidiste, en una línea."); cambiar(() => A.decidirIdea(i, t)); cerrarHoja(); nota("Decisión cerrada. Ya no se discute."); },
  "esperar-idea": d => { const i = E.ideas.find(x => x.id === d.id); if(!i) return; cambiar(() => { i.estado = "espera"; i.condicion = val("iCond") || "Se revisa en tres meses."; i.vence = sumarMeses(hoyISO(), 3); }); cerrarHoja(); nota("En espera, con fecha."); },
  "soltar-idea": d => { const i = E.ideas.find(x => x.id === d.id); if(!i) return; cambiar(() => A.soltarIdea(i, "")); cerrarHoja(); nota("Soltada. Ya no pide atención."); },

  /* agregar rápido */
  "destino": (d, b) => { S.destino = d.v; $$('#hojas [data-accion="destino"]').forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-checked", String(on)); }); const t = $("#qTxt"); if(t) t.focus(); },
  "agregar-rapido": () => {
    const t = val("qTxt"); if(!t) return errorPaso("Escribe qué quieres agregar.");
    const p = Rg.principal(), s = Rg.secundaria();
    if(S.destino === "rutina"){ S.rutBorrador = { id: uid(), nombre: t, area: "Trabajo", franja: "jornada", frecuencia: "semana", dias: [1,2,3,4,5], diaMes: 1, pasos: [] }; hojaRutina(S.rutBorrador.id); return; }
    let msg = "";
    cambiar(() => {
      if(S.destino === "p" && p){ A.nuevaAccion(p, t); msg = "Acción agregada a " + p.nombre + ", en su etapa actual."; }
      else if(S.destino === "s" && s){ A.nuevaAccion(s, t); msg = "Acción agregada a " + s.nombre + "."; }
      else if(S.destino === "idea"){ A.nuevaIdea(t); msg = "Idea guardada. Se revisa el domingo."; }
      else { A.nuevoPend(t); msg = "Pendiente agregado a hoy."; }
    });
    cerrarHoja(); nota(msg);
  },
  "enviar": d => { const el = document.getElementById(d.para); if(el) alEnter(el); },

  /* ajustes y datos */
  "tema": d => { E.ajustes.tema = d.v; aplicarTema(); guardar(); $$('#hojas [data-accion="tema"]').forEach(x => x.classList.toggle("activo", x.dataset.v === d.v)); },
  "guardar-ajustes": () => { cambiar(() => { E.ajustes.nombre = val("cNom"); E.ajustes.practica = val("cPractica"); }); cerrarHoja(); nota("Ajustes guardados."); },
  "refugio": () => hojaRefugio(),
  "refugio-si": () => { cambiar(() => { E.refugio = { activo: true, desde: hoyISO() }; }); cerrarHoja(); S.tab = "hoy"; pintar(); $("#lienzo").scrollTop = 0; nota("Semana difícil: solo lo esencial."); },
  "refugio-salir": () => { cambiar(() => { E.refugio = { activo: false, desde: null }; }); cerrarHoja(); S.tab = "hoy"; pintar(); $("#lienzo").scrollTop = 0; nota("De vuelta. Todo está donde lo dejaste."); },
  "refugio-sigo": () => cambiar(() => { E.refugio.desde = hoyISO(); }),
  "exportar": () => hojaExportar(),
  "copiar": () => { const txt = JSON.stringify(E, null, 2), ok = () => nota("Copiado.");
    const plan_b = () => { const t = $("#xTxt"); if(t){ t.select(); try{ document.execCommand("copy"); ok(); }catch(e){ nota("Selecciona el texto y cópialo."); } } };
    try{ navigator.clipboard.writeText(txt).then(ok, plan_b); }catch(e){ plan_b(); } },
  "descargar": () => { try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(E, null, 2)], { type: "application/json" })); a.download = "cauce-" + hoyISO() + ".json"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }catch(e){ nota("No se pudo descargar aquí; usa Copiar."); } },
  "importar": () => hojaImportar(),
  "confirmar-importar": () => { try{ const g = JSON.parse(val("iJson")); if(!g || !Array.isArray(g.metas)) throw new Error("forma"); E = normalizar(migrar(g)); podar(E); guardar(); cerrarHoja(); aplicarTema(); S.tab = "hoy"; pintar(); nota("Importado."); }
    catch(e){ errorPaso("Eso no parece un archivo de esta versión de Cauce."); } },
  "borrar": () => hojaBorrar(),
  "confirmar-borrar": () => { E = normalizar(semilla()); guardar(); cerrarHoja(); S.tab = "hoy"; aplicarTema(); pintar(); flujoBienvenida(); },
  "cerrar-hoja": () => cerrarHoja(),

  /* flujos */
  "flujo-sig": d => siguientePaso(d.valor || ""),
  "flujo-atras": () => pasoAtras(),
  "flujo-cerrar": () => cerrarFlujo(),
  "flujo-marcar": (d, b) => {
    const k = d.campo, max = +d.max || 99; let arr = Array.isArray(F.ctx[k]) ? F.ctx[k] : (F.ctx[k] = []);
    const i = arr.indexOf(d.valor);
    if(max === 1){ F.ctx[k] = arr = i >= 0 ? [] : [d.valor]; if(k === "sec") F.ctx.secNo = !arr.length; }
    else if(i >= 0) arr.splice(i, 1);
    else { if(arr.length >= max){ errorPaso("Solo caben " + (max === 3 ? "tres" : max) + ". Quita una para sumar otra."); return; } arr.push(d.valor); errorPaso(""); }
    $$(`#flujoCont [data-accion="flujo-marcar"][data-campo="${k}"]`).forEach(x => { const on = arr.includes(x.dataset.valor); x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); });
  },
  "flujo-mini": (d, b) => { F.ctx[d.campo] = d.v; $$(`#flujoCont [data-accion="flujo-mini"][data-campo="${d.campo}"]`).forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-checked", String(on)); }); },
  "cierre-dec": (d, b) => { F.ctx.dec[d.id] = d.v; $$(`#flujoCont [data-accion="cierre-dec"][data-id="${d.id}"]`).forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-checked", String(on)); }); },
  "plan-pend-manana": d => { const p = E.pendientes.find(x => x.id === d.id); if(!p) return; p.fecha = man(); guardar(); pintarPaso(); nota("Pasó a mañana."); }
});

/* ── Agregar con Enter (o con el +) ── */
const ENTER = {
  "nuevo-pend": t => { cambiar(() => A.nuevoPend(t.value.trim())); S.refoco = t.id; pintar(); },
  "nueva-accion": t => { const m = Rg.meta(t.dataset.meta); if(!m) return; cambiar(() => A.nuevaAccion(m, t.value.trim())); S.refoco = t.id; pintar(); nota("Acción agregada a la etapa actual."); },
  "nueva-idea": t => { cambiar(() => A.nuevaIdea(t.value.trim())); S.refoco = t.id; pintar(); nota("Idea guardada. Se revisa el domingo."); },
  "nuevo-hobby": t => { cambiar(() => E.hobbies.push({ id: uid(), nombre: t.value.trim() })); S.refoco = t.id; pintar(); },
  "nueva-sub": t => { const r = rutina(t.dataset.rut); if(!r) return; const txt = t.value.trim(), id = t.id;
    cambiar(() => A.nuevaSub(r, txt, hoyISO())); hojaRutinaHoy(r.id);
    setTimeout(() => { const el = document.getElementById(id); if(el) el.focus(); }, 90); },
  "agregar-rapido": () => ACC["agregar-rapido"](),
  "elegir-nueva": t => { const cual = t.dataset.cual, m = cual === "sec" ? Rg.secundaria() : Rg.principal(); if(!m) return; let r;
    cambiar(() => { const a = A.nuevaAccion(m, t.value.trim()); r = cual === "mueven" ? A.mueve(a) : A.aHoy(a); diaMut(hoyISO()).planeado = true; });
    cerrarHoja(); nota(r === "lleno" ? "Agregada a tu ruta; hoy ya está lleno." : "Agregada a tu ruta y a tu día."); },
  "ruta-accion": t => { const m = Rg.meta(t.dataset.meta); if(!m) return; const id = t.id; cambiar(() => A.nuevaAccion(m, t.value.trim(), t.dataset.etapa)); hojaRuta(m.id); setTimeout(() => { const el = document.getElementById(id); if(el) el.focus(); }, 90); },
  "nueva-etapa": t => { const m = Rg.meta(t.dataset.meta); if(!m) return; cambiar(() => { m.etapas.push({ id: uid(), nombre: t.value.trim(), hecha: false }); }); hojaRuta(m.id); nota("Etapa agregada al final."); },
  "plan-nueva": t => { const cual = t.dataset.cual, m = cual === "tres" ? Rg.principal() : Rg.secundaria(); if(!m) return; const a = A.nuevaAccion(m, t.value.trim()); guardar();
    const lista = F.ctx[cual] = Array.isArray(F.ctx[cual]) ? F.ctx[cual] : [];
    if(cual === "sec"){ F.ctx.sec = [a.id]; F.ctx.secNo = false; } else if(lista.length < MAX_TRES) lista.push(a.id); else nota("Agregada a tu ruta. Para sumarla hoy, quita una de tus tres.");
    const id = t.id; pintarPaso(); setTimeout(() => { const el = document.getElementById(id); if(el) el.focus(); }, 90); },
  "plan-pend": t => { A.nuevoPend(t.value.trim()); guardar(); const id = t.id; pintarPaso(); setTimeout(() => { const el = document.getElementById(id); if(el) el.focus(); }, 90); }
};
function alEnter(t){ if(!t || !t.dataset.enter) return; if(t.dataset.enter !== "agregar-rapido" && !t.value.trim()) return; const fn = ENTER[t.dataset.enter]; if(fn) fn(t); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-accion]");
  if(b){ const fn = ACC[b.dataset.accion]; if(fn){ e.preventDefault(); fn(b.dataset, b, e); } return; }
  if(e.target.id === "hojaFondo") cerrarHoja();
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && e.target && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); alEnter(e.target); return; }
  if(e.key !== "Escape") return;
  if($("#hojas").innerHTML){ cerrarHoja(); return; }
  if(F.activo) cerrarFlujo();
});
document.addEventListener("visibilitychange", () => { if(!document.hidden && E && !F.activo && !$("#hojas").innerHTML) pintar(); });

/* ════════ TEMA (como Práctica) ════════ */
const mqOscuro = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function aplicarTema(){
  const t = (E && E.ajustes && E.ajustes.tema) || "sistema", oscuro = t === "oscuro" || (t === "sistema" && !!(mqOscuro && mqOscuro.matches));
  document.documentElement.dataset.modo = oscuro ? "oscuro" : "claro"; document.documentElement.style.background = oscuro ? "#0E0D0C" : "#FAF8F3";
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", oscuro ? "#0E0D0C" : "#FAF8F3");
}
try{ mqOscuro && mqOscuro.addEventListener("change", () => { if(!E || E.ajustes.tema === "sistema") aplicarTema(); }); }catch(e){}

/* ════════ ARRANQUE ════════ */
async function arrancar(){
  let g = await Guardado.leer(CLAVE);
  if(!g || !Array.isArray(g.metas)) g = await Guardado.leer(CLAVE_V4);
  if(!g || !Array.isArray(g.metas)) g = await Guardado.leer(CLAVE_V3);
  if(!g || !Array.isArray(g.metas)) g = await Guardado.leer(CLAVE_V2);
  if(!g || !Array.isArray(g.metas)) g = semilla();
  E = normalizar(migrar(g)); podar(E); aplicarTema();
  E.marcas.ultimaVisita = hoyISO(); guardar(); pintar();
  if(!E.marcas.onboarding) flujoBienvenida();
}
arrancar();


</script>
