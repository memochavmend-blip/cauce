<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<script>try{ if(matchMedia("(prefers-color-scheme:dark)").matches){ document.documentElement.dataset.modo = "oscuro"; document.documentElement.style.background = "#0E0D0C"; } }catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Cauce">
<title>Cauce</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FAF8F3'/%3E%3Cpath d='M16 3c-5 5 5 10 0 13s5 8 0 13' fill='none' stroke='%23E0942A' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23E0942A'/%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════
   CAUCE · estilos
   1) Tokens: idénticos a Práctica (misma familia, mismos nombres).
   2) Componentes compartidos: mismos nombres de clase que Práctica
      (rubrica, hoja, campo, accion, aviso, continua, rito, onb, tabbar…),
      para que un shell común pueda absorberlos sin reescribir.
   3) Componentes nuevos: cauce (línea de temporada), manda, frente, item, paso.
   Regla de accesibilidad heredada con corrección: --tinta-tenue y --llama
   no se usan para texto pequeño (no pasan AA sobre el papel claro).
   ══════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --noche:#FAF8F3;
  --panel:#EFE9DF;
  --tinta:#2B2621;
  --tinta-baja:#5E554B;
  --tinta-tenue:#877E73;
  --cera:#C9B896;
  --llama:#E0942A;
  --brasa:#B4491C;
  --oro:#8A6A3E;
  --linea:rgba(43,38,33,.10);
  --linea-fuerte:rgba(43,38,33,.20);
  --serif:ui-serif,"New York",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --cauce-x:20px;
}
html[data-modo="oscuro"]{
  color-scheme:dark;
  --noche:#0E0D0C;
  --panel:#171513;
  --tinta:#ECE6DB;
  --tinta-baja:#A79C8D;
  --tinta-tenue:#726859;
  --cera:#CFC0A0;
  --llama:#F0A63C;
  --brasa:#C56A3C;
  --oro:#B79366;
  --linea:rgba(236,230,219,.08);
  --linea-fuerte:rgba(236,230,219,.16);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--noche);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .5s ease,color .5s ease}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.oculto{display:none !important}
.sr{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── EL CAUCE · la línea de la temporada ───
   Hermana de la veladora de Práctica: mismo lugar, mismo material (cera y llama).
   La veladora arde durante un ritual; el cauce corre durante una temporada.
   Se siente el tiempo sin contarlo: no hay número, solo dónde va el agua. */
.cauce{position:fixed;left:var(--cauce-x);top:0;bottom:0;width:3px;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 22px) 0 calc(env(safe-area-inset-bottom) + 84px)}
.cauce-lecho{position:relative;height:100%;width:3px}
.cauce-agua{position:absolute;inset:0;border-radius:2px;background:linear-gradient(180deg,var(--cera),color-mix(in srgb,var(--cera) 40%,transparent));opacity:.34}
.cauce-andado{position:absolute;top:0;left:0;right:0;height:0;border-radius:2px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--llama) 6%,transparent),color-mix(in srgb,var(--llama) 60%,transparent));
  transition:height 1.2s cubic-bezier(.2,.7,.3,1)}
.cauce-luz{position:absolute;left:50%;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#FFF3D4 0%,var(--llama) 42%,rgba(240,166,60,0) 72%);
  box-shadow:0 0 14px 4px color-mix(in srgb,var(--llama) 50%,transparent),0 0 38px 12px color-mix(in srgb,var(--llama) 16%,transparent);
  transition:top 1.2s cubic-bezier(.2,.7,.3,1);animation:respira 5.5s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.85}}
.cauce.dormido .cauce-andado,.cauce.dormido .cauce-luz{opacity:0}
.cauce.refugio .cauce-luz{animation:none;opacity:.45}

/* ─── ESTRUCTURA (idéntica a Práctica) ─── */
#appShell{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.lienzo{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;width:100%;max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 44px) 26px 56px 52px}

/* rúbricas: instrucciones en rojo, como en un misal (una por pantalla) */
.rubrica{font-family:var(--sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--brasa);margin:0 0 14px}
.fecha{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--tinta-baja);margin:0 0 30px}
.panel-titulo{font-family:var(--serif);font-weight:400;font-size:1.75rem;letter-spacing:-.01em;color:var(--tinta);margin:8px 0 8px}
.panel-sub{font-size:13.5px;line-height:1.6;color:var(--tinta-baja);margin:0 0 34px;max-width:46ch}

/* ─── HOJAS (modales de Práctica) ─── */
.hoja{position:fixed;inset:0;z-index:70;background:rgba(6,5,4,.62);display:flex;align-items:flex-end;justify-content:center;animation:aparece .3s ease}
html[data-modo="oscuro"] .hoja{background:rgba(6,5,4,.86)}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.hoja-caja{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-top:1px solid var(--linea-fuerte);border-radius:22px 22px 0 0;
  padding:30px 28px calc(env(safe-area-inset-bottom) + 30px);animation:sube .34s cubic-bezier(.2,.8,.3,1)}
@keyframes sube{from{transform:translateY(26px)}to{transform:none}}
.hoja-tirador{width:38px;height:4px;border-radius:2px;background:var(--linea-fuerte);margin:-14px auto 18px;opacity:.8}
.hoja-tit{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
.hoja-tit:focus{outline:none}
.hoja-sub{font-size:13px;color:var(--tinta-baja);line-height:1.6;margin:0 0 24px}
.hoja-pie{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.dato{margin:0 0 16px}
.dato-et{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-baja);margin:0 0 4px}
.dato-v{font-family:var(--serif);font-size:1.05rem;line-height:1.5;color:var(--tinta);margin:0 0 4px}
.dato-f{font-family:var(--mono);font-size:10.5px;color:var(--tinta-baja);margin-right:8px}
.campo{margin-bottom:22px}
.campo-et{display:block;font-size:13px;font-weight:600;color:var(--tinta);margin-bottom:9px}
.campo-in,.campo-sel{width:100%;background:transparent;border:none;border-bottom:1px solid var(--linea-fuerte);padding:9px 0;font-family:var(--serif);font-size:1.12rem;outline:none;border-radius:0}
.campo-in:focus,.campo-sel:focus{border-bottom-color:var(--llama)}
.campo-in::placeholder,.campo-area::placeholder{color:var(--tinta-baja);opacity:.75}
.campo-sel{font-family:var(--sans);font-size:.95rem;cursor:pointer}
.campo-sel option{background:var(--panel);color:var(--tinta)}
.campo-area{width:100%;background:transparent;border:1px solid var(--linea-fuerte);border-radius:12px;padding:12px 14px;font-family:var(--serif);font-size:1.04rem;line-height:1.55;color:var(--tinta);outline:none;resize:none;overflow:hidden;min-height:58px}
.campo-area:focus{border-color:var(--llama)}
.campo-area.mono{font-family:var(--mono);font-size:12px;line-height:1.5}
.campo-ayuda{font-size:12.5px;color:var(--tinta-baja);margin-top:8px;line-height:1.55}
.acciones{display:flex;gap:9px;margin-top:20px}
.accion{flex:1;padding:15px 10px;border:1px solid var(--linea-fuerte);border-radius:12px;text-align:center;font-size:14px;font-weight:500;transition:border-color .2s,color .2s,background .2s}
.accion:hover{border-color:var(--tinta-baja)}
.accion.llena{background:var(--llama);border-color:var(--llama);color:#120C05;font-weight:600}
.accion.peligro{background:var(--brasa);border-color:var(--brasa);color:#FFF8F0}

/* ─── FLUJOS (el onboarding de Práctica como gramática de todo paso a paso) ─── */
.onb{position:fixed;inset:0;z-index:90;background:var(--noche);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 22px) 26px calc(env(safe-area-inset-bottom) + 18px)}
.onb-top{display:flex;align-items:center;justify-content:center;position:relative;min-height:38px;flex-shrink:0}
.onb-dots{display:flex;gap:7px;justify-content:center}
.onb-dot{width:7px;height:7px;border-radius:50%;background:var(--linea-fuerte);transition:background .3s ease}
.onb-dot.on{background:var(--llama)}
.onb-back,.flujo-x{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;font-size:18px;color:var(--tinta-baja);display:flex;align-items:center;justify-content:center;border-radius:50%}
.onb-back{left:-6px}
.flujo-x{right:-6px;font-size:15px}
.onb-cont{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;max-width:460px;margin:0 auto;width:100%;padding:8px 2px}
.paso{margin:auto 0;padding:14px 0 18px;animation:onbIn .35s ease}
@keyframes onbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.onb-mark{color:var(--llama);margin:0 0 20px}
.onb-mark svg{width:30px;height:48px;display:block}
.paso-t{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.18;letter-spacing:-.012em;color:var(--tinta);margin:0 0 14px;text-wrap:balance}
.paso-t:focus{outline:none}
.paso-p{font-size:15px;line-height:1.62;color:var(--tinta-baja);margin:0 0 24px}
.paso-meta{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--tinta-baja);margin:-4px 0 14px}
.paso-mueve{font-size:13px;line-height:1.5;color:var(--tinta-baja);margin:-6px 0 18px}
.paso-preg{font-family:var(--serif);font-size:1.22rem;line-height:1.42;color:var(--tinta);margin:0 0 24px;padding-left:14px;border-left:2px solid var(--llama)}
.paso-err{min-height:1.3em;font-size:13px;line-height:1.45;color:var(--brasa);margin:0 0 6px}
.onb-opts{display:flex;flex-direction:column;gap:9px;margin:0 0 20px}
.onb-opt{display:flex;flex-direction:column;gap:3px;padding:15px 18px;border:1px solid var(--linea-fuerte);border-radius:14px;text-align:left;transition:border-color .2s,background .2s}
.onb-opt:hover{border-color:var(--llama)}
.onb-opt.fijo{border-style:dashed;cursor:default}
.onb-opt.fijo:hover{border-color:var(--linea-fuerte)}
.onb-opt.on{border-color:var(--llama);background:color-mix(in srgb,var(--llama) 14%,transparent)}
.opt-t{font-family:var(--serif);font-size:1.1rem;line-height:1.35;color:var(--tinta)}
.opt-s{font-size:12.5px;line-height:1.5;color:var(--tinta-baja)}
.onb-btn{display:block;width:100%;margin-top:6px;padding:16px;border-radius:14px;background:var(--tinta);color:var(--noche);font-size:15px;font-weight:500;transition:opacity .2s ease}
.onb-btn:active{opacity:.85}
.onb-saltar{display:block;margin:6px auto 0;padding:12px;font-size:13.5px;color:var(--tinta-baja);transition:color .2s ease}
.onb-saltar:hover{color:var(--tinta)}
.resumen{margin:4px 0 24px;border-top:1px solid var(--linea)}
.res-fila{padding:12px 0;border-bottom:1px solid var(--linea)}
.res-et{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-baja);margin:0 0 4px}
.res-v{font-family:var(--serif);font-size:1.02rem;line-height:1.45;color:var(--tinta);margin:0}
.base-nombres{font-family:var(--serif);font-style:italic;color:var(--oro);margin:-8px 0 18px}

/* ─── NAVEGACIÓN (tabbar de Práctica, tres pestañas) ─── */
.tabbar{flex:0 0 auto;display:flex;justify-content:space-around;align-items:flex-end;padding:9px 4px calc(env(safe-area-inset-bottom) + 9px);background:var(--panel);border-top:1px solid var(--linea-fuerte);position:relative;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--tinta-baja);transition:color .2s ease}
.tab.activo{color:var(--tinta)}
.tab.activo .tab-lb{font-weight:600}
.tab-ic{width:23px;height:23px}
.tab-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab-lb{font-size:10.5px;letter-spacing:.02em}

/* ─── AVISO BREVE ─── */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:120;
  width:max-content;max-width:min(420px,calc(100vw - 48px));padding:12px 18px;border-radius:12px;background:var(--tinta);color:var(--noche);font-size:13.5px;line-height:1.45;transition:opacity .3s ease,transform .3s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.05s !important}
}
@media (min-width:700px){ :root{--cauce-x:34px} .lienzo{padding-left:78px} .tabbar{justify-content:center;gap:56px} .tab{flex:0 0 96px} }

/* ══════════════ CAUCE v2 · herramienta del día ══════════════
   Inspiración de organización: el ritual guiado de planeación (Sunsama),
   el día que empieza limpio (Mi día, Microsoft To Do), proyectos con
   secciones y casillas limpias (Things), agregar rápido (Todoist).
   Lenguaje visual: el de Práctica. */

.lienzo{padding-bottom:132px}
.rubrica{margin-bottom:10px}

/* Cabecera */
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 24px}
.saludo{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,6.2vw,2.15rem);line-height:1.14;letter-spacing:-.015em;color:var(--tinta);margin:0 0 6px}
.saludo:focus{outline:none}
.fecha{font-family:var(--sans);font-size:13.5px;letter-spacing:0;color:var(--tinta-baja);margin:0;line-height:1.5}
.cab-acc{display:flex;gap:2px;margin:-6px -8px 0 0;flex-shrink:0}
.icono{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tinta-baja);transition:background .2s,color .2s}
.icono:hover{background:var(--panel);color:var(--tinta)}
.icono svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Guía del momento (planear el día, la semana, cerrar el día) */
.guia{background:var(--panel);border:1px solid var(--linea);border-left:3px solid var(--llama);border-radius:4px 18px 18px 4px;padding:20px 20px 16px;margin:0 0 32px}
.guia-t{font-family:var(--serif);font-weight:400;font-size:1.32rem;line-height:1.25;color:var(--tinta);margin:0 0 4px}
.guia-s{font-size:13.5px;line-height:1.55;color:var(--tinta-baja);margin:0 0 14px}
.guia-pasos{list-style:none;margin:0 0 16px;padding:0;counter-reset:paso}
.guia-pasos li{display:flex;gap:12px;align-items:center;padding:6px 0;font-size:14.5px;line-height:1.4;color:var(--tinta)}
.guia-pasos li::before{counter-increment:paso;content:counter(paso);flex:0 0 24px;height:24px;border-radius:50%;border:1px solid var(--linea-fuerte);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--tinta-baja)}
.guia-acc{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-size:14.5px;font-weight:600;background:var(--tinta);color:var(--noche);transition:opacity .2s}
.btn:active{opacity:.85}
.btn-sec{padding:10px 2px;font-size:14px;color:var(--tinta-baja);text-decoration:underline;text-decoration-color:var(--linea-fuerte);text-underline-offset:3px;transition:color .2s}
.btn-sec:hover{color:var(--tinta)}
.btn-borde{flex:1;padding:13px 12px;border:1px solid var(--linea-fuerte);border-radius:12px;font-size:14px;font-weight:500;color:var(--tinta);text-align:center;transition:border-color .2s}
.btn-borde:hover{border-color:var(--llama)}
.fila-botones{display:flex;gap:10px;margin:4px 0 34px}

/* Secciones */
.sec{margin:0 0 32px}
.sec-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 2px}
.sec-t{font-family:var(--serif);font-weight:400;font-size:1.3rem;line-height:1.25;color:var(--tinta);margin:0}
.sec-s{font-size:12.5px;line-height:1.5;color:var(--tinta-baja);margin:2px 0 10px}
.puntos{display:flex;gap:7px;flex-shrink:0}
.punto{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--linea-fuerte);transition:background .25s,border-color .25s,box-shadow .25s}
.punto.on{background:var(--llama);border-color:var(--llama);box-shadow:0 0 9px 1px color-mix(in srgb,var(--llama) 45%,transparent)}

/* Filas de tarea (casilla + texto) */
.lista{border-top:1px solid var(--linea)}
.tarea{display:flex;align-items:flex-start;border-bottom:1px solid var(--linea);min-height:54px}
.check{flex:0 0 46px;height:54px;display:flex;align-items:center;justify-content:flex-start;padding-left:1px}
.check-c{width:23px;height:23px;border-radius:50%;border:1.7px solid var(--tinta-baja);display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s,transform .18s}
.check:active .check-c{transform:scale(.9)}
.check-c svg{width:13px;height:13px;fill:none;stroke:#FFFBF3;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.tarea.hecha .check-c,.paso-f.hecho .check-c{background:var(--llama);border-color:var(--llama)}
.tarea.hecha .check-c svg,.paso-f.hecho .check-c svg{opacity:1}
.tarea-cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:15px 0 14px;text-align:left}
.tarea-t{font-size:15.5px;line-height:1.42;color:var(--tinta)}
.tarea.hecha .tarea-t{color:var(--tinta-baja);text-decoration:line-through;text-decoration-color:var(--linea-fuerte)}
.tarea-s{font-size:12.5px;line-height:1.45;color:var(--tinta-baja)}
.tarea-lado{flex:0 0 auto;align-self:center;display:flex;align-items:center;gap:2px;font-size:12px;color:var(--tinta-baja);padding-left:8px}
.plegar{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--tinta-baja);border-radius:50%}
.plegar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.plegar[aria-expanded="true"] svg{transform:rotate(180deg)}
.pasos{padding:0 0 10px 46px;border-bottom:1px solid var(--linea)}
.paso-f{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;text-align:left;font-size:14px;line-height:1.4;color:var(--tinta)}
.paso-f .check-c{width:19px;height:19px;flex-shrink:0}
.paso-f .check-c svg{width:11px;height:11px}
.paso-f.hecho span:last-child{color:var(--tinta-baja);text-decoration:line-through;text-decoration-color:var(--linea-fuerte)}
.tarea.omitida .tarea-t{color:var(--tinta-baja)}
.vacio{padding:15px 0;margin:0;font-size:14px;line-height:1.5;color:var(--tinta-baja);border-bottom:1px solid var(--linea)}
.vacio button,.enlace{color:var(--tinta);text-decoration:underline;text-decoration-color:var(--llama);text-underline-offset:3px;font-size:14px}
.agregar{display:flex;align-items:center;border-bottom:1px solid var(--linea)}
.agregar-mas{flex:0 0 46px;height:52px;display:flex;align-items:center;color:var(--tinta-baja)}
.agregar-mas svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;margin-left:1px}
.agregar input{flex:1;min-width:0;border:none;background:transparent;padding:15px 0;font-family:var(--sans);font-size:15.5px;color:var(--tinta);outline:none}
.agregar input::placeholder{color:var(--tinta-baja)}
.nota-suave{font-size:12.5px;line-height:1.55;color:var(--tinta-baja);margin:10px 0 0}
.base-linea{margin:0 0 28px;padding:14px 16px;border-radius:12px;background:var(--panel);font-size:13.5px;line-height:1.55;color:var(--tinta-baja)}
.base-linea b{color:var(--tinta);font-weight:600}
.principio{font-family:var(--serif);font-style:italic;font-size:1.02rem;line-height:1.55;color:var(--oro);margin:8px 0 0;max-width:36ch}
.pie{margin:18px 0 0;font-size:12.5px;color:var(--tinta-baja)}
.pie button{font-size:12.5px;color:var(--tinta-baja);text-decoration:underline;text-decoration-color:var(--linea-fuerte);text-underline-offset:3px;padding:6px 0}

/* Botón de agregar (el «+» de Things/Todoist, con la llama de Práctica) */
.fab{position:fixed;right:max(18px,calc(50vw - 302px));bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:20;width:58px;height:58px;border-radius:50%;
  background:var(--llama);color:#1A1006;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(43,38,33,.22);transition:transform .2s}
.fab:active{transform:scale(.94)}
.fab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}
html[data-modo="oscuro"] .fab{box-shadow:0 8px 22px rgba(0,0,0,.5)}

/* Metas */
.meta{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:20px 20px 12px;margin:0 0 16px}
.meta.principal{border-color:color-mix(in srgb,var(--llama) 38%,var(--linea))}
.meta-rol{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tinta-baja);margin:0 0 8px}
.flama{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 50% 45%,#FFF3D4 0%,var(--llama) 45%,rgba(240,166,60,0) 76%);box-shadow:0 0 10px 3px color-mix(in srgb,var(--llama) 40%,transparent)}
.meta-nom{font-family:var(--serif);font-weight:400;font-size:1.6rem;line-height:1.12;letter-spacing:-.012em;color:var(--tinta);margin:0 0 6px}
.meta-res{font-size:13.5px;line-height:1.55;color:var(--tinta-baja);margin:0 0 18px}
.ruta{display:flex;align-items:center;margin:0 0 10px;padding:0 2px}
.ruta-p{width:12px;height:12px;border-radius:50%;border:1.7px solid var(--linea-fuerte);background:var(--panel);flex-shrink:0}
.ruta-p.hecha{background:var(--tinta-baja);border-color:var(--tinta-baja)}
.ruta-p.actual{background:var(--llama);border-color:var(--llama);box-shadow:0 0 0 4px color-mix(in srgb,var(--llama) 22%,transparent)}
.ruta-l{flex:1;height:2px;background:var(--linea-fuerte)}
.ruta-l.hecha{background:var(--tinta-baja)}
.ruta-txt{font-size:13.5px;line-height:1.45;color:var(--tinta-baja);margin:0 0 10px}
.ruta-txt b{font-weight:600;color:var(--tinta)}
.meta .lista,.meta .tarea,.meta .agregar,.meta .pasos{border-color:var(--linea-fuerte)}
.meta-acc{display:flex;gap:18px;flex-wrap:wrap;padding-top:4px}
.meta.libre{background:transparent;border:1px dashed var(--linea-fuerte)}

/* Ruta completa (etapas en secuencia) */
.etapas{margin:4px 0 8px}
.etapa{display:flex;gap:14px;position:relative}
.etapa::before{content:"";position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--linea-fuerte)}
.etapa:last-child::before{display:none}
.etapa-n{flex:0 0 30px;height:30px;border-radius:50%;border:1.7px solid var(--linea-fuerte);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tinta-baja);position:relative;z-index:1}
.etapa.hecha .etapa-n{background:var(--tinta-baja);border-color:var(--tinta-baja);color:var(--panel)}
.etapa.actual .etapa-n{background:var(--llama);border-color:var(--llama);color:#1A1006;font-weight:700}
.etapa-c{flex:1;min-width:0;padding:4px 0 20px}
.etapa-nom{font-family:var(--serif);font-size:1.14rem;line-height:1.3;color:var(--tinta);margin:0 0 2px}
.etapa.futura .etapa-nom{color:var(--tinta-baja)}
.etapa-s{font-size:12.5px;color:var(--tinta-baja);margin:0 0 6px}
.etapa .lista{margin-top:6px}

/* Filas de opción, chips y días */
.opcion-fila{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--linea-fuerte)}
.opcion-fila:hover .tarea-t{text-decoration:underline;text-decoration-color:var(--llama);text-underline-offset:3px}
.fila-i{display:flex;width:100%;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--linea);text-align:left}
.fila-i .tarea-cuerpo{padding:0}
.fila-d{font-size:12px;color:var(--tinta-baja);white-space:nowrap;padding-top:3px}
.etq{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--brasa);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{padding:9px 14px;border:1px solid var(--linea-fuerte);border-radius:999px;font-size:13.5px;color:var(--tinta-baja);transition:border-color .2s,background .2s,color .2s}
.chip.on{border-color:var(--llama);background:color-mix(in srgb,var(--llama) 16%,transparent);color:var(--tinta);font-weight:600}
.dias{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
.dia{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea-fuerte);font-size:13.5px;color:var(--tinta-baja);transition:background .2s,color .2s}
.dia.on{background:var(--tinta);border-color:var(--tinta);color:var(--noche);font-weight:600}
.segmento{display:flex;gap:5px;background:var(--noche);border:1px solid var(--linea);border-radius:13px;padding:5px;margin:0 0 20px}
.seg{flex:1;padding:11px 6px;border-radius:9px;font-size:13.5px;color:var(--tinta-baja);text-align:center;transition:background .2s,color .2s}
.seg.activo{background:color-mix(in srgb,var(--llama) 20%,transparent);color:var(--tinta);font-weight:600}
.fila{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--linea-fuerte)}
.fila-txt{font-size:14.5px;color:var(--tinta)}
.fila-ayuda{font-size:12.5px;line-height:1.5;color:var(--tinta-baja);margin-top:3px}
.switch{width:44px;height:25px;border-radius:13px;border:1px solid var(--linea-fuerte);position:relative;flex-shrink:0;transition:background .25s,border-color .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--tinta-baja);transition:transform .25s cubic-bezier(.3,.8,.4,1),background .25s}
.switch.on{background:color-mix(in srgb,var(--llama) 22%,transparent);border-color:var(--llama)}
.switch.on::after{transform:translateX(19px);background:var(--llama)}
.pref-reset{display:block;width:100%;text-align:center;padding:14px;margin-top:8px;font-size:13px;color:var(--tinta-baja)}
.pref-reset:hover{color:var(--brasa)}
details.plegable{margin:0 0 30px}
details.plegable summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;padding:6px 0}
details.plegable summary::-webkit-details-marker{display:none}
.mas{font-family:var(--sans);font-size:1.35rem;line-height:1;color:var(--tinta-baja);transition:transform .28s cubic-bezier(.3,.8,.4,1)}
details[open] .mas{transform:rotate(45deg)}

/* Guía de uso */
.guia-uso{list-style:none;margin:0 0 8px;padding:0}
.guia-uso li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--linea-fuerte)}
.guia-uso .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--llama);color:#1A1006;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.guia-uso b{display:block;font-family:var(--serif);font-weight:400;font-size:1.1rem;color:var(--tinta);margin:0 0 3px}
.guia-uso span{font-size:13.5px;line-height:1.55;color:var(--tinta-baja)}

/* Flujos: opciones seleccionables */
.onb-opt .opt-t{font-family:var(--sans);font-size:15px}
.onb-opt.on .opt-t::before{content:"✓ ";color:var(--brasa);font-weight:700}
.eleccion{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.eleccion .tarea-t{font-size:14.5px}
.mini-seg{display:flex;gap:4px;flex-shrink:0}
.mini{padding:7px 11px;border:1px solid var(--linea-fuerte);border-radius:999px;font-size:12.5px;color:var(--tinta-baja)}
.mini.on{border-color:var(--llama);background:color-mix(in srgb,var(--llama) 16%,transparent);color:var(--tinta);font-weight:600}

@media (min-width:700px){ .tabbar{justify-content:center;gap:40px} .tab{flex:0 0 92px} }

/* El aviso breve vive encima del botón + y de la barra, nunca sobre ellos */
.toast{bottom:calc(env(safe-area-inset-bottom) + 156px)}
@media (hover:none){ .onb-opt:hover{border-color:var(--linea-fuerte)} .onb-opt.on:hover{border-color:var(--llama)} }
@media (min-width:1024px){ .fab{right:max(20px,calc(50vw - 404px))} }


/* ══════════════ v3 · la rutina como esqueleto ══════════════ */
/* Las 2 que mueven: el único bloque con peso visual */
.sec.mueven{padding:18px 20px 6px;border:1px solid color-mix(in srgb,var(--llama) 30%,var(--linea));border-radius:18px;background:color-mix(in srgb,var(--llama) 6%,transparent)}
.sec.mueven .lista{border-top-color:color-mix(in srgb,var(--llama) 24%,var(--linea-fuerte))}
.sec.mueven .tarea,.sec.mueven .vacio{border-bottom-color:color-mix(in srgb,var(--llama) 18%,var(--linea))}
.sec.mueven .tarea:last-of-type{border-bottom:none}
.sec.mueven .tarea-t{font-size:16.5px}

/* Franjas del día */
.franja{margin:0 0 18px;padding-left:14px;border-left:2px solid var(--linea-fuerte)}
.franja.ahora{border-left-color:var(--llama)}
.franja-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 0 4px}
.franja-n{font-family:var(--serif);font-size:1.08rem;color:var(--tinta-baja)}
.franja.ahora .franja-n{color:var(--tinta)}
.franja-h{font-size:11.5px;letter-spacing:.04em;color:var(--tinta-baja)}
.franja-turno{font-size:12.5px;line-height:1.5;color:var(--tinta-baja);margin:0 0 6px}
.franja-turno b{color:var(--tinta);font-weight:600}
.franja .lista{border-top:1px solid var(--linea)}
.franja .tarea:last-of-type,.franja .vacio:last-of-type{border-bottom:none}
.hobby-fila{padding:13px 0;font-size:13.5px;line-height:1.5;color:var(--tinta-baja)}
.hobby-et{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brasa);margin-right:8px}
.hobby-n{display:block;font-size:12px;margin-top:4px;opacity:.85}
.comp{color:var(--oro)}
.comp::before{content:"⚑ ";font-size:11px}

/* Propósito, lugar en la vida, lo que abre */
.proposito{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:16px 18px;margin:0 0 22px;border:1px dashed var(--linea-fuerte);border-radius:16px;transition:border-color .2s}
.proposito:hover{border-color:var(--llama)}
.proposito-et{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brasa)}
.proposito-t{font-family:var(--serif);font-style:italic;font-size:1.1rem;line-height:1.45;color:var(--tinta)}
.lane{margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-baja);border:1px solid var(--linea-fuerte);border-radius:999px;padding:3px 9px}
.meta-rol{width:100%}
.meta-abre{font-size:12.5px;line-height:1.55;color:var(--tinta-baja);margin:-10px 0 16px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--llama) 40%,transparent)}
.meta-abre b{color:var(--tinta);font-weight:600}
.nota-80{font-size:13px;line-height:1.55;color:var(--oro);margin:0 0 18px;padding-left:12px;border-left:2px solid var(--oro)}
.paso-franja{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-baja);margin:14px 0 8px}
.fila-i.hoy .tarea-t{font-weight:600}
.fila-i.hoy .fila-d{color:var(--tinta)}
.franja-horas{display:flex;align-items:center;gap:12px}
.franja-horas .campo-in{width:70px;text-align:center}
.franja-horas span{font-size:13px;color:var(--tinta-baja)}

/* ══════════════ v4 · el 80/20 por actividad ══════════════ */
.sec.mueven.cuenta{border-color:color-mix(in srgb,var(--llama) 48%,var(--linea));background:color-mix(in srgb,var(--llama) 10%,transparent)}
.sec.mueven.cuenta .sec-t{color:var(--tinta)}

/* La semana: siete marcas por actividad */
.lista.sem{border-top:1px solid var(--linea)}
.sem-fila{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--linea)}
button.sem-fila:hover .sem-nom{color:var(--tinta)}
.sem-nom{font-size:14.5px;line-height:1.35;color:var(--tinta);min-width:0}
.sem-peso{display:inline-block;margin-left:7px;font-size:9px;vertical-align:middle;color:var(--llama)}
.sem-dias{display:flex;gap:4px;grid-column:1;align-self:center}
.sem-d{width:20px;height:20px;border-radius:50%;border:1px solid var(--linea-fuerte);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tinta-baja);flex-shrink:0}
.sem-d.on{background:var(--llama);border-color:var(--llama);color:#1A1006;font-weight:700}
.sem-d.hoy{border-color:var(--tinta-baja)}
.sem-d.futuro{opacity:.4}
.sem-estado{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:12.5px;line-height:1.4;color:var(--tinta-baja);white-space:nowrap}
.sem-fila.logrado .sem-estado{color:var(--oro);font-weight:600}

/* Doble clic: el detalle de la semana */
.sem-detalle{border-top:1px solid var(--linea-fuerte);margin:0 0 16px}
.sem-dia{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--linea)}
.sem-dia-n{font-size:13px;color:var(--tinta-baja);flex:0 0 92px}
.sem-dia-v{font-size:13.5px;line-height:1.45;color:var(--tinta-baja);text-align:right}
.sem-dia.on .sem-dia-n{color:var(--tinta);font-weight:600}
.sem-dia.on .sem-dia-v{color:var(--tinta)}
.sem-dia.hoy{background:color-mix(in srgb,var(--llama) 7%,transparent);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px}
.veredicto-sem{font-family:var(--serif);font-size:1.08rem;line-height:1.5;color:var(--tinta-baja);margin:0 0 6px;padding-left:12px;border-left:2px solid var(--linea-fuerte)}
.veredicto-sem.logrado{color:var(--oro);border-left-color:var(--oro)}

/* ── v5 · subacciones ── */
.paso-mas{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;font-size:13.5px;color:var(--tinta-baja);text-align:left;transition:color .2s}
.paso-mas:hover{color:var(--tinta)}
.paso-mas svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;flex-shrink:0}
.sub-lista{border-top:1px solid var(--linea-fuerte);margin-bottom:6px}
.sub-lista .tarea{min-height:48px}
.sub-lista .tarea-cuerpo{padding:12px 0}
.quitar-sub{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tinta-baja);border-radius:50%;transition:color .2s,background .2s}
.quitar-sub:hover{color:var(--brasa);background:color-mix(in srgb,var(--brasa) 9%,transparent)}

</style>
</head>
<body>
<div class="cauce dormido" id="cauce" aria-hidden="true"><div class="cauce-lecho"><div class="cauce-agua"></div><div class="cauce-andado" id="cauceAndado"></div><div class="cauce-luz" id="cauceLuz"></div></div></div>
<div id="appShell">
  <main class="lienzo" id="lienzo"><div id="vista"></div></main>
  <button class="fab" data-accion="fab" aria-label="Agregar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" aria-label="Secciones">
    <button class="tab activo" data-accion="tab" data-tab="hoy"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 18h18"/><path d="M7 18a5 5 0 0 1 10 0"/><path d="M12 9V6"/><path d="M6.3 12.2 4.9 10.8"/><path d="M17.7 12.2l1.4-1.4"/></svg></span><span class="tab-lb">Hoy</span></button>
    <button class="tab" data-accion="tab" data-tab="metas"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2.5 4L16 12H5"/></svg></span><span class="tab-lb">Metas</span></button>
    <button class="tab" data-accion="tab" data-tab="rutinas"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg></span><span class="tab-lb">Rutina</span></button>
    <button class="tab" data-accion="tab" data-tab="ideas"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></span><span class="tab-lb">Ideas</span></button>
  </nav>
</div>
<div class="onb oculto" id="flujo" role="dialog" aria-modal="true" aria-label="Paso a paso">
  <div class="onb-top">
    <button class="onb-back oculto" id="flujoAtras" data-accion="flujo-atras" aria-label="Paso anterior">←</button>
    <div class="onb-dots" id="flujoDots" aria-hidden="true"></div>
    <button class="flujo-x" data-accion="flujo-cerrar" aria-label="Cerrar">✕</button>
  </div>
  <div class="onb-cont" id="flujoCont"></div>
</div>
<div id="hojas"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ══════════════════════════════════════════════
   CAUCE v2 · tu día, guiado
   Guardado · Tiempo · Contenido · Semilla · Migración · Esquema
   · Reglas · Acciones · Vistas · Hojas · Flujos · Arranque
   ══════════════════════════════════════════════ */

/* ════════ GUARDADO (misma interfaz que Práctica) ════════
   En Claude usa window.storage. Para GitHub Pages, sustituye este bloque
   por el Guardado de Práctica (ver documento de diseño, sección 7). */
const Guardado = (() => {
  /* Tres modos, en este orden:
     1) almacenamiento de Claude (cuando corre dentro de Claude),
     2) localStorage del navegador (GitHub Pages, o el archivo abierto en tu equipo),
     3) memoria de la sesión, si el navegador bloquea el almacenamiento. */
  const memoria = {};
  const claude = () => typeof window !== "undefined" && !!window.storage && typeof window.storage.get === "function";
  const local = (() => {
    try{ const k = "cauce:probe"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; }
    catch(e){ return false; }

    return pend >= 1 && pend <= Math.max(1, Math.round(acc.length * 0.2)) ? e : null;
  },
  faltan: m => { const e = Rg.etapaActual(m); if(!e) return 0; return Rg.accionesEtapa(m, e.id).filter(a => !a.hecha).length; },
  atoradas: () => E.acciones.filter(a => !a.hecha && (a.pospuesta || 0) >= 2 && !(a.compromiso && a.compromiso.con)),
  principal: () => E.metas.find(m => m.rol === "principal") || null,
  secundaria: () => E.metas.find(m => m.rol === "secundaria") || null,
  activas: () => E.metas.filter(m => m.rol === "principal" || m.rol === "secundaria").sort((a, b) => (a.rol === "principal" ? 0 : 1) - (b.rol === "principal" ? 0 : 1)),
  meta: id => E.metas.find(m => m.id === id) || null,
  etapaActual: m => m ? (m.etapas.find(e => !e.hecha) || null) : null,
  idxEtapa: (m, eid) => m.etapas.findIndex(e => e.id === eid),
  etapaDe: a => { const m = Rg.meta(a.metaId); return m ? m.etapas.find(e => e.id === a.etapaId) || null : null; },
  accionesEtapa: (m, eid) => E.acciones.filter(a => a.metaId === m.id && a.etapaId === eid).sort((a, b) => a.orden - b.orden),
  pendientesMeta: m => {
    if(!m) return [];
    const pos = a => { const i = Rg.idxEtapa(m, a.etapaId); return i < 0 ? 999 : i; };
    return E.acciones.filter(a => a.metaId === m.id && !a.hecha).sort((a, b) => (pos(a) - pos(b)) || (a.orden - b.orden));
  },
  /* Lo que quedó de ayer va primero; después, la ruta en orden */
  sugeridas: (m, n, excluir) => {
    const hoy = hoyISO(), ex = excluir || [];
    const p = Rg.pendientesMeta(m).filter(a => !ex.includes(a.id));
    const antes = p.filter(a => a.sugerir && a.sugerir <= hoy);
    return antes.concat(p.filter(a => !antes.includes(a))).slice(0, n);
  },
  etapaCompleta: m => { const e = Rg.etapaActual(m); if(!e) return null; const acc = Rg.accionesEtapa(m, e.id); return acc.length && acc.every(a => a.hecha) ? e : null; },
  rutinasHoy: f => E.rutinas.filter(r => tocaRutina(r, f)),
  pendHoy: f => E.pendientes.filter(p => (!p.hecha && p.fecha <= f) || (p.hecha && p.hechaEl === f)),
  bandeja: () => E.ideas.filter(i => i.estado === "bandeja"),
  espera: () => E.ideas.filter(i => i.estado === "espera").sort((a, b) => String(a.vence || "9999").localeCompare(String(b.vence || "9999"))),
  cerradas: () => E.ideas.filter(i => ["soltada", "decidida", "convertida"].includes(i.estado)),
  llegaron: f => Rg.espera().filter(i => i.vence && i.vence <= f),
  semanaToca: f => { const u = E.marcas.ultimaSemana; if(!u) return true; const n = diasEntre(u, f), d = deISO(f).getDay(); return n >= 8 || (n >= 5 && (d === 0 || d === 1)); },
  temporadaToca: f => f >= E.temporada.fin,
  refugioLargo: f => E.refugio.activo && !!E.refugio.desde && diasEntre(E.refugio.desde, f) >= 14,
  hechasEnSemana: f => E.acciones.filter(a => a.hecha && a.hechaEl && diasEntre(a.hechaEl, f) < 7)
};
const etapaTexto = m => { const e = Rg.etapaActual(m); if(!e) return "Ruta completa: toca revisar esta meta."; return "Etapa " + (Rg.idxEtapa(m, e.id) + 1) + " de " + m.etapas.length + ": " + e.nombre; };

/* ════════ ACCIONES (cambios de estado) ════════ */
const A = {
  marcarAccion(a){ a.hecha = !a.hecha; a.hechaEl = a.hecha ? hoyISO() : null; if(a.hecha){ delete a.sugerir; a.pospuesta = 0; } },
  marcarRutina(r, f){ const d = diaMut(f), v = !d.rutHechas[r.id]; d.rutHechas[r.id] = v;
    const sub = Rg.sub(r, d); if(sub.length) d.sub[r.id] = sub.map(x => ({ t: x.t, h: v })); },
  /* Marcar una subacción recalcula la actividad: al 80%, se da por hecha sola */
  marcarSub(r, i, f){ const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    if(!sub[i]) return null; sub[i].h = !sub[i].h;
    const antes = !!d.rutHechas[r.id], e = Rg.estadoSub(r, d);
    d.rutHechas[r.id] = e.lista;
    return { antes, ahora: e.lista, e }; },
  nuevaSub(r, texto, f){ const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    sub.push({ t: texto, h: false }); d.rutHechas[r.id] = Rg.estadoSub(r, d).lista; },
  quitarSub(r, i, f){ const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    sub.splice(i, 1); d.rutHechas[r.id] = sub.length ? Rg.estadoSub(r, d).lista : false; },
  marcarPend(p){ p.hecha = !p.hecha; p.hechaEl = p.hecha ? hoyISO() : null; },
  /* Las 2 que mueven: el 20% del día */
  mueve(x){
    const d = diaMut(hoyISO()), i = d.mueven.indexOf(x.id);
    if(i >= 0){ d.mueven.splice(i, 1); return "quitada"; }
    if(d.mueven.filter(id => { const y = pieza(id); return y && !hechaPieza(y, d); }).length >= MAX_MUEVEN) return "lleno";
    d.mueven.push(x.id);
    if(!esRutina(x) && !d.tres.includes(x.id) && !d.sec.includes(x.id)){ const m = Rg.meta(x.metaId); (m && m.rol === "principal" ? d.tres : d.sec).push(x.id); }
    return "ok";
  },
  aFranja(a, fr){ const d = diaMut(hoyISO()); d.franjas = d.franjas || {}; d.franjas[a.id] = fr; },
  posponer(a){ a.pospuesta = (a.pospuesta || 0) + 1; a.sugerir = sumarDias(hoyISO(), 1); },
  comprometer(a, con, cuando){ a.compromiso = { con: (con || "").trim(), cuando: (cuando || "").trim(), desde: hoyISO() }; if(!a.compromiso.con) delete a.compromiso; },
  anotarDiario(f, texto){ texto = (texto || "").trim(); if(texto) E.diario[f] = texto; else delete E.diario[f]; },
  nuevaAccion(m, texto, etapaId){
    const e = etapaId || (Rg.etapaActual(m) || m.etapas[m.etapas.length - 1] || {}).id || null;
    const orden = E.acciones.filter(a => a.metaId === m.id && a.etapaId === e).reduce((mx, a) => Math.max(mx, a.orden + 1), 0);
    const a = { id: uid(), metaId: m.id, etapaId: e, texto, hecha: false, hechaEl: null, orden, creado: hoyISO() };
    E.acciones.push(a); return a;
  },
  nuevoPend(texto, fecha){ const p = { id: uid(), texto, fecha: fecha || hoyISO(), hecha: false, hechaEl: null, creado: hoyISO() }; E.pendientes.push(p); return p; },
  nuevaIdea(texto){ const i = { id: uid(), texto, estado: "bandeja", tipo: "idea", condicion: "", vence: null, creado: hoyISO() }; E.ideas.push(i); return i; },
  nuevaRutina(nombre){ const r = { id: uid(), nombre, area: "Trabajo", frecuencia: "semana", dias: [1,2,3,4,5], diaMes: 1, pasos: [] }; E.rutinas.push(r); return r; },
  /* Para hoy: la principal admite tres; la secundaria, una pendiente */
  aHoy(a){
    const m = Rg.meta(a.metaId); if(!m) return "sin";
    const d = diaMut(hoyISO()), esP = m.rol === "principal", lista = esP ? d.tres : d.sec;
    if(lista.includes(a.id)) return "ya";
    const abiertas = lista.map(accion).filter(x => x && !x.hecha).length;
    if(abiertas >= (esP ? MAX_TRES : 1)) return "lleno";
    lista.push(a.id); if(!esP) d.secNo = false; return "ok";
  },
  quitarDeHoy(a){ const d = diaMut(hoyISO()); d.tres = d.tres.filter(x => x !== a.id); d.sec = d.sec.filter(x => x !== a.id); },
  borrarAccion(a){ E.acciones = E.acciones.filter(x => x.id !== a.id); Object.values(E.dias).forEach(d => { d.tres = d.tres.filter(x => x !== a.id); d.sec = d.sec.filter(x => x !== a.id); }); },
  etapaHecha(m, e){ e.hecha = true; e.hechaEl = hoyISO(); const sig = Rg.etapaActual(m); if(sig) E.acciones.filter(a => a.metaId === m.id && a.etapaId === e.id && !a.hecha).forEach((a, k) => { a.etapaId = sig.id; a.orden = -100 + k; }); },
  planAuto(){
    const f = hoyISO(), d = diaMut(f), p = Rg.principal(), s = Rg.secundaria(), t = Rg.turnoHoy(f);
    if(p && !d.tres.length) d.tres = Rg.sugeridas(p, MAX_TRES).map(a => a.id);
    const hayTurno = t.metaId && s && t.metaId === s.id;
    if(s && !d.sec.length && !d.secNo && hayTurno) d.sec = Rg.sugeridas(s, 1).map(a => a.id);
    if(!d.mueven.length){
      const pes = Rg.dePeso(f).filter(r => !d.omitidas.includes(r.id)).map(r => r.id);
      d.mueven = d.tres.slice(0, MAX_MUEVEN);
      if(d.mueven.length < MAX_MUEVEN && pes.length) d.mueven = d.mueven.concat(pes.slice(0, MAX_MUEVEN - d.mueven.length));
    }
    d.planeado = true;
  },
  soltarIdea(i, razon){ i.estado = "soltada"; i.cerradaEl = hoyISO(); i.razon = razon || ""; },
  decidirIdea(i, decision){ i.estado = "decidida"; i.cerradaEl = hoyISO(); i.razon = decision || ""; },
  ideaAAccion(i, m){ const a = A.nuevaAccion(m, i.texto); A.soltarIdea(i, "Se volvió acción de " + m.nombre + "."); i.estado = "convertida"; return a; }
};

  agregar: (id, ph, enter, datos) => `<div class="agregar"><button class="agregar-mas" data-accion="enviar" data-para="${id}" aria-label="Agregar">${ICO.mas}</button><input id="${id}" data-enter="${enter}"${datos || ""} placeholder="${esc(ph)}" enterkeyhint="done" autocomplete="off" aria-label="${esc(ph)}"></div>`,

};


/* ════════ VISTAS ════════ */
function pintar(){
  if(!E) return;
  pintarCauce();
  ({ hoy: pintarHoy, metas: pintarMetas, rutinas: pintarRutinas, ideas: pintarIdeas }[S.tab] || pintarHoy)();
  $$(".tab").forEach(b => { const on = b.dataset.tab === S.tab; b.classList.toggle("activo", on); if(on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if(S.refoco){ const el = document.getElementById(S.refoco); S.refoco = null; if(el) try{ el.focus({ preventScroll: true }); }catch(e){} }
}
/* La línea del cauce: dónde va la temporada, sin número (la veladora de Práctica, en otra tarea) */
function pintarCauce(){
  const t = E.temporada, total = Math.max(1, diasEntre(t.inicio, t.fin));
  const p = (Math.min(total, Math.max(0, diasEntre(t.inicio, hoyISO()))) / total * 100).toFixed(2) + "%";
  $("#cauce").classList.remove("dormido"); $("#cauce").classList.toggle("refugio", !!E.refugio.activo);
  $("#cauceAndado").style.height = p; $("#cauceLuz").style.top = p;
}

/* ── Filas ── */
function filaAccion(a, conEtapa){
  const e = conEtapa ? Rg.etapaDe(a) : null, c = a.compromiso && a.compromiso.con;
  const sub = [e ? esc(e.nombre) : "", c ? '<span class="comp">Con ' + esc(a.compromiso.con) + (a.compromiso.cuando ? " · " + esc(a.compromiso.cuando) : "") + "</span>" : ""].filter(Boolean).join(" · ");
  return `<div class="tarea${a.hecha ? " hecha" : ""}"><button class="check" role="checkbox" aria-checked="${!!a.hecha}" aria-label="${a.hecha ? "Desmarcar" : "Marcar como hecha"}: ${esc(a.texto)}" data-accion="marcar-accion" data-id="${a.id}"><span class="check-c">${ICO.check}</span></button>` +
    `<button class="tarea-cuerpo" data-accion="ver-accion" data-id="${a.id}"><span class="tarea-t">${esc(a.texto)}</span>${sub ? `<span class="tarea-s">${sub}</span>` : ""}</button></div>`;
}
function filaRutina(r, d){
  const hecha = !!d.rutHechas[r.id], e = Rg.estadoSub(r, d), abierta = S.abiertas.includes(r.id);
  const txtSub = e.n ? (e.hechas >= e.n ? "Las " + e.n + ", hechas" : e.lista ? e.hechas + " de " + e.n + " · suficiente" : e.hechas + " de " + e.n + (e.n >= 3 ? " · con " + e.suf + " basta" : "")) : "";
  const sub = [r.area !== "Trabajo" ? r.area : "", txtSub].filter(Boolean).join(" · ");
  let html = `<div class="tarea${hecha ? " hecha" : ""}"><button class="check" role="checkbox" aria-checked="${hecha}" aria-label="${hecha ? "Desmarcar" : "Marcar como hecha"}: ${esc(r.nombre)}" data-accion="marcar-rutina" data-id="${r.id}"><span class="check-c">${ICO.check}</span></button>` +
    `<button class="tarea-cuerpo" data-accion="ver-rutina-hoy" data-id="${r.id}"><span class="tarea-t">${esc(r.nombre)}</span>${sub ? `<span class="tarea-s">${esc(sub)}</span>` : ""}</button>` +
    (e.n ? `<span class="tarea-lado"><button class="plegar" data-accion="plegar" data-id="${r.id}" aria-expanded="${abierta}" aria-label="${abierta ? "Ocultar" : "Ver"} las partes de ${esc(r.nombre)}">${ICO.abajo}</button></span>` : "") + `</div>`;
  if(e.n && abierta){
    html += `<div class="pasos">${e.sub.map((x, i) => `<button class="paso-f${x.h ? " hecho" : ""}" role="checkbox" aria-checked="${x.h}" data-accion="marcar-sub" data-id="${r.id}" data-i="${i}"><span class="check-c">${ICO.check}</span><span>${esc(x.t)}</span></button>`).join("")}` +
      `<button class="paso-mas" data-accion="ver-rutina-hoy" data-id="${r.id}">${ICO.mas}<span>Agregar o quitar</span></button></div>`;
  }
  return html;
}
function filaPend(p, hoy){
  const antes = !p.hecha && p.fecha < hoy;
  return `<div class="tarea${p.hecha ? " hecha" : ""}"><button class="check" role="checkbox" aria-checked="${!!p.hecha}" aria-label="${p.hecha ? "Desmarcar" : "Marcar como hecho"}: ${esc(p.texto)}" data-accion="marcar-pend" data-id="${p.id}"><span class="check-c">${ICO.check}</span></button>` +
    `<button class="tarea-cuerpo" data-accion="ver-pend" data-id="${p.id}"><span class="tarea-t">${esc(p.texto)}</span>${antes ? `<span class="tarea-s">Quedó del ${fechaLarga(p.fecha)}</span>` : ""}</button></div>`;
}

/* ── Hoy: la rutina es el esqueleto; las 2 que mueven, el 20% ── */
function pintarHoy(){
  const f = hoyISO(), h = new Date().getHours(), d = diaDe(f), ref = E.refugio.activo, t = Rg.turnoHoy(f);
  const saludo = (h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches") + (E.ajustes.nombre ? ", " + esc(E.ajustes.nombre) : "");
  let html = `<header class="cab"><div><p class="rubrica">${h < 12 ? "Antes de empezar" : h < 19 ? "A media jornada" : "Para cerrar el día"}</p><h1 class="saludo" tabindex="-1">${saludo}</h1>` +
    `<p class="fecha">${capit(fechaLarga(f))}${t.texto && !ref ? ` · Turno de hoy: <b>${esc(t.texto)}</b>` : ""}</p></div>` +
    `<div class="cab-acc"><button class="icono" data-accion="guia" aria-label="Cómo se usa">${ICO.ayuda}</button><button class="icono" data-accion="ajustes" aria-label="Ajustes">${ICO.ajustes}</button></div></header>`;
  html += ref ? tarjetaRefugio(f) : tarjetaDelMomento(f, h, d);
  if(!ref){
    const p = Rg.principal(), s = Rg.secundaria();
    [p, s].filter(Boolean).forEach(m => {
      const comp = Rg.etapaCompleta(m), ochenta = comp ? null : Rg.etapa80(m);
      if(comp) html += `<div class="base-linea"><b>Terminaste la etapa «${esc(comp.nombre)}».</b> <button class="enlace" data-accion="etapa-hecha" data-id="${m.id}">Pasar a la siguiente</button></div>`;
      else if(ochenta){ const n = Rg.faltan(m);
        html += `<div class="base-linea"><b>«${esc(ochenta.nombre)}» ya va en el último tramo:</b> ${n === 1 ? "falta una cosa" : "faltan " + n}. Suficiente para cerrarla y seguir; lo que falte se va contigo a la siguiente. <button class="enlace" data-accion="etapa-hecha" data-id="${m.id}">Cerrar etapa</button> · <button class="enlace" data-accion="ruta" data-id="${m.id}">Ver qué falta</button></div>`; }
    });
    html += seccionMueven(d);
  }
  html += seccionFranjas(f, d, ref);
  html += seccionPend(f);
  if(E.semana.intencionBase && E.semana.fecha && diasEntre(E.semana.fecha, f) < 8) html += `<p class="base-linea"><b>Tu base esta semana:</b> ${esc(E.semana.intencionBase)}</p>`;
  html += `<p class="principio">${esc(PRINCIPIOS[numeroDia() % PRINCIPIOS.length])}</p>`;
  if(!ref) html += `<p class="pie">¿Semana difícil? <button data-accion="refugio">Quedarme solo con la rutina</button></p>`;
  $("#vista").innerHTML = html;
}

function tarjetaDelMomento(f, h, d){
  const p = Rg.principal(), t = Rg.turnoHoy(f);
  if(!d.planeado){
    const practica = E.ajustes.practica ? `<p class="nota-suave" style="margin:0 0 12px">Si quieres, primero <a class="enlace" href="${esc(E.ajustes.practica)}" target="_blank" rel="noopener">tu práctica</a>.</p>` : "";
    return `<section class="guia" aria-label="Planea tu día"><h2 class="guia-t">Planea tu día</h2><p class="guia-s">Dos minutos. Tu rutina ya está puesta; solo eliges qué mueve hoy.</p>${practica}` +
      `<ol class="guia-pasos"><li>Confirma tu rutina del día</li><li>Elige las 2 que mueven ${esc(p ? p.nombre : "tu meta")}</li><li>Turno de la tarde: ${esc(t.texto || "libre")}</li><li>Suma tus pendientes</li></ol>` +
      `<div class="guia-acc"><button class="btn" data-accion="planear">Planear mi día</button><button class="btn-sec" data-accion="plan-auto">Usar lo sugerido</button></div></section>`;
  }
  if(Rg.temporadaToca(f)) return `<section class="guia"><h2 class="guia-t">Tu temporada llegó a su fecha</h2><p class="guia-s">Unos 20 minutos para decidir si tus dos metas siguen, terminaron o cambian.</p><div class="guia-acc"><button class="btn" data-accion="revisar-metas">Revisar mis metas</button></div></section>`;
  if(Rg.semanaToca(f) && !S.ocultarSemana) return `<section class="guia"><h2 class="guia-t">Planea tu semana</h2><p class="guia-s">Diez minutos: lo que avanzaste, las acciones de la semana y qué hacer con tus ideas.</p><div class="guia-acc"><button class="btn" data-accion="plan-semana">Planear la semana</button><button class="btn-sec" data-accion="semana-luego">Ahora no</button></div></section>`;
  if(h >= 20 && !d.cerrado) return `<section class="guia"><h2 class="guia-t">Cierra el día</h2><p class="guia-s">Un minuto. Marcas, sueltas en una línea y lo que no se hizo pasa a mañana.</p><div class="guia-acc"><button class="btn" data-accion="cerrar-dia">Cerrar el día</button></div></section>`;
  return "";
}
function tarjetaRefugio(f){
  return `<section class="guia"><h2 class="guia-t">Semana difícil</h2><p class="guia-s">${Rg.refugioLargo(f) ? "Sigue activa. ¿Todavía la necesitas? No hay prisa." : "Solo tu rutina y lo urgente. Tus metas esperan sin costo; no hay nada que recuperar después."}</p><div class="guia-acc"><button class="btn" data-accion="refugio-salir">Volver a mis metas</button>${Rg.refugioLargo(f) ? `<button class="btn-sec" data-accion="refugio-sigo">Sigo necesitándola</button>` : ""}</div></section>`;
}

/* El 20%: dos cosas, y el día ya valió */
/* Una pieza de las 2 que mueven: puede ser acción de meta o rutina de peso */
function filaPieza(x, d){
  if(!esRutina(x)) return filaAccion(x, true);
  const hecha = !!d.rutHechas[x.id], sem = Rg.semanaRutina(x, hoyISO());
  const sub = sem.meta >= 3 ? (sem.estado === "completo" ? "Completo esta semana" : sem.estado === "suficiente" ? "Suficiente esta semana: " + sem.hechas + " de " + sem.meta : sem.hechas + " de " + sem.meta + " esta semana") : x.area;
  return `<div class="tarea${hecha ? " hecha" : ""}"><button class="check" role="checkbox" aria-checked="${hecha}" aria-label="${hecha ? "Desmarcar" : "Marcar como hecha"}: ${esc(x.nombre)}" data-accion="marcar-rutina" data-id="${x.id}"><span class="check-c">${ICO.check}</span></button>` +
    `<button class="tarea-cuerpo" data-accion="ver-semana" data-id="${x.id}" data-tipo="rutina"><span class="tarea-t">${esc(x.nombre)}</span><span class="tarea-s">${esc(sub)}</span></button></div>`;
}
function seccionMueven(d){
  const m = Rg.mueven(d), hechas = m.filter(x => hechaPieza(x, d)).length, cuenta = Rg.diaCuenta(d);
  const puntos = [0, 1].map(i => `<span class="punto${m[i] && hechaPieza(m[i], d) ? " on" : ""}"></span>`).join("");
  let html = `<section class="sec mueven${cuenta ? " cuenta" : ""}" aria-label="Las 2 que mueven"><div class="sec-cab"><h2 class="sec-t">${cuenta ? "El día cuenta" : "Las 2 que mueven"}</h2><span class="puntos" role="img" aria-label="${Math.min(hechas, 2)} de 2 hechas">${puntos}</span></div>` +
    `<p class="sec-s">${cuenta ? "Hiciste lo que más pesa. Lo demás es extra: no lo debes." : "El 20% de hoy. Si solo salen estas dos, el día ya cuenta."}</p><div class="lista">`;
  html += m.map(x => filaPieza(x, d)).join("");
  if(m.length < MAX_MUEVEN) html += `<p class="vacio">${m.length ? "Puedes elegir otra." : "Aún no eliges."} <button data-accion="elegir" data-cual="mueven">Elegir${m.length ? " otra" : "las"}</button>${m.length ? "" : ` o <button data-accion="plan-auto">usar lo sugerido</button>.`}</p>`;
  else if(cuenta) html += `<p class="vacio">¿Te queda cuerda? <button data-accion="elegir" data-cual="mueven">Tomar otra</button>, sin obligación.</p>`;
  return html + `</div></section>`;
}

/* La rutina del día, en franjas */
function seccionFranjas(f, d, ref){
  const ahora = Rg.franjaAhora(), t = Rg.turnoHoy(f), resto = ref ? [] : Rg.restoDia(d);
  const omitidas = Rg.rutinasHoy(f).filter(r => d.omitidas.includes(r.id));
  let html = `<section class="sec" aria-label="Tu día"><div class="sec-cab"><h2 class="sec-t">Tu día</h2></div><p class="sec-s">Tu rutina, en el orden en que ocurre. Si un día no se hace, mañana empiezas limpio.</p>`;
  E.franjas.forEach(fr => {
    const rs = Rg.rutinasFranja(f, fr.id).filter(r => !d.omitidas.includes(r.id));
    const acc = resto.filter(a => Rg.franjaDe(a, d) === fr.id);
    const esTurno = fr.id === "tarde" && t.texto;
    let cuerpo = rs.map(r => filaRutina(r, d)).join("") + acc.map(a => filaAccion(a, true)).join("");
    if(fr.id === "noche" && E.hobbies.length) cuerpo += `<div class="hobby-fila"><span class="hobby-et">Hobby</span>${E.hobbies.map(x => esc(x.nombre)).join(" · ")}<span class="hobby-n">Sin tareas ni metas. No tiene que salir bien.</span></div>`;
    if(!cuerpo) cuerpo = `<p class="vacio">Libre.</p>`;
    html += `<div class="franja${fr.id === ahora ? " ahora" : ""}"><div class="franja-cab"><span class="franja-n">${esc(fr.nombre)}</span><span class="franja-h">${fr.desde}:00–${fr.hasta === 24 ? "24" : fr.hasta}:00</span></div>` +
      (esTurno ? `<p class="franja-turno">Turno de hoy: <b>${esc(t.texto)}</b></p>` : fr.id === "tarde" ? `<p class="franja-turno">Hoy sin turno. Libre.</p>` : "") +
      `<div class="lista">${cuerpo}</div></div>`;
  });
  if(omitidas.length) html += `<p class="nota-suave">Hoy no: ${omitidas.map(r => `<button class="enlace" data-accion="recuperar-rutina" data-id="${r.id}">${esc(r.nombre)}</button>`).join(", ")}.</p>`;
  return html + `</section>`;
}

function seccionPend(f){
  const ps = Rg.pendHoy(f), abiertos = ps.filter(p => !p.hecha).length;
  let html = `<section class="sec"><div class="sec-cab"><h2 class="sec-t">Pendientes</h2></div><p class="sec-s">Lo suelto de hoy: no es rutina ni parte de una meta.</p><div class="lista">`;
  html += ps.map(p => filaPend(p, f)).join("");
  html += P.agregar("nuevoPend", "Agregar pendiente…", "nuevo-pend") + `</div>`;
  if(abiertos > 5) html += `<p class="nota-suave">Día cargado. Toca un pendiente para pasarlo a mañana.</p>`;
  return html + `</section>`;
}

/* ── Metas ── */
function rutaPuntos(m){
  const e = Rg.etapaActual(m);
  return m.etapas.map((x, k) => (k ? `<span class="ruta-l${m.etapas[k - 1].hecha ? " hecha" : ""}"></span>` : "") + `<span class="ruta-p${x.hecha ? " hecha" : x === e ? " actual" : ""}"></span>`).join("");
}
function tarjetaMeta(m){
  const e = Rg.etapaActual(m), sig = e ? Rg.accionesEtapa(m, e.id).filter(a => !a.hecha).slice(0, 4) : [];
  const comp = Rg.etapaCompleta(m), ochenta = comp ? null : Rg.etapa80(m);
  return `<section class="meta ${m.rol}" aria-label="${esc(m.nombre)}"><p class="meta-rol">${m.rol === "principal" ? `<span class="flama" aria-hidden="true"></span>Meta principal` : "Meta secundaria"}<span class="lane">${esc(LANES[m.lane] || "")}</span></p>` +
    `<h2 class="meta-nom">${esc(m.nombre)}</h2><p class="meta-res">${esc(m.resultado)}</p>` +
    (m.abre ? `<p class="meta-abre"><b>Abre:</b> ${esc(m.abre)}</p>` : "") +
    (m.etapas.length ? `<div class="ruta" aria-hidden="true">${rutaPuntos(m)}</div>` : "") +
    `<p class="ruta-txt">${e ? `Etapa ${Rg.idxEtapa(m, e.id) + 1} de ${m.etapas.length}: <b>${esc(e.nombre)}</b>` : m.etapas.length ? "<b>Ruta completa.</b> Toca revisar esta meta." : "Todavía no tiene etapas."}</p>` +
    `<div class="lista">${sig.map(a => filaAccion(a, false)).join("")}${comp ? `<p class="vacio">Terminaste esta etapa. <button data-accion="etapa-hecha" data-id="${m.id}">Pasar a la siguiente</button></p>` : ochenta ? `<p class="vacio">Último tramo: ${Rg.faltan(m) === 1 ? "falta una" : "faltan " + Rg.faltan(m)}. Ya es suficiente. <button data-accion="etapa-hecha" data-id="${m.id}">Cerrar etapa</button></p>` : ""}` +
    P.agregar("na_" + m.id, "Agregar acción a esta etapa…", "nueva-accion", ` data-meta="${m.id}"`) + `</div>` +
    `<div class="meta-acc"><button class="btn-sec" data-accion="ruta" data-id="${m.id}">Ver la ruta completa</button><button class="btn-sec" data-accion="editar-meta" data-id="${m.id}">Editar meta</button></div></section>`;
}
function pintarMetas(){
  const f = hoyISO(), p = Rg.principal(), s = Rg.secundaria();
  let html = `<header class="cab"><div><h1 class="saludo" tabindex="-1">Metas</h1><p class="fecha">Dos a la vez, y una manda. Cada una avanza por etapas; las 2 que mueven cada día salen de aquí.</p></div></header>`;
  html += `<button class="proposito" data-accion="editar-proposito"><span class="proposito-et">Propósito · ¿para qué?</span><span class="proposito-t">${esc(E.ajustes.proposito || "Escríbelo. No es un trabajo: atraviesa todo lo demás.")}</span></button>`;
  if(Rg.temporadaToca(f)) html += `<section class="guia"><h2 class="guia-t">Tu temporada llegó a su fecha</h2><p class="guia-s">Decide si tus metas siguen, terminaron o cambian.</p><div class="guia-acc"><button class="btn" data-accion="revisar-metas">Revisar mis metas</button></div></section>`;
  html += p ? tarjetaMeta(p) : `<section class="meta libre"><p class="meta-rol">Meta principal</p><p class="meta-res">Sin meta principal.</p><button class="btn" data-accion="revisar-metas">Definir mi meta principal</button></section>`;
  html += s ? tarjetaMeta(s) : `<section class="meta libre"><p class="meta-rol">Meta secundaria</p><p class="meta-res">Espacio libre. Nada lo ocupa, y está bien.</p><button class="btn-sec" data-accion="revisar-metas">Ocupar el espacio</button></section>`;
  html += `<div class="fila-botones"><button class="btn-borde" data-accion="plan-semana">Planear la semana</button><button class="btn-borde" data-accion="revisar-metas">Revisar metas</button></div>`;
  html += `<p class="nota-suave" style="margin:-18px 0 30px">Temporada hasta el ${fechaMedia(E.temporada.fin)}. La línea de la izquierda es la temporada: la luz baja conforme avanza.</p>`;
  html += `<details class="plegable"><summary><h2 class="sec-t">Bienestar</h2><span class="mas" aria-hidden="true">+</span></summary><p class="sec-s">Salud, ejercicio, oración, familia, dieta, descanso. No compite ni se mide: se protege apartando tiempo primero.</p><div class="lista">` +
    E.base.map(b => `<button class="fila-i" data-accion="ver-base" data-id="${b.id}"><span class="tarea-cuerpo"><span class="tarea-t">${esc(b.nombre)}</span><span class="tarea-s">${esc(b.forma)}</span></span></button>`).join("") +
    `</div><p class="nota-suave"><button class="enlace" data-accion="nueva-base">Añadir a bienestar</button></p></details>`;
  html += `<details class="plegable"><summary><h2 class="sec-t">Hobby</h2><span class="mas" aria-hidden="true">+</span></summary>` +
    `<p class="sec-s">Lo que haces sin que nadie te pague, porque te gusta. No tiene metas, etapas ni acciones: si lo vuelves negocio, deja de ser descanso.</p>` +
    `<div class="lista">${E.hobbies.map(x => `<button class="fila-i" data-accion="editar-hobby" data-id="${x.id}"><span class="tarea-cuerpo"><span class="tarea-t">${esc(x.nombre)}</span></span></button>`).join("")}` +
    P.agregar("nuevoHobby", "Agregar hobby…", "nuevo-hobby") + `</div></details>`;
  $("#vista").innerHTML = html;
}

/* ── Rutinas ── */
function filaRutinaConfig(r){
  const cuando = r.frecuencia === "mes" ? "Día " + r.diaMes + " de cada mes" : diasTexto(r.dias);
  const fr = Rg.franja(r.franja) || {};
  const metaTxt = r.frecuencia !== "mes" && r.semanal > 0 ? r.semanal + "×/semana" : "";
  const partes = r.pasos.length ? r.pasos.length + " partes fijas" : "";
  return `<button class="fila-i" data-accion="editar-rutina" data-id="${r.id}"><span class="tarea-cuerpo"><span class="tarea-t">${esc(r.nombre)}${r.peso ? `<span class="sem-peso">●</span>` : ""}</span><span class="tarea-s">${esc([fr.nombre || "", r.area, metaTxt, partes, r.pausada ? "en pausa" : ""].filter(Boolean).join(" · "))}</span></span><span class="fila-d">${esc(cuando)}</span></button>`;
}
/* Los siete días de la semana, marcados donde pasó */
function marcasSemana(dias, f){
  const hoy = hoyISO();
  return `<span class="sem-dias" aria-hidden="true">${dias.map((x, i) => `<span class="sem-d${x.hecha ? " on" : ""}${x.fecha === hoy ? " hoy" : ""}${x.fecha > hoy ? " futuro" : ""}">${LETRAS[(i + 1) % 7]}</span>`).join("")}</span>`;
}
function filaSemanaRutina(r, f){
  const w = Rg.semanaRutina(r, f);
  const et = w.meta < 1 ? "" : w.estado === "completo" ? "Completo"
    : w.estado === "suficiente" ? "Suficiente · " + w.hechas + " de " + w.meta
    : w.hechas ? w.hechas + " de " + w.meta
    : w.meta + " por semana";
  const cls = w.estado === "completo" || w.estado === "suficiente" ? " logrado" : "";
  return `<button class="sem-fila${cls}" data-accion="ver-semana" data-id="${r.id}" data-tipo="rutina">` +
    `<span class="sem-nom">${esc(r.nombre)}${r.peso ? `<span class="sem-peso" title="Cuenta para las 2 que mueven">●</span>` : ""}</span>` +
    marcasSemana(w.dias, f) + `<span class="sem-estado">${esc(et)}</span></button>`;
}
function filaSemanaMeta(m, f){
  const w = Rg.semanaMeta(m, f);
  return `<button class="sem-fila${w.hechas ? " logrado" : ""}" data-accion="ver-semana" data-id="${m.id}" data-tipo="meta">` +
    `<span class="sem-nom">${esc(m.nombre)}</span>` + marcasSemana(w.dias, f) +
    `<span class="sem-estado">${w.hechas ? w.hechas + (w.hechas === 1 ? " acción" : " acciones") : "Sin mover"}</span></button>`;
}
function seccionSemana(f){
  const seg = Rg.seguidas(), otras = E.rutinas.filter(r => r.frecuencia !== "mes" && !r.pausada && !seg.includes(r));
  const l = lunesDe(f);
  return `<section class="sec"><div class="sec-cab"><h2 class="sec-t">Esta semana</h2><span class="fila-d">${fechaCorta(l)} – ${fechaCorta(sumarDias(l, 6))}</span></div>` +
    `<p class="sec-s">El 80/20 por actividad: con el 80% de lo que te propusiste, ya avanzaste. El resto es extra, no deuda.</p>` +
    `<div class="lista sem">${Rg.activas().map(m => filaSemanaMeta(m, f)).join("")}` +
    (seg.length ? seg.map(r => filaSemanaRutina(r, f)).join("")
      : `<p class="vacio">Ninguna rutina tiene meta semanal todavía. Abre una y dile cuántas veces por semana la quieres: el 80% de esa meta ya cuenta como suficiente.</p>`) + `</div>` +
    `<p class="nota-suave">Toca una para ver qué la movió. Con metas de una o dos veces no hay holgura: o pasó o no pasó.</p>` +
    (otras.length ? `<details class="plegable" style="margin:10px 0 0"><summary><span class="sec-s" style="margin:0">Las otras ${otras.length} rutinas, sin meta semanal</span><span class="mas" aria-hidden="true">+</span></summary><div class="lista sem">${otras.map(r => filaSemanaRutina(r, f)).join("")}</div></details>` : "") +
    `</section>`;
}

function pintarRutinas(){
  const sem = E.rutinas.filter(r => r.frecuencia !== "mes"), mes = E.rutinas.filter(r => r.frecuencia === "mes");
  const hoyD = deISO(hoyISO()).getDay();
  let html = `<header class="cab"><div><h1 class="saludo" tabindex="-1">Rutina</h1><p class="fecha">La forma de tu día. Lo que se repite aparece en Hoy solo cuando toca.</p></div></header>`;
  html += seccionSemana(hoyISO());
  html += `<section class="sec"><h2 class="sec-t">Tu día</h2><p class="sec-s">Cuatro franjas, de tu hoja de 24 horas. Cada rutina y cada acción vive en una.</p><div class="lista">` +
    E.franjas.map(fr => `<div class="fila-i"><span class="tarea-cuerpo"><span class="tarea-t">${esc(fr.nombre)}</span><span class="tarea-s">${esc(fr.nota)} · ${E.rutinas.filter(r => (r.franja || "jornada") === fr.id).length} rutinas</span></span><span class="fila-d">${fr.desde}:00–${fr.hasta === 24 ? "24" : fr.hasta}:00</span></div>`).join("") + `</div></section>`;
  html += `<section class="sec"><h2 class="sec-t">El turno de la tarde</h2><p class="sec-s">Una cosa por día, no tres. Es lo que evita que el estudio, el negocio y la pasión se peleen la misma tarde.</p><div class="lista">` +
    [1,2,3,4,5,6,0].map(dw => { const t = E.turnos[dw] || { texto: "" };
      return `<button class="fila-i${dw === hoyD ? " hoy" : ""}" data-accion="editar-turno" data-d="${dw}"><span class="tarea-cuerpo"><span class="tarea-t">${NOMBRES_DIA[dw]}</span></span><span class="fila-d">${esc(t.texto || "libre")}</span></button>`; }).join("") + `</div></section>`;
  if(E.marcas.rutinasDeEjemplo !== false) html += `<div class="base-linea"><b>Estas son de ejemplo.</b> Cámbialas por tus procesos reales: toca una para editarla, o agrega las tuyas. <button class="enlace" data-accion="rutinas-ok">Ya son las mías</button></div>`;
  html += `<section class="sec"><h2 class="sec-t">Cada semana</h2><div class="lista" style="margin-top:8px">${sem.map(filaRutinaConfig).join("") || `<p class="vacio">Sin rutinas semanales.</p>`}</div></section>`;
  html += `<section class="sec"><h2 class="sec-t">Cada mes</h2><div class="lista" style="margin-top:8px">${mes.map(filaRutinaConfig).join("") || `<p class="vacio">Sin rutinas mensuales.</p>`}</div></section>`;
  html += `<div class="fila-botones"><button class="btn-borde" data-accion="nueva-rutina">Nueva rutina</button></div>`;
  html += `<p class="nota-suave">Toda actividad se puede partir: entra a ella en Hoy y escribe lo que la compone. Con el 80% de las partes hechas, la actividad queda hecha.</p>`;
  $("#vista").innerHTML = html;
}

/* ── Ideas ── */
function filaIdea(i){
  const etq = i.tipo === "decision" ? `<span class="etq">Decisión</span>` : "";
  const sub = i.estado === "bandeja" ? "Guardada el " + fechaMedia(i.creado) : (i.condicion || "");
  const lado = i.estado === "espera" && i.vence ? fechaCorta(i.vence) : "";
  return `<button class="fila-i" data-accion="ver-idea" data-id="${i.id}"><span class="tarea-cuerpo"><span class="tarea-t">${etq}${esc(i.texto)}</span>${sub ? `<span class="tarea-s">${esc(sub)}</span>` : ""}</span>${lado ? `<span class="fila-d">${lado}</span>` : ""}</button>`;
}
function pintarIdeas(){
  const b = Rg.bandeja(), es = Rg.espera(), ce = Rg.cerradas();
  let html = `<header class="cab"><div><h1 class="saludo" tabindex="-1">Ideas</h1><p class="fecha">Guárdalas sin perseguirlas. Se revisan el domingo, al planear la semana.</p></div></header>`;
  html += `<section class="sec"><div class="lista">${P.agregar("nuevaIdea", "Anota una idea…", "nueva-idea")}</div></section>`;
  html += `<section class="sec"><h2 class="sec-t">Bandeja</h2><p class="sec-s">Recién guardadas. No necesitas decidir nada ahora.</p><div class="lista">${b.map(filaIdea).join("") || `<p class="vacio">Vacía. Lo que se te ocurra, anótalo arriba o con el botón +.</p>`}</div></section>`;
  html += `<section class="sec"><h2 class="sec-t">En espera</h2><p class="sec-s">Importante, pero no ahora. Cada una tiene su condición y su fecha; al llegar, se decide o se suelta.</p><div class="lista">${es.map(filaIdea).join("") || `<p class="vacio">Nada en espera.</p>`}</div></section>`;
  if(ce.length) html += `<details class="plegable"><summary><h2 class="sec-t">Cerradas</h2><span class="mas" aria-hidden="true">+</span></summary><div class="lista">${ce.map(i => `<div class="fila-i"><span class="tarea-cuerpo"><span class="tarea-t">${esc(i.texto)}</span><span class="tarea-s">${esc((i.estado === "decidida" ? "Decidido: " : i.estado === "convertida" ? "" : "Soltada. ") + (i.razon || ""))}</span></span></div>`).join("")}</div></details>`;
  $("#vista").innerHTML = html;
}


/* ════════ HOJAS ════════ */
function hoja(titulo, sub, cuerpo){
  if(!$("#hojas").innerHTML) S.foco = document.activeElement;
  S.rutaAbierta = null;

/* ════════ FLUJOS (el paso a paso de Práctica) ════════ */
const F = { pasos: [], i: 0, ctx: {}, fin: null, activo: false };
function abrirFlujo(pasos, op){
  op = op || {}; cerrarHoja();
  const t = $("#toast"); if(t) t.classList.remove("on");
  F.pasos = pasos; F.i = 0; F.ctx = op.ctx || {}; F.fin = op.fin || null; F.activo = true;
  S.foco = document.activeElement; $("#flujo").classList.remove("oculto"); $("#appShell").inert = true; pintarPaso();
}
function pintarPaso(){
  const p = F.pasos[F.i]; if(!p) return terminarFlujo();
  $("#flujoCont").innerHTML = `<div class="paso">${p.html(F.ctx)}</div>`;
  const n = F.pasos.length;
  $("#flujoDots").innerHTML = n > 1 && n <= 12 ? F.pasos.map((_, k) => `<span class="onb-dot${k <= F.i ? " on" : ""}"></span>`).join("") : "";
  $("#flujoAtras").classList.toggle("oculto", F.i === 0 || !!p.sinAtras);
  $("#flujoCont").scrollTop = 0; autoAlto($("#flujoCont"));
  if(p.montar) p.montar(F.ctx);
  setTimeout(() => { const el = $("#flujoCont .paso-t"); if(el) try{ el.focus({ preventScroll: true }); }catch(e){} }, 40);
}
function errorPaso(msg){ const el = $("#pasoErr") || $("#hojaErr"); if(el) el.textContent = msg; return false; }
function siguientePaso(valor){
  const p = F.pasos[F.i];
  if(p && p.leer){ const r = p.leer(F.ctx, valor); if(r === false) return; if(r === "fin") return terminarFlujo(); }
  guardar();
  if(F.i + 1 >= F.pasos.length) return terminarFlujo();
  F.i += 1; pintarPaso();
}
function pasoAtras(){ if(F.i > 0){ F.i -= 1; pintarPaso(); } }
function restantes(nuevos){ F.pasos = F.pasos.slice(0, F.i + 1).concat(nuevos); }
function cerrarFlujo(){
  $("#flujo").classList.add("oculto"); $("#flujoCont").innerHTML = ""; F.activo = false;
  $("#appShell").inert = false; asegurarRoles(E); guardar(); pintar();
  if(S.foco && document.body.contains(S.foco)) try{ S.foco.focus({ preventScroll: true }); }catch(e){}
}
function terminarFlujo(){ const fin = F.fin, ctx = F.ctx; F.fin = null; cerrarFlujo(); if(fin) fin(ctx); }

/* ── Planear el día ── */
function flujoPlanDia(){
  const f = hoyISO(), d = diaDe(f), p = Rg.principal(), s = Rg.secundaria(), rs = Rg.rutinasHoy(f), t = Rg.turnoHoy(f);
  const hayTurno = !!(s && t.metaId === s.id);
  const ctx = {
    incluir: rs.filter(r => !d.omitidas.includes(r.id)).map(r => r.id),
    tres: d.tres.length ? d.tres.slice() : (p ? Rg.sugeridas(p, MAX_TRES).map(a => a.id) : []),
    sec: d.sec.length ? d.sec.slice() : (hayTurno && !d.secNo ? Rg.sugeridas(s, 1).map(a => a.id) : []),
    mueven: d.mueven.length ? d.mueven.slice() : [],
    secNo: !!d.secNo
  };
  if(!ctx.mueven.length) ctx.mueven = ctx.tres.slice(0, MAX_MUEVEN);
  const pasos = [{
    html: c => P.tit("Tu rutina de hoy") + (rs.length
      ? P.txt("Ya está puesta, en el orden en que ocurre. Toca las que hoy no aplican.") +
        E.franjas.map(fr => { const rr = rs.filter(r => (r.franja || "jornada") === fr.id); if(!rr.length) return "";
          return `<p class="paso-franja">${esc(fr.nombre)} · ${fr.desde}:00–${fr.hasta === 24 ? "24" : fr.hasta}:00</p><div class="onb-opts">${rr.map(r => P.marca(esc(r.nombre), r.id, "incluir", c.incluir.includes(r.id), 99, esc([r.area !== "Trabajo" ? r.area : "", r.pasos.length ? r.pasos.length + " pasos" : ""].filter(Boolean).join(", ")))).join("")}</div>`; }).join("")
      : P.txt("Hoy no toca ninguna rutina.")) + P.btn("Seguir")
  }];
  if(p) pasos.push({
    html: c => { let cand = [...new Set(c.mueven.concat(Rg.sugeridas(p, 4).map(a => a.id)))];
      if(hayTurno) cand = cand.concat(Rg.sugeridas(s, 2).map(a => a.id));
      cand = cand.concat(Rg.dePeso(f).filter(r => c.incluir.includes(r.id)).map(r => r.id));
      const lista = [...new Set(cand)].map(pieza).filter(x => x && !hechaPieza(x, d));
      return P.tit("¿Qué mueve hoy?") + P.txt("Dos, no cinco. Si solo salen estas dos, el día ya cuenta. " + esc(etapaTexto(p)) + ".") +
        `<div class="onb-opts">${lista.map(x => { if(esRutina(x)){ const w = Rg.semanaRutina(x, f);
            return P.marca(esc(x.nombre), x.id, "mueven", c.mueven.includes(x.id), MAX_MUEVEN, esc(w.meta >= 3 ? "Rutina · " + w.hechas + " de " + w.meta + " esta semana" : "Rutina · " + x.area)); }
          const mm = Rg.meta(x.metaId); return P.marca(esc(x.texto), x.id, "mueven", c.mueven.includes(x.id), MAX_MUEVEN, esc([mm && mm.rol !== "principal" ? mm.nombre : "", (Rg.etapaDe(x) || {}).nombre || ""].filter(Boolean).join(" · "))); }).join("")}</div>` +
        `<div class="lista" style="margin:-6px 0 18px">${P.agregar("planNueva", "Escribir otra acción…", "plan-nueva", ` data-cual="mueven"`)}</div>` + P.err() + P.btn("Seguir"); },
    leer: c => { if(!c.mueven.length) return errorPaso("Elige al menos una. Si hoy no hay espacio para tu meta, activa «Semana difícil» en Ajustes.");
      c.mueven.forEach(id => { const a = accion(id); if(!a) return;
        const m = Rg.meta(a.metaId), lista = m && m.rol === "principal" ? c.tres : c.sec;
        if(!c.tres.includes(id) && !c.sec.includes(id)) lista.push(id); }); }
  });
  pasos.push({
    html: c => P.tit(hayTurno ? "Turno de la tarde: " + esc(t.texto) : t.texto ? "Turno de hoy: " + esc(t.texto) : "La tarde está libre") +
      P.txt(hayTurno ? "Una sola cosa en la tarde, no tres. Esta es la de hoy." : t.texto ? "Hoy la tarde es para " + esc(t.texto) + ". No hay acción de meta que elegir." : "Sin turno asignado hoy. Puedes dejarla libre.") +
      (hayTurno ? `<div class="onb-opts">${[...new Set(c.sec.concat(Rg.sugeridas(s, 4).map(a => a.id)))].map(accion).filter(a => a && !a.hecha).map(a => P.marca(esc(a.texto), a.id, "sec", !c.secNo && c.sec.includes(a.id), 1, esc((Rg.etapaDe(a) || {}).nombre || ""))).join("")}</div>` +
        `<div class="lista" style="margin:-6px 0 18px">${P.agregar("planNuevaS", "Escribir otra…", "plan-nueva", ` data-cual="sec"`)}</div>` + P.btn("Seguir", "si") + P.sec("Hoy no", "no")

        (ps.length > 5 ? `<p class="nota-suave" style="margin-top:-8px">Día cargado. ¿Algo puede pasar a mañana?</p>` : "") + P.btn("Seguir"); }

      d.mueven = c.mueven.slice(0, MAX_MUEVEN); d.secNo = !!c.secNo; d.omitidas = rs.filter(r => !c.incluir.includes(r.id)).map(r => r.id); d.planeado = true; c.ok = true; }
