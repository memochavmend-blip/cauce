<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<!-- El tema se pinta antes del primer frame. Mira primero lo que se eligió
     en Ajustes y solo si no hay nada, lo del sistema: quien eligió Claro con
     el sistema en oscuro veía un parpadeo negro en cada apertura. -->
<script>try{
  var g = localStorage.getItem("cauce:estado:v8"), t = "sistema";
  if (g) { try { t = (JSON.parse(g).ajustes || {}).tema || "sistema"; } catch (e) {} }
  var osc = t === "oscuro" || (t === "sistema" && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.modo = osc ? "oscuro" : "claro";
  document.documentElement.style.background = osc ? "#0E0D0C" : "#FAF8F3";
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", osc ? "#0E0D0C" : "#FAF8F3");
}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cauce">
<title>Cauce</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FAF8F3'/%3E%3Cpath d='M16 3c-5 5 5 10 0 13s5 8 0 13' fill='none' stroke='%23E0942A' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23E0942A'/%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════
   CAUCE v8 · estilos
   Misma paleta y mismas familias que la app hermana — no cambió de
   material, cambió de forma. Lo que se fue: tarjetas, barras de avance,
   porcentajes, acordeones. Lo que queda: una lista con renglones.
   Regla heredada: --tinta-tenue y --llama no se usan para texto chico
   (no pasan AA sobre el papel claro). Para texto chico, --tinta-baja.
   ══════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --noche:#FAF8F3; --panel:#EFE9DF;
  --tinta:#2B2621; --tinta-baja:#5E554B; --tinta-tenue:#877E73;
  --cera:#C9B896; --llama:#E0942A; --brasa:#B4491C; --oro:#8A6A3E;
  --linea:rgba(43,38,33,.10); --linea-fuerte:rgba(43,38,33,.20);
  --serif:ui-serif,"New York",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-modo="oscuro"]{
  color-scheme:dark;
  --noche:#0E0D0C; --panel:#171513;
  --tinta:#ECE6DB; --tinta-baja:#A79C8D; --tinta-tenue:#726859;
  --cera:#CFC0A0; --llama:#F0A63C; --brasa:#C56A3C; --oro:#B79366;
  --linea:rgba(236,230,219,.08); --linea-fuerte:rgba(236,230,219,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--noche);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .4s ease,color .4s ease}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--llama);outline-offset:3px;border-radius:4px}
.oculto{display:none !important}

/* ── La línea de la hora ──
   Hermana de la veladora de la app devocional: el tiempo se siente, no se cuenta.
   Aquí corre de la medianoche a la medianoche. No pide nada. */
.cauce{position:fixed;left:18px;top:0;bottom:0;width:3px;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 20px) 0 calc(env(safe-area-inset-bottom) + 76px)}
.cauce-lecho{position:relative;height:100%;width:3px}
.cauce-agua{position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(180deg,var(--cera),color-mix(in srgb,var(--cera) 35%,transparent));opacity:.3}
.cauce-andado{position:absolute;left:0;top:0;width:3px;border-radius:2px;background:var(--cera);opacity:.75;
  transition:height 1.2s linear}
.cauce-luz{position:absolute;left:-3px;width:9px;height:9px;border-radius:50%;background:var(--llama);
  box-shadow:0 0 10px 2px color-mix(in srgb,var(--llama) 55%,transparent);transition:top 1.2s linear}

#appShell{height:100%;display:flex;flex-direction:column}
.lienzo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 112px) 42px}
#appShell[inert]{filter:blur(2px);opacity:.5}

/* ── Cabecera ── */
.cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.cab > div{flex:1;min-width:0}
.dia{font-family:var(--serif);font-size:27px;line-height:1.18;font-weight:400;margin:0 0 4px;
  letter-spacing:-.01em;outline:none}
.dia::first-letter{text-transform:uppercase}
.dia-s{font-size:13px;color:var(--tinta-baja);margin:0}
.icono{flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;border-radius:11px;color:var(--tinta-baja)}
.icono svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.icono:hover{background:var(--panel);color:var(--tinta)}

/* ── El interruptor de vista: la misma lista, dos lecturas ── */
.segmento{display:flex;gap:2px;background:var(--panel);border-radius:11px;padding:3px;margin:0 0 18px}
.seg{flex:1;text-align:center;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--tinta-baja);
  transition:background .18s ease,color .18s ease}
.seg.activo{background:var(--noche);color:var(--tinta);box-shadow:0 1px 2px rgba(43,38,33,.07)}

/* ══ LA NOTA ══
   Un post-it: renglones separados por una línea, sin tarjetas ni sombras.
   El número de la izquierda es el nivel, y es un botón: tocarlo cicla. */
.nota{list-style:none;margin:0 0 4px;padding:0}
.it{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--linea);min-height:52px}
.it:first-child{border-top:1px solid var(--linea)}
.it-n{flex:0 0 auto;width:26px;height:26px;margin-top:13px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
  background:var(--panel);color:var(--tinta-baja);transition:background .18s ease,color .18s ease,transform .1s ease}
.it-n.n1{background:color-mix(in srgb,var(--llama) 20%,transparent);color:var(--oro);font-weight:600}
.it-n.n2{background:var(--panel);color:var(--tinta-baja)}
.it-n.n3{background:none;box-shadow:inset 0 0 0 1px var(--linea);color:var(--tinta-tenue)}
button.it-n:active{transform:scale(.88)}
button.it-n:hover{box-shadow:inset 0 0 0 1px var(--linea-fuerte)}
.it-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;padding:13px 0 12px;align-self:stretch}
/* Tachar, no palomear: es lo que hace el papel. Tachado de verdad y no una
   barra encima: la barra medía la caja, no las palabras, y en un renglón de
   dos líneas cruzaba por el hueco. El tachado sigue a las letras, línea por
   línea, y entra con el color en vez de dibujarse de izquierda a derecha. */
/* overflow-wrap: una palabra larga o un enlace pegado ensancha el renglón
   y descuadra la lista entera. Que parta donde haga falta. */
.it-x{font-size:15.5px;line-height:1.35;overflow-wrap:anywhere;
  text-decoration:line-through 1.5px transparent;transition:text-decoration-color .3s ease,color .3s ease}
.it.hecha .it-x{text-decoration-color:var(--tinta-baja)}
.it.hecha .it-x,.it.hecha .it-s{color:var(--tinta-tenue)}
.it-s{font-size:12px;color:var(--tinta-baja)}
.it-mas{flex:0 0 auto;width:34px;align-self:stretch;display:grid;place-items:center;color:var(--tinta-tenue);
  font-size:17px;letter-spacing:.06em}
.it-mas:hover{color:var(--tinta)}
/* Las dos flechas, apiladas: suben y bajan el renglón un lugar y cruzan de
   nivel cuando ya está en el borde. Van en columna para no comerse el
   ancho del texto; el bloque entero mide 44 px de alto. */
.it-m{flex:0 0 auto;width:40px;display:flex;flex-direction:column;justify-content:center;
  align-self:stretch;padding:6px 0}
.it-mv{width:40px;height:26px;display:grid;place-items:center;border-radius:7px;
  color:var(--tinta-baja);transition:color .15s ease,background .15s ease}
.it-mv svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.it-mv:active{background:var(--panel);color:var(--tinta)}
@media (hover:hover){ .it-mv:hover{color:var(--tinta)} }
.it.rut .it-x{font-weight:450}
.nota-vacia{padding:18px 0;color:var(--tinta-baja);font-size:14px;border-bottom:1px solid var(--linea)}

.franja{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-baja);margin:22px 0 6px;display:flex;gap:8px;align-items:baseline}
.franja span{text-transform:none;letter-spacing:.02em;color:var(--tinta-tenue)}
.franja:first-of-type{margin-top:0}

/* ── Agregar: siempre a la vista, siempre un solo campo ── */
.agregar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea);padding:4px 0}
.agregar-mas{flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  color:var(--tinta-tenue);box-shadow:inset 0 0 0 1px var(--linea)}
.agregar-mas svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.agregar-mas:hover{color:var(--llama);box-shadow:inset 0 0 0 1px var(--cera)}
.agregar input{flex:1;border:0;background:none;padding:14px 0;font-size:16px;outline:none}
.agregar input::placeholder{color:var(--tinta-tenue)}

.aviso-tope,.senal{font-size:13px;color:var(--tinta-baja);margin:18px 0 0;padding-left:13px;
  border-left:2px solid var(--cera);line-height:1.5}
.senal{border-left-color:var(--brasa)}

/* ══ SEMANA ══ */
.sec{margin:30px 0 0}
.sec-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-t{font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 3px}
.sec-s{font-size:12.5px;color:var(--tinta-baja);margin:0 0 10px}
.cuenta{font-family:var(--mono);font-size:12px;color:var(--tinta-baja);font-variant-numeric:tabular-nums}
.vacio{font-size:13.5px;color:var(--tinta-baja);padding:12px 0;margin:0}

.cad{list-style:none;margin:6px 0 0;padding:0}
.cad-f{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea);min-height:54px}
.cad-f:first-child{border-top:1px solid var(--linea)}
.cad-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:11px 0}
.cad-n{font-size:15px;line-height:1.3}
.cad-d{display:flex;gap:4px}
.cad-d .d{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;
  font-family:var(--mono);background:var(--panel);color:var(--tinta-tenue)}
.cad-d .d.no{background:none;box-shadow:inset 0 0 0 1px var(--linea);opacity:.45}
.cad-d .d.fut{opacity:.5}
.cad-d .d.on{background:var(--llama);color:#fff;box-shadow:none;opacity:1}
html[data-modo="oscuro"] .cad-d .d.on{color:#1a1612}
.cad-c{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--tinta-baja);font-variant-numeric:tabular-nums}
.cad-f.cuenta .cad-c{color:var(--oro)}
.cad-f.completo .cad-c{color:var(--llama);font-weight:600}

/* ── Las metas: nombre y una flama que es estado, no barra ──
   No se llena. Arde si las acciones están pasando; se apaga si no.
   Llegar a la meta no es contable; que las acciones pasen, sí. */
.metas{display:flex;flex-direction:column;gap:1px;margin:0 0 6px}
.meta-c{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea)}
.meta-c:first-child{border-top:1px solid var(--linea)}
.meta-fl{flex:0 0 auto;width:26px;height:28px;display:grid;place-items:center}
.meta-fl svg{width:22px;height:24px}
.meta-c .meta-fl svg{fill:none;stroke:var(--linea-fuerte);stroke-width:1.5}
.meta-c.apagada .meta-fl svg{stroke:var(--tinta-tenue)}
.meta-c.tibia .meta-fl svg{fill:color-mix(in srgb,var(--cera) 55%,transparent);stroke:var(--cera)}
.meta-c.viva .meta-fl svg{fill:var(--llama);stroke:none;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--llama) 45%,transparent))}
.meta-n{flex:1;min-width:0;font-size:16px}
.meta-s{flex:0 0 auto;font-size:12px;color:var(--tinta-baja)}
.meta-grande{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;
  padding:16px;margin:0 0 18px}
.meta-grande svg{width:34px;height:36px;flex:0 0 auto;fill:none;stroke:var(--tinta-tenue);stroke-width:1.4}
.meta-grande.tibia svg{fill:color-mix(in srgb,var(--cera) 55%,transparent);stroke:var(--cera)}
.meta-grande.viva svg{fill:var(--llama);stroke:none}
.meta-grande p{margin:0;font-size:14px;color:var(--tinta-baja);line-height:1.45}

.plegable{margin:26px 0 0;border-top:1px solid var(--linea);padding-top:14px}
.plegable summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.plegable summary::-webkit-details-marker{display:none}
.plegable .mas{color:var(--tinta-tenue);font-size:17px}
.plegable[open] .mas{transform:rotate(45deg)}

/* ══ HOJAS ══ */
.velo{position:fixed;inset:0;background:rgba(14,13,12,.4);z-index:40;animation:ap .22s ease}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--noche);
  border-radius:20px 20px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);
  /* dvh mide la pantalla sin la barra del navegador; vh queda de respaldo.
     Con vh en Safari sin instalar, el pie de la hoja queda tapado. */
  max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  animation:sube .28s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 -10px 34px rgba(14,13,12,.16)}
@keyframes ap{from{opacity:0}}
@keyframes sube{from{transform:translateY(14px);opacity:.6}}
.asa{width:34px;height:4px;border-radius:2px;background:var(--linea-fuerte);margin:0 auto 14px}
.hoja-t{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 5px;outline:none}
.hoja-s{font-size:13.5px;color:var(--tinta-baja);margin:0 0 18px;line-height:1.5}
.campo{display:block;margin:0 0 16px}
.campo-et{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-baja);margin:0 0 7px}
.campo-i{width:100%;background:var(--panel);border:1px solid transparent;border-radius:11px;
  padding:12px 14px;font-size:16px;outline:none;transition:border-color .18s ease}
.campo-i:focus{border-color:var(--cera)}
.campo-area{resize:vertical;line-height:1.5;font-family:inherit}
.campo-area.mono{font-family:var(--mono);font-size:11px}
.campo-ayuda{font-size:12.5px;color:var(--tinta-baja);margin:-8px 0 16px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.chip{padding:8px 15px;border-radius:999px;font-size:13.5px;background:var(--panel);color:var(--tinta-baja);
  transition:background .18s ease,color .18s ease}
.chip.on{background:var(--tinta);color:var(--noche)}
.dias{display:flex;gap:6px;margin:0 0 16px}
.dia-b{flex:1;height:40px;border-radius:10px;background:var(--panel);color:var(--tinta-baja);
  display:grid;place-items:center;font-size:13px}
.dia-b.on{background:var(--tinta);color:var(--noche)}
.acciones{display:flex;gap:10px;margin:22px 0 0}
.accion{flex:1;padding:14px;border-radius:13px;text-align:center;font-size:15px;background:var(--panel);
  color:var(--tinta);transition:transform .1s ease,opacity .18s ease}
.accion.llena{background:var(--llama);color:#fff;font-weight:500}
html[data-modo="oscuro"] .accion.llena{color:#1a1612}
.accion:active{transform:scale(.985)}
.acciones:has(> .accion:only-child) .accion{flex:1}
.hoja-pie{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0 0;
  padding-top:16px;border-top:1px solid var(--linea)}
.accion.leve,.leve{flex:0 0 auto;background:none;padding:4px 2px;font-size:13px;color:var(--tinta-baja);text-align:center}
.leve:hover{color:var(--brasa)}
.lista-min{display:flex;flex-direction:column;margin:0 0 16px}
.fila-min{padding:13px 0;border-bottom:1px solid var(--linea);font-size:14.5px}
.fila-min:first-child{border-top:1px solid var(--linea)}
.fila-min.nueva{color:var(--tinta-baja)}
.paso-err{color:var(--brasa);font-size:13px;margin:0;min-height:18px}

/* ══ EL PASE ══
   Pantalla completa, una sola decisión por renglón. Es la versión digital
   de volver a escribir la nota: lo que marcas, sigue; lo que no, se guarda. */
.onb{position:fixed;inset:0;z-index:60;background:var(--noche);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 22px);
  overflow-y:auto;animation:ap .24s ease}
.paso-t{font-family:var(--serif);font-size:25px;font-weight:400;margin:0 0 6px;line-height:1.2}
.paso-s{font-size:14px;color:var(--tinta-baja);margin:0 0 22px;line-height:1.5}
.pase-l{display:flex;flex-direction:column;gap:8px;flex:1}
.pase-i{display:flex;align-items:center;gap:12px;padding:14px;border-radius:13px;background:var(--panel);
  border:1.5px solid transparent;transition:border-color .18s ease,background .18s ease}
.pase-i.on{border-color:var(--cera);background:color-mix(in srgb,var(--llama) 9%,var(--panel))}
.pase-c{flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--linea-fuerte);color:transparent}
.pase-i.on .pase-c{background:var(--llama);box-shadow:none;color:#fff}
.pase-c svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pase-x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pase-t{font-size:15px;line-height:1.3}
.pase-s{font-size:12px;color:var(--tinta-baja)}
.paso-acc{margin:26px 0 0}
.onb-top,.onb-dots,.onb-back,.flujo-x{display:none}

/* ══ FAB Y PESTAÑAS ══ */
/* Sin botón flotante: el campo de agregar vive al pie de la lista y nunca
   tapa un renglón. Un lugar para escribir, no dos. */
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--linea);background:var(--noche);
  padding:7px 0 calc(env(safe-area-inset-bottom) + 7px);z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--tinta-tenue);
  transition:color .18s ease}
.tab.activo{color:var(--tinta)}
.tab-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab-lb{font-size:10.5px;letter-spacing:.02em}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:70;background:var(--tinta);color:var(--noche);
  padding:11px 18px;border-radius:999px;font-size:13.5px;max-width:calc(100vw - 40px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .24s ease,transform .24s ease}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:720px){
  .lienzo{padding-left:0;padding-right:0}
  #vista{max-width:580px;margin:0 auto;padding:0 24px}
  .cauce{left:calc(50vw - 330px)}
  .hoja{left:50%;transform:translateX(-50%);width:min(560px,100%);border-radius:20px;bottom:24px;max-height:86vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ══ LAS DOS MITADES DEL DÍA ══
   La nota y Tu día no son dos vistas de lo mismo: son dos cosas que hacen
   falta a la vez. Por eso van una debajo de la otra, en un solo scroll,
   y no detrás de un interruptor que obligue a elegir. */
.bloque{margin:0 0 34px}
.bloque-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 2px}
.bloque-t{font-family:var(--serif);font-size:20px;font-weight:400;margin:0}
.bloque-c{font-family:var(--mono);font-size:11px;color:var(--tinta-baja);font-variant-numeric:tabular-nums;
  flex:0 0 auto}
.bloque-s{font-size:12.5px;color:var(--tinta-baja);margin:0 0 12px;line-height:1.45}

/* ── Tu día: franjas con su propia cuenta; la que corre ahora se marca ── */
.franja-g{margin:0 0 18px;padding-left:13px;border-left:2px solid var(--linea)}
.franja-g.ahora{border-left-color:var(--llama)}
.franja{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-baja);margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.franja span{text-transform:none;letter-spacing:.02em;color:var(--tinta-tenue)}
.franja em{margin-left:auto;font-style:normal;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.franja-g.ahora .franja{color:var(--oro)}

.rutl{list-style:none;margin:0;padding:0}
.rt{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea);min-height:50px}
.rt:last-child{border-bottom:0}
.rt-c{flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--linea-fuerte);color:transparent;transition:background .2s ease,box-shadow .2s ease}
.rt-c span{display:grid;place-items:center}
.rt-c svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rt.hecha .rt-c{background:var(--llama);box-shadow:none;color:#fff}
html[data-modo="oscuro"] .rt.hecha .rt-c{color:#1a1612}
.rt-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;padding:11px 0}
.rt-x{font-size:15px;line-height:1.3;overflow-wrap:anywhere;
  text-decoration:line-through 1.5px transparent;transition:text-decoration-color .3s ease,color .3s ease}
.rt.hecha .rt-x{text-decoration-color:var(--tinta-baja)}
.rt.hecha .rt-x,.rt.hecha .rt-s{color:var(--tinta-tenue)}
.rt-s{font-size:12px;color:var(--tinta-baja)}
/* La flecha que concatena las dos mitades */
.rt-up{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  color:var(--tinta-tenue);transition:color .18s ease,background .18s ease,transform .1s ease}
.rt-up svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt-up:hover{color:var(--tinta);background:var(--panel)}
.rt-up:active{transform:translateY(-2px)}
.rt.arriba .rt-up{color:var(--llama)}
.rt.arriba .rt-up svg{stroke-width:2.4}
/* Un renglón de rutina que ya está en la nota se marca de los dos lados */
.it.rut .it-s{color:var(--oro)}

/* ── Las partes de una actividad, desplegadas en su sitio ── */
.rt-ch{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  color:var(--tinta-tenue);transition:color .18s ease,background .18s ease,transform .22s ease}
.rt-ch svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt-ch:hover{color:var(--tinta);background:var(--panel)}
.rt-ch.on{transform:rotate(180deg);color:var(--oro)}
.rt-ch.vacio{pointer-events:none}
.partes{padding:2px 0 12px 33px;border-bottom:1px solid var(--linea)}
.pl{list-style:none;margin:0;padding:0}
.pa{display:flex;align-items:center;gap:4px}
.pa-t{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;padding:9px 0}
.pa-c{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.4px var(--linea-fuerte);color:transparent}
.pa-c svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.pa.hecha .pa-c{background:var(--oro);box-shadow:none;color:#fff}
html[data-modo="oscuro"] .pa.hecha .pa-c{color:#1a1612}
.pa-x{flex:1 1 auto;min-width:0;font-size:13.5px;line-height:1.3;position:relative}
.pa.hecha .pa-x{color:var(--tinta-tenue);text-decoration:line-through;text-decoration-thickness:1px}
/* El peso de cada parte: presente, en segundo plano, alineado en columna */
.pa-p{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--tinta-baja);
  font-variant-numeric:tabular-nums;padding-left:8px}
.pa.hecha .pa-p{color:var(--oro)}
.pa-m{flex:0 0 auto;display:flex;gap:1px}
.mover{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--tinta-tenue)}
.mover svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mover:hover{color:var(--tinta);background:var(--panel)}
.mover.x{font-size:12px}
.agregar.chico{padding:2px 0 0;border-bottom:0}
.agregar.chico input{padding:9px 0;font-size:16px}
.agregar.chico .agregar-mas{width:18px;height:18px}
.agregar.chico .agregar-mas svg{width:11px;height:11px}
.nota-pie{margin:12px 0 0}
.enlace{font-size:13px;color:var(--tinta-baja);text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--linea-fuerte)}
.enlace:hover{color:var(--tinta)}

/* ══ NIVELES CON COLOR ══
   Tres colores de la misma familia, no un semáforo: el 1 es la llama, el 2
   la cera, el 3 queda en tinta apagada. Ninguno es rojo de alarma — aquí no
   se falla nada. El color nunca va solo: siempre lleva el número al lado,
   para quien no distinga los tonos. */
.niv{display:flex;align-items:baseline;gap:9px;margin:20px 0 4px;font-size:13.5px;color:var(--tinta)}
.niv em{font-style:normal;font-size:11.5px;color:var(--tinta-tenue);margin-left:auto}
.niv-b{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--mono);font-size:11px;align-self:center}
.niv1 .niv-b{background:var(--llama);color:#fff}
.niv2 .niv-b{background:var(--cera);color:#4a3f2e}
.niv3 .niv-b{background:none;box-shadow:inset 0 0 0 1.5px var(--linea-fuerte);color:var(--tinta-baja)}
html[data-modo="oscuro"] .niv1 .niv-b{color:#1a1612}
/* El renglón lleva una cinta del color de su nivel: se lee de un vistazo */
.it{position:relative;padding-left:9px}
.it::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px}
.it.n1::before{background:var(--llama)}
.it.n2::before{background:var(--cera)}
.it.n3::before{background:var(--linea-fuerte)}
.it.hecha::before{opacity:.3}
.it-n.n1{background:color-mix(in srgb,var(--llama) 22%,transparent);color:var(--oro);font-weight:600}
.it-n.n2{background:color-mix(in srgb,var(--cera) 34%,transparent);color:var(--tinta-baja)}
.it-n.n3{background:none;box-shadow:inset 0 0 0 1px var(--linea);color:var(--tinta-tenue)}

/* ══ ARRASTRAR ══
   Mantener presionado levanta el renglón. Antes de eso el gesto sigue
   siendo un scroll, así que no hace falta un asa en cada fila. */
.zona-vacia{list-style:none;padding:11px 0;font-size:13px;color:var(--tinta-tenue);
  border-bottom:1px solid var(--linea)}
[data-arr]{touch-action:pan-y;cursor:grab}
body.arrastrando{user-select:none;-webkit-user-select:none}
body.arrastrando [data-arr]{cursor:grabbing}
.hueco{opacity:.26}
.fantasma{box-shadow:0 10px 26px rgba(14,13,12,.22);background:var(--noche);border-radius:12px;
  padding:0 10px !important;transform-origin:50% 50%;animation:levanta .16s ease}
@keyframes levanta{from{transform-origin:50% 50%}}
.fantasma .it,.fantasma .rt{border-bottom:0}
[data-zona]{min-height:30px;border-radius:10px;transition:background .18s ease,box-shadow .18s ease}
.zona-on{background:color-mix(in srgb,var(--cera) 15%,transparent);
  box-shadow:0 0 0 1.5px var(--cera)}
.hueco-antes{box-shadow:inset 0 2px 0 -0.5px var(--llama)}

/* ── Sincronizar ── */
.sync-e{font-size:13.5px;color:var(--tinta-baja);margin:0 0 16px;padding-left:11px;
  border-left:2px solid var(--cera);line-height:1.45}
.fila-dato{float:right;color:var(--tinta-tenue);font-size:12.5px}
.mono-chico{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.pasos-ayuda{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--tinta-baja);line-height:1.6}
.pasos-ayuda li{margin:0 0 7px}
.pasos-ayuda code,.campo-ayuda code{font-family:var(--mono);font-size:11.5px;background:var(--panel);
  padding:1px 5px;border-radius:4px}

/* ══ SONIDO Y ENFOQUE ══
   La pantalla de enfoque y los chips vienen de la app devocional tal cual: mismos
   tamaños, mismo aro, misma animación. Encajan sin retocar porque las dos
   apps comparten la paleta y las familias tipográficas. */
.concentra{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;z-index:96;background:var(--noche);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:40px 26px calc(env(safe-area-inset-bottom) + 40px)}
.concentra-fase{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-tenue);margin:0}
/* Lo que allá no hacía falta: aquí se enfoca EN algo, y el algo se ve */
.concentra-que{font-family:var(--serif);font-size:1.05rem;line-height:1.35;color:var(--tinta-baja);
  text-align:center;max-width:22ch;margin:-10px 0 0}
.concentra-aro{position:relative;width:158px;height:158px;display:flex;align-items:center;justify-content:center}
.concentra-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.concentra-pista{fill:none;stroke:var(--linea);stroke-width:1}
.concentra-prog{fill:none;stroke:var(--llama);stroke-width:1.4;stroke-linecap:round;
  stroke-dasharray:289.03;stroke-dashoffset:289.03;transition:stroke-dashoffset 1s linear;opacity:.7}
.concentra-num{font-family:var(--serif);font-size:1.7rem;color:var(--tinta-baja);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.concentra-msg{font-family:var(--serif);font-size:1.15rem;line-height:1.5;color:var(--tinta-tenue);
  text-align:center;max-width:24ch;min-height:3em;margin:0;transition:opacity .5s ease}
.concentra-salir{margin-top:8px;padding:13px 40px;border:1px solid var(--linea-fuerte);border-radius:999px;
  font-size:14px;letter-spacing:.02em;color:var(--tinta-baja);transition:border-color .2s,color .2s}
.concentra-salir:hover,.concentra-salir:focus-visible{border-color:var(--llama);color:var(--tinta)}

.son-now{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:color-mix(in srgb,var(--llama) 14%,transparent);border:1px solid var(--linea-fuerte);
  border-radius:12px;padding:12px 15px;margin-bottom:20px;font-size:13.5px;color:var(--tinta)}
.son-stop{font-size:12px;color:var(--brasa);white-space:nowrap;padding:4px 8px}
.son-cat{margin-bottom:20px}
.son-cat-t{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-baja);margin:0 0 11px}
.son-chips{display:flex;flex-wrap:wrap;gap:8px}
/* La nota de ayuda nace pegada a un campo de formulario, y por eso sube 8px.
   Detrás de una fila de pastillas eso la encima: aquí baja. */
.son-chips + .campo-ayuda,.segmento + .campo-ayuda,.acciones + .campo-ayuda{margin-top:11px}
/* El pie del enfoque es una nota, no un párrafo del texto */
.pomo-sub{font-size:12.5px;color:var(--tinta-baja);line-height:1.45;margin:11px 0 16px}
.son-chip{padding:11px 15px;border:1px solid var(--linea-fuerte);border-radius:999px;font-size:13.5px;
  color:var(--tinta-baja);transition:border-color .2s,color .2s,background .2s}
.son-chip.on{border-color:var(--llama);color:var(--tinta);background:color-mix(in srgb,var(--llama) 18%,transparent)}
.son-pomo{margin-top:26px;padding-top:22px;border-top:1px solid var(--linea)}
.son-tarea{font-size:13.5px;color:var(--tinta-baja);margin:-6px 0 18px;padding-left:11px;
  border-left:2px solid var(--cera)}
.son-tarea b{color:var(--tinta);font-weight:500}
.segmento .seg em{display:block;font-style:normal;font-size:10.5px;font-family:var(--mono);
  color:var(--tinta-tenue);margin-top:1px}
.seg.activo em{color:var(--tinta-baja)}

/* ══ LA FLAMA VIVA ══
   De la app devocional: la llama respira sola con `llamaViva`, y `--fl` la hace arder
   más alto conforme la cadencia se sostiene. No se llena como una barra:
   llegar a una meta no es contable, pero que las acciones estén pasando sí.
   `@property` deja animar el número; donde no exista, el salto es seco
   pero el dibujo es el mismo. */
@property --fl { syntax: "<number>"; inherits: false; initial-value: 0.6; }
@property --go { syntax: "<number>"; inherits: false; initial-value: 0.3; }
.flama-v{display:block;flex:0 0 auto;width:34px;height:37px}
.flama-v.grande{width:54px;height:58px}
.flama-v svg{width:100%;height:100%;display:block;overflow:visible}
.nivel-glow{fill:var(--llama);opacity:var(--go,.3);filter:blur(13px);
  animation:brilloVivo 4.2s ease-in-out infinite;transition:--go 1.2s ease}
.nivel-flama{fill:var(--llama);transition:--fl 1.2s cubic-bezier(.3,.8,.3,1),fill 1.6s ease;
  animation:llamaViva var(--fdur,2.6s) ease-in-out infinite}
.nivel-nucleo{fill:#FFF3D4;opacity:.88;pointer-events:none;
  transition:--fl 1.2s cubic-bezier(.3,.8,.3,1);animation:llamaViva var(--fdur,2.6s) ease-in-out infinite}
@keyframes llamaViva{
  0%,100%{transform:scale(var(--fl,.6))}
  28%{transform:scale(calc(var(--fl,.6) * 1.09)) translateY(-.9px)}
  52%{transform:scale(calc(var(--fl,.6) * .965)) translateX(.5px)}
  76%{transform:scale(calc(var(--fl,.6) * 1.045)) translateX(-.4px) translateY(-.3px)}}
@keyframes brilloVivo{0%,100%{opacity:var(--go,.3)}50%{opacity:calc(var(--go,.3) * 1.42)}}
.meta-grande{align-items:center}
@media (prefers-reduced-motion:reduce){
  .nivel-flama,.nivel-nucleo,.nivel-glow,.concentra-prog{animation:none !important;transition:none !important}}

/* ── Los gestos: una frase, sin adorno y sin exigir nada ── */
.gesto{font-family:var(--serif);font-size:1.02rem;line-height:1.45;color:var(--tinta-tenue);
  margin:-8px 0 24px;transition:color .6s ease}
.gesto.cierra{color:var(--oro)}
.onb .gesto{margin:-10px 0 20px}

/* ══ EL ZOOM DE iOS ══
   Safari acerca la pantalla cuando enfocas un campo de menos de 16px. No es
   un capricho suyo: es su regla. Se arregla con el tamaño, no bloqueando el
   zoom en el viewport — eso dejaría sin acercar a quien lo necesita. */
input,select,textarea{font-size:16px}

/* ══ LA PORTADA ══
   La forma viene de la app hermana: el momento del día arriba, el saludo
   grande, la fecha en mono y la palabra del día apartada por una línea.
   Centrada, porque es portada y no lista: lo que sigue abajo sí va alineado
   a la izquierda, y ese corte es justo lo que separa una cosa de la otra. */
.port{position:relative;margin:0 0 30px;text-align:center}
.port-aj{position:absolute;top:-4px;right:-6px;z-index:2}
.port-mom{font-family:var(--mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--brasa);margin:0 0 10px}
.port-h{font-family:var(--serif);font-size:1.95rem;line-height:1.1;font-weight:400;margin:0 0 9px;
  letter-spacing:-.02em;outline:none;text-wrap:balance}
.port-f{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--tinta-baja);margin:0}
.port-f::first-letter{text-transform:uppercase}
/* La línea con el rótulo en medio: dos reglas que crecen a los lados */
.port-sep{display:flex;align-items:center;gap:12px;margin:24px 0 14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--tinta-baja)}
.port-sep::before,.port-sep::after{content:"";flex:1;height:1px;background:var(--linea-fuerte)}
.port-palabra{font-family:var(--serif);font-size:1.34rem;line-height:1.4;color:var(--tinta);
  margin:0;text-wrap:pretty;letter-spacing:-.008em}
/* Tres cuentas y nada más: un tablero de seis deja de leerse de un vistazo */
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 0}
.res{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 6px 12px;
  border-radius:14px;background:var(--panel)}
.res svg{position:absolute;top:10px;width:46px;height:46px;transform:rotate(-90deg)}
.res-pista{fill:none;stroke:var(--linea-fuerte);stroke-width:2.5}
.res-prog{fill:none;stroke:var(--cera);stroke-width:2.5;stroke-linecap:round;
  transition:stroke-dashoffset .7s cubic-bezier(.22,.61,.36,1)}
.res.r1 .res-prog{stroke:var(--llama)}
.res.r2 .res-prog{stroke:var(--oro)}
.res.porti .res-prog{stroke:var(--cera)}
/* Dentro del aro, solo el número y centrado de verdad. El total baja a la
   etiqueta: con «1/4» adentro, el grupo quedaba centrado pero el número no. */
.res-n{position:relative;z-index:1;height:46px;display:grid;place-items:center;font-family:var(--mono);
  font-size:19px;color:var(--tinta);font-variant-numeric:tabular-nums;line-height:1}
.res-et{font-size:11.5px;color:var(--tinta-baja);text-align:center;line-height:1.25;margin-top:2px}
.res-et i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;
  color:var(--tinta-tenue);letter-spacing:.03em;margin-top:2px}
.res.porti.si .res-n{color:var(--oro)}
.port-meta{display:flex;align-items:center;gap:13px;width:100%;margin:14px 0 0;padding:13px 15px;
  border-radius:14px;background:var(--panel);text-align:left}
.port-meta .flama-v{width:42px;height:46px}
.port-meta-x{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.port-meta-n{font-size:15px;color:var(--tinta)}
.port-meta-s{font-size:12px;color:var(--tinta-baja)}

/* ══ LAS TRES CARAS ══
   Una al lado de otra con scroll-snap: el navegador hace el gesto, sin
   librería y sin código que persiga el dedo. El indicador se actualiza al
   terminar el desplazamiento. */
.caras-nav{display:flex;gap:20px;align-items:baseline;margin:0 0 16px;
  position:sticky;top:0;z-index:4;padding:10px 0 10px;background:var(--noche)}
.cara-b{font-family:var(--serif);font-size:1.22rem;color:var(--tinta-tenue);line-height:1;
  transition:color .25s ease}
.cara-b.on{color:var(--tinta)}
/* Columnas del ancho exacto del carril: cada cara cae justo en su tope.
   Sin sangría ni margen negativo —si la columna no mide lo que mide el
   carril, los topes se corren y el rótulo de arriba acaba mintiendo. */
.caras{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;scrollbar-width:none;gap:0}
.caras::-webkit-scrollbar{display:none}
.cara{scroll-snap-align:start;scroll-snap-stop:always;min-width:0}

/* ══ HAZ ALGO SOLO POR TI ══
   Sin niveles, sin horas, sin cadencia. Se escoge de la lista, no se cumple.
   Por eso no hay barra de avance ni cuenta de cuántas faltan: el día que no
   hubo, no pasó nada. */
.porti-alza{padding:16px 18px;border-radius:14px;margin:0 0 18px;
  background:color-mix(in srgb,var(--cera) 22%,transparent);border:1px solid var(--linea)}
.porti-alza.si{background:color-mix(in srgb,var(--llama) 13%,transparent);border-color:var(--cera)}

/* La semana va dentro del mismo bloque: de un vistazo, hoy y la semana.

/* ══ EN HORIZONTAL NO ══
