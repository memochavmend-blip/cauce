<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<script>try{ if(matchMedia("(prefers-color-scheme:dark)").matches){ document.documentElement.dataset.modo = "oscuro"; document.documentElement.style.background = "#0E0D0C"; } }catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Cauce</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FAF8F3'/%3E%3Cpath d='M16 3c-5 5 5 10 0 13s5 8 0 13' fill='none' stroke='%23E0942A' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23E0942A'/%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════
   CAUCE v8 · estilos
   Misma paleta y mismas familias que la app hermana — no cambió de
   material, cambió de forma. Lo que se fue: tarjetas, barras de avance,
   porcentajes, acordeones. Lo que queda: una lista con renglones.
   Regla heredada: --tinta-tenue y --llama no se usan para texto chico
   (no pasan AA sobre el papel claro). Para texto chico, --tinta-baja.
   ══════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --noche:#FAF8F3; --panel:#EFE9DF;
  --tinta:#2B2621; --tinta-baja:#5E554B; --tinta-tenue:#877E73;
  --cera:#C9B896; --llama:#E0942A; --brasa:#B4491C; --oro:#8A6A3E;
  --linea:rgba(43,38,33,.10); --linea-fuerte:rgba(43,38,33,.20);
  --serif:ui-serif,"New York",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-modo="oscuro"]{
  color-scheme:dark;
  --noche:#0E0D0C; --panel:#171513;
  --tinta:#ECE6DB; --tinta-baja:#A79C8D; --tinta-tenue:#726859;
  --cera:#CFC0A0; --llama:#F0A63C; --brasa:#C56A3C; --oro:#B79366;
  --linea:rgba(236,230,219,.08); --linea-fuerte:rgba(236,230,219,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--noche);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .4s ease,color .4s ease}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--llama);outline-offset:3px;border-radius:4px}
.oculto{display:none !important}

/* ── La línea de la hora ──
   Hermana de la veladora de la app devocional: el tiempo se siente, no se cuenta.
   Aquí corre de la medianoche a la medianoche. No pide nada. */
.cauce{position:fixed;left:18px;top:0;bottom:0;width:3px;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 20px) 0 calc(env(safe-area-inset-bottom) + 76px)}
.cauce-lecho{position:relative;height:100%;width:3px}
.cauce-agua{position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(180deg,var(--cera),color-mix(in srgb,var(--cera) 35%,transparent));opacity:.3}
.cauce-andado{position:absolute;left:0;top:0;width:3px;border-radius:2px;background:var(--cera);opacity:.75;
  transition:height 1.2s linear}
.cauce-luz{position:absolute;left:-3px;width:9px;height:9px;border-radius:50%;background:var(--llama);
  box-shadow:0 0 10px 2px color-mix(in srgb,var(--llama) 55%,transparent);transition:top 1.2s linear}

#appShell{height:100%;display:flex;flex-direction:column}
.lienzo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 112px) 42px}
#appShell[inert]{filter:blur(2px);opacity:.5}

/* ── Cabecera ── */
.cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.cab > div{flex:1;min-width:0}
.dia{font-family:var(--serif);font-size:27px;line-height:1.18;font-weight:400;margin:0 0 4px;
  letter-spacing:-.01em;outline:none}
.dia::first-letter{text-transform:uppercase}
.dia-s{font-size:13px;color:var(--tinta-baja);margin:0}
.icono{flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;border-radius:11px;color:var(--tinta-baja)}
.icono svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.icono:hover{background:var(--panel);color:var(--tinta)}

/* ── El interruptor de vista: la misma lista, dos lecturas ── */
.segmento{display:flex;gap:2px;background:var(--panel);border-radius:11px;padding:3px;margin:0 0 18px}
.seg{flex:1;text-align:center;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--tinta-baja);
  transition:background .18s ease,color .18s ease}
.seg.activo{background:var(--noche);color:var(--tinta);box-shadow:0 1px 2px rgba(43,38,33,.07)}

/* ══ LA NOTA ══
   Un post-it: renglones separados por una línea, sin tarjetas ni sombras.
   El número de la izquierda es el nivel, y es un botón: tocarlo cicla. */
.nota{list-style:none;margin:0 0 4px;padding:0}
.it{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--linea);min-height:52px}
.it:first-child{border-top:1px solid var(--linea)}
.it-n{flex:0 0 auto;width:26px;height:26px;margin-top:13px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
  background:var(--panel);color:var(--tinta-baja);transition:background .18s ease,color .18s ease,transform .1s ease}
.it-n.n1{background:color-mix(in srgb,var(--llama) 20%,transparent);color:var(--oro);font-weight:600}
.it-n.n2{background:var(--panel);color:var(--tinta-baja)}
.it-n.n3{background:none;box-shadow:inset 0 0 0 1px var(--linea);color:var(--tinta-tenue)}
button.it-n:active{transform:scale(.88)}
button.it-n:hover{box-shadow:inset 0 0 0 1px var(--linea-fuerte)}
.it-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;padding:13px 0 12px;align-self:stretch}
.it-x{font-size:15.5px;line-height:1.35;position:relative;display:inline-block}
/* Tachar, no palomear: es lo que hace el papel */
.it-x::after{content:"";position:absolute;left:0;top:52%;height:1.5px;width:0;background:var(--tinta-baja);
  border-radius:1px;transition:width .3s cubic-bezier(.22,.61,.36,1)}
.it.hecha .it-x::after{width:100%}
.it.hecha .it-x,.it.hecha .it-s{color:var(--tinta-tenue)}
.it-s{font-size:12px;color:var(--tinta-baja)}
.it-mas{flex:0 0 auto;width:34px;align-self:stretch;display:grid;place-items:center;color:var(--tinta-tenue);
  font-size:17px;letter-spacing:.06em}
.it-mas:hover{color:var(--tinta)}
.it.rut .it-x{font-weight:450}
.nota-vacia{padding:18px 0;color:var(--tinta-baja);font-size:14px;border-bottom:1px solid var(--linea)}

.franja{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-baja);margin:22px 0 6px;display:flex;gap:8px;align-items:baseline}
.franja span{text-transform:none;letter-spacing:.02em;color:var(--tinta-tenue)}
.franja:first-of-type{margin-top:0}

/* ── Agregar: siempre a la vista, siempre un solo campo ── */
.agregar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea);padding:4px 0}
.agregar-mas{flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  color:var(--tinta-tenue);box-shadow:inset 0 0 0 1px var(--linea)}
.agregar-mas svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.agregar-mas:hover{color:var(--llama);box-shadow:inset 0 0 0 1px var(--cera)}
.agregar input{flex:1;border:0;background:none;padding:14px 0;font-size:15.5px;outline:none}
.agregar input::placeholder{color:var(--tinta-tenue)}

.aviso-tope,.senal{font-size:13px;color:var(--tinta-baja);margin:18px 0 0;padding-left:13px;
  border-left:2px solid var(--cera);line-height:1.5}
.senal{border-left-color:var(--brasa)}

/* ══ SEMANA ══ */
.sec{margin:30px 0 0}
.sec-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-t{font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 3px}
.sec-s{font-size:12.5px;color:var(--tinta-baja);margin:0 0 10px}
.cuenta{font-family:var(--mono);font-size:12px;color:var(--tinta-baja);font-variant-numeric:tabular-nums}
.vacio{font-size:13.5px;color:var(--tinta-baja);padding:12px 0;margin:0}

.cad{list-style:none;margin:6px 0 0;padding:0}
.cad-f{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea);min-height:54px}
.cad-f:first-child{border-top:1px solid var(--linea)}
.cad-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:11px 0}
.cad-n{font-size:15px;line-height:1.3}
.cad-d{display:flex;gap:4px}
.cad-d .d{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;
  font-family:var(--mono);background:var(--panel);color:var(--tinta-tenue)}
.cad-d .d.no{background:none;box-shadow:inset 0 0 0 1px var(--linea);opacity:.45}
.cad-d .d.fut{opacity:.5}
.cad-d .d.on{background:var(--llama);color:#fff;box-shadow:none;opacity:1}
html[data-modo="oscuro"] .cad-d .d.on{color:#1a1612}
.cad-c{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--tinta-baja);font-variant-numeric:tabular-nums}
.cad-f.cuenta .cad-c{color:var(--oro)}
.cad-f.completo .cad-c{color:var(--llama);font-weight:600}

/* ── Las metas: nombre y una flama que es estado, no barra ──
   No se llena. Arde si las acciones están pasando; se apaga si no.
   Llegar a la meta no es contable; que las acciones pasen, sí. */
.metas{display:flex;flex-direction:column;gap:1px;margin:0 0 6px}
.meta-c{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea)}
.meta-c:first-child{border-top:1px solid var(--linea)}
.meta-fl{flex:0 0 auto;width:26px;height:28px;display:grid;place-items:center}
.meta-fl svg{width:22px;height:24px}
.meta-c .meta-fl svg{fill:none;stroke:var(--linea-fuerte);stroke-width:1.5}
.meta-c.apagada .meta-fl svg{stroke:var(--tinta-tenue)}
.meta-c.tibia .meta-fl svg{fill:color-mix(in srgb,var(--cera) 55%,transparent);stroke:var(--cera)}
.meta-c.viva .meta-fl svg{fill:var(--llama);stroke:none;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--llama) 45%,transparent))}
.meta-n{flex:1;min-width:0;font-size:16px}
.meta-s{flex:0 0 auto;font-size:12px;color:var(--tinta-baja)}
.meta-grande{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;
  padding:16px;margin:0 0 18px}
.meta-grande svg{width:34px;height:36px;flex:0 0 auto;fill:none;stroke:var(--tinta-tenue);stroke-width:1.4}
.meta-grande.tibia svg{fill:color-mix(in srgb,var(--cera) 55%,transparent);stroke:var(--cera)}
.meta-grande.viva svg{fill:var(--llama);stroke:none}
.meta-grande p{margin:0;font-size:14px;color:var(--tinta-baja);line-height:1.45}

.plegable{margin:26px 0 0;border-top:1px solid var(--linea);padding-top:14px}
.plegable summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.plegable summary::-webkit-details-marker{display:none}
.plegable .mas{color:var(--tinta-tenue);font-size:17px}
.plegable[open] .mas{transform:rotate(45deg)}

/* ══ HOJAS ══ */
.velo{position:fixed;inset:0;background:rgba(14,13,12,.4);z-index:40;animation:ap .22s ease}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--noche);
  border-radius:20px 20px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);
  max-height:92vh;overflow-y:auto;animation:sube .28s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 -10px 34px rgba(14,13,12,.16)}
@keyframes ap{from{opacity:0}}
@keyframes sube{from{transform:translateY(14px);opacity:.6}}
.asa{width:34px;height:4px;border-radius:2px;background:var(--linea-fuerte);margin:0 auto 14px}
.hoja-t{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 5px;outline:none}
.hoja-s{font-size:13.5px;color:var(--tinta-baja);margin:0 0 18px;line-height:1.5}
.campo{display:block;margin:0 0 16px}
.campo-et{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-baja);margin:0 0 7px}
.campo-i{width:100%;background:var(--panel);border:1px solid transparent;border-radius:11px;
  padding:12px 14px;font-size:15.5px;outline:none;transition:border-color .18s ease}
.campo-i:focus{border-color:var(--cera)}
.campo-area{resize:vertical;line-height:1.5;font-family:inherit}
.campo-area.mono{font-family:var(--mono);font-size:11px}
.campo-ayuda{font-size:12.5px;color:var(--tinta-baja);margin:-8px 0 16px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.chip{padding:8px 15px;border-radius:999px;font-size:13.5px;background:var(--panel);color:var(--tinta-baja);
  transition:background .18s ease,color .18s ease}
.chip.on{background:var(--tinta);color:var(--noche)}
.dias{display:flex;gap:6px;margin:0 0 16px}
.dia-b{flex:1;height:40px;border-radius:10px;background:var(--panel);color:var(--tinta-baja);
  display:grid;place-items:center;font-size:13px}
.dia-b.on{background:var(--tinta);color:var(--noche)}
.acciones{display:flex;gap:10px;margin:22px 0 0}
.accion{flex:1;padding:14px;border-radius:13px;text-align:center;font-size:15px;background:var(--panel);
  color:var(--tinta);transition:transform .1s ease,opacity .18s ease}
.accion.llena{background:var(--llama);color:#fff;font-weight:500}
html[data-modo="oscuro"] .accion.llena{color:#1a1612}
.accion:active{transform:scale(.985)}
.acciones:has(> .accion:only-child) .accion{flex:1}
.hoja-pie{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0 0;
  padding-top:16px;border-top:1px solid var(--linea)}
.accion.leve,.leve{flex:0 0 auto;background:none;padding:4px 2px;font-size:13px;color:var(--tinta-baja);text-align:center}
.leve:hover{color:var(--brasa)}
.lista-min{display:flex;flex-direction:column;margin:0 0 16px}
.fila-min{padding:13px 0;border-bottom:1px solid var(--linea);font-size:14.5px}
.fila-min:first-child{border-top:1px solid var(--linea)}
.fila-min.nueva{color:var(--tinta-baja)}
.paso-err{color:var(--brasa);font-size:13px;margin:0;min-height:18px}

/* ══ EL PASE ══
   Pantalla completa, una sola decisión por renglón. Es la versión digital
   de volver a escribir la nota: lo que marcas, sigue; lo que no, se guarda. */
.onb{position:fixed;inset:0;z-index:60;background:var(--noche);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 22px);
  overflow-y:auto;animation:ap .24s ease}
.paso-t{font-family:var(--serif);font-size:25px;font-weight:400;margin:0 0 6px;line-height:1.2}
.paso-s{font-size:14px;color:var(--tinta-baja);margin:0 0 22px;line-height:1.5}
.pase-l{display:flex;flex-direction:column;gap:8px;flex:1}
.pase-i{display:flex;align-items:center;gap:12px;padding:14px;border-radius:13px;background:var(--panel);
  border:1.5px solid transparent;transition:border-color .18s ease,background .18s ease}
.pase-i.on{border-color:var(--cera);background:color-mix(in srgb,var(--llama) 9%,var(--panel))}
.pase-c{flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--linea-fuerte);color:transparent}
.pase-i.on .pase-c{background:var(--llama);box-shadow:none;color:#fff}
.pase-c svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pase-x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pase-t{font-size:15px;line-height:1.3}
.pase-s{font-size:12px;color:var(--tinta-baja)}
.paso-acc{margin:26px 0 0}
.onb-top,.onb-dots,.onb-back,.flujo-x{display:none}

/* ══ FAB Y PESTAÑAS ══ */
/* Sin botón flotante: el campo de agregar vive al pie de la lista y nunca
   tapa un renglón. Un lugar para escribir, no dos. */
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--linea);background:var(--noche);
  padding:7px 0 calc(env(safe-area-inset-bottom) + 7px);z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--tinta-tenue);
  transition:color .18s ease}
.tab.activo{color:var(--tinta)}
.tab-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab-lb{font-size:10.5px;letter-spacing:.02em}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:70;background:var(--tinta);color:var(--noche);
  padding:11px 18px;border-radius:999px;font-size:13.5px;max-width:calc(100vw - 40px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .24s ease,transform .24s ease}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:720px){
  .lienzo{padding-left:0;padding-right:0}
  #vista{max-width:580px;margin:0 auto;padding:0 24px}
  .cauce{left:calc(50vw - 330px)}
  .hoja{left:50%;transform:translateX(-50%);width:min(560px,100%);border-radius:20px;bottom:24px;max-height:86vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ══ LAS DOS MITADES DEL DÍA ══
   La nota y Tu día no son dos vistas de lo mismo: son dos cosas que hacen
   falta a la vez. Por eso van una debajo de la otra, en un solo scroll,
   y no detrás de un interruptor que obligue a elegir. */
.bloque{margin:0 0 34px}
.bloque-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 2px}
.bloque-t{font-family:var(--serif);font-size:20px;font-weight:400;margin:0}
.bloque-c{font-family:var(--mono);font-size:11px;color:var(--tinta-baja);font-variant-numeric:tabular-nums;
  flex:0 0 auto}
.bloque-s{font-size:12.5px;color:var(--tinta-baja);margin:0 0 12px;line-height:1.45}

/* ── Tu día: franjas con su propia cuenta; la que corre ahora se marca ── */
.franja-g{margin:0 0 18px;padding-left:13px;border-left:2px solid var(--linea)}
.franja-g.ahora{border-left-color:var(--llama)}
.franja{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-baja);margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.franja span{text-transform:none;letter-spacing:.02em;color:var(--tinta-tenue)}
.franja em{margin-left:auto;font-style:normal;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.franja-g.ahora .franja{color:var(--oro)}

.rutl{list-style:none;margin:0;padding:0}
.rt{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea);min-height:50px}
.rt:last-child{border-bottom:0}
.rt-c{flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--linea-fuerte);color:transparent;transition:background .2s ease,box-shadow .2s ease}
.rt-c span{display:grid;place-items:center}
.rt-c svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rt.hecha .rt-c{background:var(--llama);box-shadow:none;color:#fff}
html[data-modo="oscuro"] .rt.hecha .rt-c{color:#1a1612}
.rt-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;padding:11px 0}
.rt-x{font-size:15px;line-height:1.3;position:relative;display:inline-block}
.rt-x::after{content:"";position:absolute;left:0;top:52%;height:1.5px;width:0;background:var(--tinta-baja);
  border-radius:1px;transition:width .3s cubic-bezier(.22,.61,.36,1)}
.rt.hecha .rt-x::after{width:100%}
.rt.hecha .rt-x,.rt.hecha .rt-s{color:var(--tinta-tenue)}
.rt-s{font-size:12px;color:var(--tinta-baja)}
/* La flecha que concatena las dos mitades */
.rt-up{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  color:var(--tinta-tenue);transition:color .18s ease,background .18s ease,transform .1s ease}
.rt-up svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt-up:hover{color:var(--tinta);background:var(--panel)}
.rt-up:active{transform:translateY(-2px)}
.rt.arriba .rt-up{color:var(--llama)}
.rt.arriba .rt-up svg{stroke-width:2.4}
/* Un renglón de rutina que ya está en la nota se marca de los dos lados */
.it.rut .it-s{color:var(--oro)}

/* ── Las partes de una actividad, desplegadas en su sitio ── */
.rt-ch{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  color:var(--tinta-tenue);transition:color .18s ease,background .18s ease,transform .22s ease}
.rt-ch svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt-ch:hover{color:var(--tinta);background:var(--panel)}
.rt-ch.on{transform:rotate(180deg);color:var(--oro)}
.rt-ch.vacio{pointer-events:none}
.partes{padding:2px 0 12px 33px;border-bottom:1px solid var(--linea)}
.pl{list-style:none;margin:0;padding:0}
.pa{display:flex;align-items:center;gap:4px}
.pa-t{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;padding:9px 0}
.pa-c{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.4px var(--linea-fuerte);color:transparent}
.pa-c svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.pa.hecha .pa-c{background:var(--oro);box-shadow:none;color:#fff}
html[data-modo="oscuro"] .pa.hecha .pa-c{color:#1a1612}
.pa-x{flex:1 1 auto;min-width:0;font-size:13.5px;line-height:1.3;position:relative}
.pa.hecha .pa-x{color:var(--tinta-tenue);text-decoration:line-through;text-decoration-thickness:1px}
/* El peso de cada parte: presente, en segundo plano, alineado en columna */
.pa-p{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--tinta-baja);
  font-variant-numeric:tabular-nums;padding-left:8px}
.pa.hecha .pa-p{color:var(--oro)}
.pa-m{flex:0 0 auto;display:flex;gap:1px}
.mover{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--tinta-tenue)}
.mover svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mover:hover{color:var(--tinta);background:var(--panel)}
.mover.x{font-size:12px}
.agregar.chico{padding:2px 0 0;border-bottom:0}
.agregar.chico input{padding:9px 0;font-size:13.5px}
.agregar.chico .agregar-mas{width:18px;height:18px}
.agregar.chico .agregar-mas svg{width:11px;height:11px}
.nota-pie{margin:12px 0 0}
.enlace{font-size:13px;color:var(--tinta-baja);text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--linea-fuerte)}
.enlace:hover{color:var(--tinta)}

/* ══ NIVELES CON COLOR ══
   Tres colores de la misma familia, no un semáforo: el 1 es la llama, el 2
   la cera, el 3 queda en tinta apagada. Ninguno es rojo de alarma — aquí no
   se falla nada. El color nunca va solo: siempre lleva el número al lado,
   para quien no distinga los tonos. */
.niv{display:flex;align-items:baseline;gap:9px;margin:20px 0 4px;font-size:13.5px;color:var(--tinta)}
.niv em{font-style:normal;font-size:11.5px;color:var(--tinta-tenue);margin-left:auto}
.niv-b{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--mono);font-size:11px;align-self:center}
.niv1 .niv-b{background:var(--llama);color:#fff}
.niv2 .niv-b{background:var(--cera);color:#4a3f2e}
.niv3 .niv-b{background:none;box-shadow:inset 0 0 0 1.5px var(--linea-fuerte);color:var(--tinta-baja)}
html[data-modo="oscuro"] .niv1 .niv-b{color:#1a1612}
/* El renglón lleva una cinta del color de su nivel: se lee de un vistazo */
.it{position:relative;padding-left:9px}
.it::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px}
.it.n1::before{background:var(--llama)}
.it.n2::before{background:var(--cera)}
.it.n3::before{background:var(--linea-fuerte)}
.it.hecha::before{opacity:.3}
.it-n.n1{background:color-mix(in srgb,var(--llama) 22%,transparent);color:var(--oro);font-weight:600}
.it-n.n2{background:color-mix(in srgb,var(--cera) 34%,transparent);color:var(--tinta-baja)}
.it-n.n3{background:none;box-shadow:inset 0 0 0 1px var(--linea);color:var(--tinta-tenue)}

/* ══ ARRASTRAR ══
   Mantener presionado levanta el renglón. Antes de eso el gesto sigue
   siendo un scroll, así que no hace falta un asa en cada fila. */
.zona-vacia{list-style:none;padding:11px 0;font-size:13px;color:var(--tinta-tenue);
  border-bottom:1px solid var(--linea)}
[data-arr]{touch-action:pan-y;cursor:grab}
body.arrastrando{user-select:none;-webkit-user-select:none}
body.arrastrando [data-arr]{cursor:grabbing}
.hueco{opacity:.26}
.fantasma{box-shadow:0 10px 26px rgba(14,13,12,.22);background:var(--noche);border-radius:12px;
  padding:0 10px !important;transform-origin:50% 50%;animation:levanta .16s ease}
@keyframes levanta{from{transform-origin:50% 50%}}
.fantasma .it,.fantasma .rt{border-bottom:0}
[data-zona]{min-height:30px;border-radius:10px;transition:background .18s ease,box-shadow .18s ease}
.zona-on{background:color-mix(in srgb,var(--cera) 15%,transparent);
  box-shadow:0 0 0 1.5px var(--cera)}
.hueco-antes{box-shadow:inset 0 2px 0 -0.5px var(--llama)}

/* ── Sincronizar ── */
.sync-e{font-size:13.5px;color:var(--tinta-baja);margin:0 0 16px;padding-left:11px;
  border-left:2px solid var(--cera);line-height:1.45}
.fila-dato{float:right;color:var(--tinta-tenue);font-size:12.5px}
.mono-chico{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.pasos-ayuda{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--tinta-baja);line-height:1.6}
.pasos-ayuda li{margin:0 0 7px}
.pasos-ayuda code,.campo-ayuda code{font-family:var(--mono);font-size:11.5px;background:var(--panel);
  padding:1px 5px;border-radius:4px}

/* ══ SONIDO Y ENFOQUE ══
   La pantalla de enfoque y los chips vienen de la app devocional tal cual: mismos
   tamaños, mismo aro, misma animación. Encajan sin retocar porque las dos
   apps comparten la paleta y las familias tipográficas. */
.concentra{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;z-index:96;background:var(--noche);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:40px 26px calc(env(safe-area-inset-bottom) + 40px)}
.concentra-fase{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-tenue);margin:0}
/* Lo que allá no hacía falta: aquí se enfoca EN algo, y el algo se ve */
.concentra-que{font-family:var(--serif);font-size:1.05rem;line-height:1.35;color:var(--tinta-baja);
  text-align:center;max-width:22ch;margin:-10px 0 0}
.concentra-aro{position:relative;width:158px;height:158px;display:flex;align-items:center;justify-content:center}
.concentra-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.concentra-pista{fill:none;stroke:var(--linea);stroke-width:1}
.concentra-prog{fill:none;stroke:var(--llama);stroke-width:1.4;stroke-linecap:round;
  stroke-dasharray:289.03;stroke-dashoffset:289.03;transition:stroke-dashoffset 1s linear;opacity:.7}
.concentra-num{font-family:var(--serif);font-size:1.7rem;color:var(--tinta-baja);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.concentra-msg{font-family:var(--serif);font-size:1.15rem;line-height:1.5;color:var(--tinta-tenue);
  text-align:center;max-width:24ch;min-height:3em;margin:0;transition:opacity .5s ease}
.concentra-salir{margin-top:8px;padding:13px 40px;border:1px solid var(--linea-fuerte);border-radius:999px;
  font-size:14px;letter-spacing:.02em;color:var(--tinta-baja);transition:border-color .2s,color .2s}
.concentra-salir:hover,.concentra-salir:focus-visible{border-color:var(--llama);color:var(--tinta)}

.son-now{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:color-mix(in srgb,var(--llama) 14%,transparent);border:1px solid var(--linea-fuerte);
  border-radius:12px;padding:12px 15px;margin-bottom:20px;font-size:13.5px;color:var(--tinta)}
.son-stop{font-size:12px;color:var(--brasa);white-space:nowrap;padding:4px 8px}
.son-cat{margin-bottom:20px}
.son-cat-t{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-baja);margin:0 0 11px}
.son-chips{display:flex;flex-wrap:wrap;gap:8px}
.son-chip{padding:11px 15px;border:1px solid var(--linea-fuerte);border-radius:999px;font-size:13.5px;
  color:var(--tinta-baja);transition:border-color .2s,color .2s,background .2s}
.son-chip.on{border-color:var(--llama);color:var(--tinta);background:color-mix(in srgb,var(--llama) 18%,transparent)}
.son-pomo{margin-top:26px;padding-top:22px;border-top:1px solid var(--linea)}
.son-tarea{font-size:13.5px;color:var(--tinta-baja);margin:-6px 0 18px;padding-left:11px;
  border-left:2px solid var(--cera)}
.son-tarea b{color:var(--tinta);font-weight:500}
.segmento .seg em{display:block;font-style:normal;font-size:10.5px;font-family:var(--mono);
  color:var(--tinta-tenue);margin-top:1px}
.seg.activo em{color:var(--tinta-baja)}

/* ══ LA FLAMA VIVA ══
   De la app devocional: la llama respira sola con `llamaViva`, y `--fl` la hace arder
   más alto conforme la cadencia se sostiene. No se llena como una barra:
   llegar a una meta no es contable, pero que las acciones estén pasando sí.
   `@property` deja animar el número; donde no exista, el salto es seco
   pero el dibujo es el mismo. */
@property --fl { syntax: "<number>"; inherits: false; initial-value: 0.6; }
@property --go { syntax: "<number>"; inherits: false; initial-value: 0.3; }
.flama-v{display:block;flex:0 0 auto;width:34px;height:37px}
.flama-v.grande{width:54px;height:58px}
.flama-v svg{width:100%;height:100%;display:block;overflow:visible}
.nivel-glow{fill:var(--llama);opacity:var(--go,.3);filter:blur(13px);
  animation:brilloVivo 4.2s ease-in-out infinite;transition:--go 1.2s ease}
.nivel-flama{fill:var(--llama);transition:--fl 1.2s cubic-bezier(.3,.8,.3,1),fill 1.6s ease;
  animation:llamaViva var(--fdur,2.6s) ease-in-out infinite}
.nivel-nucleo{fill:#FFF3D4;opacity:.88;pointer-events:none;
  transition:--fl 1.2s cubic-bezier(.3,.8,.3,1);animation:llamaViva var(--fdur,2.6s) ease-in-out infinite}
@keyframes llamaViva{
  0%,100%{transform:scale(var(--fl,.6))}
  28%{transform:scale(calc(var(--fl,.6) * 1.09)) translateY(-.9px)}
  52%{transform:scale(calc(var(--fl,.6) * .965)) translateX(.5px)}
  76%{transform:scale(calc(var(--fl,.6) * 1.045)) translateX(-.4px) translateY(-.3px)}}
@keyframes brilloVivo{0%,100%{opacity:var(--go,.3)}50%{opacity:calc(var(--go,.3) * 1.42)}}
.meta-grande{align-items:center}
@media (prefers-reduced-motion:reduce){
  .nivel-flama,.nivel-nucleo,.nivel-glow,.concentra-prog{animation:none !important;transition:none !important}}

/* ── Los gestos: una frase, sin adorno y sin exigir nada ── */
.gesto{font-family:var(--serif);font-size:1.02rem;line-height:1.45;color:var(--tinta-tenue);
  margin:-8px 0 24px;transition:color .6s ease}
.gesto.cierra{color:var(--oro)}
.onb .gesto{margin:-10px 0 20px}

</style>
</head>
<body>
<div class="cauce" id="cauce" aria-hidden="true"><div class="cauce-lecho"><div class="cauce-agua"></div><div class="cauce-andado" id="cauceAndado"></div><div class="cauce-luz" id="cauceLuz"></div></div></div>
<div id="appShell">
  <main class="lienzo" id="lienzo"><div id="vista"></div></main>
  <nav class="tabbar" aria-label="Secciones">
    <button class="tab activo" data-accion="tab" data-tab="hoy" aria-current="page"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg></span><span class="tab-lb">Hoy</span></button>
    <button class="tab" data-accion="tab" data-tab="semana"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg></span><span class="tab-lb">Semana</span></button>
    <button class="tab" data-accion="tab" data-tab="hecho"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 7L10 17l-5-5"/></svg></span><span class="tab-lb">Hecho</span></button>
  </nav>
</div>
<div class="onb oculto" id="flujo" role="dialog" aria-modal="true" aria-label="El pase del día">
  <div class="onb-cont" id="flujoCont"></div>
</div>
<!-- Pantalla de enfoque, tomada de la app devocional: el aro que se cierra, el número
     y una frase que cambia sola. Aquí además lleva el nombre de la tarea. -->
<div class="concentra oculto" id="concentra">
  <p class="concentra-fase" id="concentraFase">Enfoque</p>
  <p class="concentra-que" id="concentraQue"></p>
  <div class="concentra-aro">
    <svg class="concentra-svg" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="concentra-pista" cx="50" cy="50" r="46"></circle>
      <circle class="concentra-prog" id="concentraProg" cx="50" cy="50" r="46"></circle>
    </svg>
    <span class="concentra-num" id="concentraNum">25:00</span>
  </div>
  <p class="concentra-msg" id="concentraMsg"></p>
  <button class="concentra-salir" data-accion="concentra-salir">Terminar</button>
</div>
<div id="hojas"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ══════════════════════════════════════════════════════════════════════
   CAUCE v8 · la nota

   Rediseñado desde tres post-its de un sistema de papel que ya funcionaba.
   Lo que enseñaban:

   1) Es UNA lista. Gym, Documentos MBA, Amazon, Meditación y Trading
      Strategy viven en la misma columna. No hay secciones.
   2) El número es un nivel, no un orden: varios renglones comparten el 1.
   3) La lista se reescribe entera cada día, y al reescribirla se
      reprioriza. Entre el 6 y el 10 de marzo, Gym bajó de 1 a 2 y Job
      opps subió de 3 a 2. Nadie arrastró nada: lo volvió a escribir.
   4) Lo que se reescribe muchas veces sin tacharse es la señal. «Trading
      Strategy» lleva tres notas en nivel 1, sin tachar.
   5) Cabe en un post-it: nueve renglones. El papel es el límite de WIP.

   De ahí las reglas de esta versión:
   — Una pantalla con la lista del día, y nada más que decidir.
   — Tocar la fila la tacha. Tocar el número cicla 1→2→3.
   — El pase diario reemplaza el arrastre automático: lo abierto se
     confirma o se va, y se cuenta cuántas veces se ha confirmado.
   — El trabajo no entra: tiene su propio tracker. Aquí van las acciones que
     llevan al propósito, y los pendientes sueltos.
   — La semana es la unidad de la rutina: la meta es el 100%, el 80% ya
     cuenta. No hay flama que se llene, porque llegar a la meta no es
     contable; lo contable es si las acciones están pasando.
   ══════════════════════════════════════════════════════════════════════ */

/* ════════ 1 · BASE ════════ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const DIA_MS = 86400000;
const aISO = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const deISO = s => { const p = String(s).split("-").map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const hoyISO = () => aISO(new Date());
const sumarDias = (s, n) => { const d = deISO(s); d.setDate(d.getDate() + n); return aISO(d); };
const diasEntre = (a, b) => Math.round((deISO(b) - deISO(a)) / DIA_MS);
const lunesDe = s => { const d = deISO(s), n = (d.getDay() + 6) % 7; d.setDate(d.getDate() - n); return aISO(d); };
const semanaDe = s => { const l = lunesDe(s); return Array.from({ length: 7 }, (_, i) => sumarDias(l, i)); };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS_NOM = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const LETRAS = ["D", "L", "M", "M", "J", "V", "S"];
const fechaLarga = f => { const d = deISO(f); return DIAS_NOM[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]; };
const fechaCorta = f => { const d = deISO(f); return d.getDate() + " " + MESES[d.getMonth()].slice(0, 3); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const ICO = {
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l3 3 6-7"/></svg>',
  mas: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  ajustes: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
  llama: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6c2.6 3.1 5.6 5.4 5.6 9.5a5.6 5.6 0 0 1-11.2 0c0-2 .9-3.4 2.1-4.9.5 1 1.1 1.7 1.9 2.1-.3-2.5.2-4.6 1.6-6.7z"/></svg>',
  /* Subir o bajar una parte cambia su peso; el galón las abre en su sitio */
  arriba: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  abajo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ════════ 2 · GUARDADO ════════ */
const Guardado = (() => {
  const memoria = {};
  const claude = () => typeof window !== "undefined" && !!window.storage && typeof window.storage.get === "function";
  const local = (() => { try { const k = "cauce:probe"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; } catch (e) { return false; } })();
  async function leer(k) {
    if (claude()) { try { const v = await window.storage.get(k); if (v) return typeof v === "string" ? JSON.parse(v) : v; } catch (e) {} }
    if (local) { try { const v = window.localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) {} }
    return memoria[k] || null;
  }
  function escribir(k, v) {
    memoria[k] = v;
    if (claude()) { try { window.storage.set(k, JSON.stringify(v)); } catch (e) {} }

const VERSION = 8;
const CLAVE = "cauce:estado:v8";
const VIEJAS = ["cauce:estado:v7", "cauce:estado:v6", "cauce:estado:v5", "cauce:estado:v4", "cauce:estado:v3"];
const TOPE = 9;   /* el post-it: nueve renglones */
let E = null;

/* ════════ 3 · ESQUEMA ════════
   Dos tipos de ítem y una sola lista.
   · rutina — se repite con cadencia semanal. La semana es su unidad.
   · suelto — pasa una vez. Lleva cuenta de cuántos pases ha sobrevivido.
   El nivel (1, 2, 3) vive en el ítem: tocarlo hoy lo deja así mañana,
   igual que al reescribir la nota a mano.                                */
function rutinaNueva(o) {
  const base = Object.assign({ id: uid(), tipo: "rutina", texto: "", nivel: 2, hora: "", area: "",
    orden: 0, dias: [1, 2, 3, 4, 5], semanal: 0,
    meta: null, pausada: false, pasos: [] }, o || {});
  /* Sin franja explícita, la hora decide dónde cae la primera vez. De ahí en
     adelante manda el campo: arrastrar tiene que poder contradecir al reloj. */
  if (!FRANJAS.some(x => x.id === base.franja)) base.franja = franjaDeHora(base.hora);
  return base;
}
function sueltoNuevo(o) {
  return Object.assign({ id: uid(), tipo: "suelto", texto: "", nivel: 2, hora: "", orden: 0,
    meta: null, creado: hoyISO(), pases: 0, hecha: false, hechaEl: null, archivada: false }, o || {});
}
function diaVacio() { return { hechas: {}, fuera: [], sub: {}, pase: false }; }
function diaDe(f) { return Object.assign(diaVacio(), E.dias[f] || {}); }
function diaMut(f) { const d = E.dias[f] = Object.assign(diaVacio(), E.dias[f] || {}); return d; }

const horaEnMin = h => { const p = String(h || "").split(":");
  return p.length === 2 ? (+p[0] || 0) * 60 + (+p[1] || 0) : 9999; };
const franjaDeHora = h => { const m = horaEnMin(h); if (m === 9999) return "jornada";
  const f = FRANJAS.find(x => m >= x.desde * 60 && m < x.hasta * 60); return f ? f.id : "jornada"; };
const FRANJAS = [
  { id: "manana", nombre: "Mañana", desde: 5, hasta: 7 },
  { id: "jornada", nombre: "Jornada", desde: 7, hasta: 18 },
  { id: "tarde", nombre: "Tarde", desde: 18, hasta: 21 },
  { id: "noche", nombre: "Noche", desde: 21, hasta: 24 }

/* Migración desde v7 y anteriores. Nada de lo capturado se pierde: lo que
   no cabe en la lista de nueve entra archivado y se puede traer desde

function desdeViejo(g) {
  const metas = (g.metas || []).map(m => ({ id: m.id, nombre: m.nombre, lane: m.lane || "oficio" }));
  /* El trabajo no vive aquí. Este tracker sigue las acciones que llevan al
     propósito; las tareas del día del oficio tienen su propio tracker, y las
     juntas y los 1:1 son calendario, no lista. Se conservan en pausa
     —visibles y recuperables— en vez de borrarse al importar. */
  const esTrabajo = r => r.area === "Trabajo";
  const rutinas = (g.rutinas || []).filter(r => r.frecuencia !== "mes").map(r => rutinaNueva({
    id: r.id, texto: r.nombre, hora: r.hora || "", area: r.area || "", dias: r.dias || [],
    franja: FRANJAS.some(x => x.id === r.franja) ? r.franja : franjaDeHora(r.hora),
    semanal: r.semanal || 0, pasos: (r.pasos || []).slice(),
    meta: r.meta || null, pausada: !!r.pausada || esTrabajo(r),
    nivel: r.peso ? 1 : (r.semanal >= 5 ? 1 : 2)
  }));
  /* Las mensuales conservan su día del mes */
  (g.rutinas || []).filter(r => r.frecuencia === "mes").forEach(r => rutinas.push(rutinaNueva({
    id: r.id, texto: r.nombre, hora: r.hora || "", area: r.area || "", dias: [], semanal: 0,
    mensual: r.diaMes || 1, pasos: (r.pasos || []).slice(),
    meta: r.meta || null, nivel: 2, pausada: esTrabajo(r)
  })));
  /* Solo lo de los próximos días entra a la lista; lo demás queda guardado y
     se trae cuando toque. Una lista heredada de 50 renglones no es una lista. */
  const pronto = sumarDias(hoyISO(), 7);
  const sueltos = (g.pendientes || []).map(p => sueltoNuevo({
    id: p.id, texto: p.texto, creado: p.creado || p.fecha || hoyISO(),
    hecha: !!p.hecha, hechaEl: p.hechaEl || null, nivel: 1,
    archivada: !p.hecha && !!p.fecha && p.fecha > pronto
  }));
  (g.ideas || []).forEach(i => sueltos.push(sueltoNuevo({ id: i.id, texto: i.texto, nivel: 3, archivada: true })));
  /* Las acciones de la ruta vieja entran guardadas: estaban para una
     estructura que ya no existe. Nada se pierde, pero nada inunda el día. */
  (g.acciones || []).filter(a => !a.hecha).forEach(a => sueltos.push(sueltoNuevo({
    id: a.id, texto: a.texto, meta: a.metaId || null,
    nivel: (a.compromiso && a.compromiso.con) ? 1 : 3, archivada: true
  })));
  (g.metas || []).forEach(m => (m.hitos || []).filter(h => !h.hecho).forEach(h => sueltos.push(sueltoNuevo({
    id: h.id, texto: h.texto + " · " + fechaCorta(h.fecha), meta: m.id, nivel: 1, archivada: true
  }))));
  /* Numerar al migrar: si todo queda en cero, arrastrar no tiene contra qué
     ordenar y el primer movimiento barajaría la lista entera. */
  FRANJAS.forEach(fr => rutinas.filter(r => r.franja === fr.id)
    .sort((a, b) => horaEnMin(a.hora) - horaEnMin(b.hora))
    .forEach((r, i) => { r.orden = (i + 1) * 10; }));
  [1, 2, 3].forEach(n => sueltos.filter(x => x.nivel === n).forEach((x, i) => { x.orden = (i + 1) * 10; }));
  return {
    v: VERSION,
    ajustes: { nombre: (g.ajustes || {}).nombre || "", tema: (g.ajustes || {}).tema || "sistema",
      proposito: (g.ajustes || {}).proposito || "", vista: "nivel" },
    metas, rutinas, sueltos, dias: {}, marcas: { onboarding: true, ultimoDia: null }
  };
}

function normalizar(e) {
  e.ajustes = Object.assign({ nombre: "", tema: "sistema", proposito: "", vista: "nivel",
    metodo: 0, dormir: 15, volumen: 0.5 }, e.ajustes || {});
  ["metas", "rutinas", "sueltos"].forEach(k => { if (!Array.isArray(e[k])) e[k] = []; });
  e.dias = e.dias && typeof e.dias === "object" ? e.dias : {};
  e.marcas = Object.assign({ onboarding: false, ultimoDia: null, tocado: false }, e.marcas || {});
  /* Si ya hay días capturados, esto no es una instalación en blanco aunque
     la marca falte: falla del lado de conservar, no del de pisar. */
  if (Object.keys(e.dias || {}).length) e.marcas.tocado = true;
  /* Empates en el orden hacen que arrastrar baraje la lista: se desempatan aquí */
  const desempatar = (lista, clave) => {
    const grupos = {};
    lista.forEach(x => { const k = x[clave]; (grupos[k] = grupos[k] || []).push(x); });
    Object.values(grupos).forEach(g => {
      const ords = g.map(x => x.orden);
      if (new Set(ords).size !== g.length) g.forEach((x, i) => { x.orden = (i + 1) * 10; });
    });
  };
  /* La franja se dedujo de la hora la primera vez; de ahí en adelante manda
     el campo, porque arrastrar tiene que poder contradecir al reloj. */
  e.rutinas.forEach(r => { r.tipo = "rutina"; if (!Array.isArray(r.dias)) r.dias = [];
    if (!Array.isArray(r.pasos)) r.pasos = []; if (typeof r.area !== "string") r.area = "";
    if (!FRANJAS.some(x => x.id === r.franja)) r.franja = franjaDeHora(r.hora);
    if (typeof r.orden !== "number") r.orden = horaEnMin(r.hora);
    if (typeof r.semanal !== "number") r.semanal = 0; if (![1, 2, 3].includes(r.nivel)) r.nivel = 2;
    if (typeof r.hora !== "string") r.hora = ""; if (r.meta && !e.metas.some(m => m.id === r.meta)) r.meta = null; });
  e.sueltos.forEach((s, i) => { s.tipo = "suelto"; if (![1, 2, 3].includes(s.nivel)) s.nivel = 2;
    if (typeof s.orden !== "number") s.orden = i;
    if (typeof s.pases !== "number") s.pases = 0; if (typeof s.hora !== "string") s.hora = "";
    if (s.meta && !e.metas.some(m => m.id === s.meta)) s.meta = null; });

}
/* Los días viejos se borran solos: esto no es un archivo histórico */
function podar(e) {
  const lim = sumarDias(hoyISO(), -70);
  Object.keys(e.dias).forEach(k => { if (k < lim) delete e.dias[k]; });
  e.sueltos = e.sueltos.filter(s => !(s.hecha && s.hechaEl && s.hechaEl < sumarDias(hoyISO(), -14)));

/* ════════ 4 · LECTURAS ════════ */
const Rg = {
  item: id => E.rutinas.find(r => r.id === id) || E.sueltos.find(s => s.id === id) || null,
  meta: id => E.metas.find(m => m.id === id) || null,
  tocaRutina: (r, f) => {
    if (r.pausada) return false;
    if (r.mensual) return deISO(f).getDate() === r.mensual;
    return (r.dias || []).includes(deISO(f).getDay());
  },
  hecha: (x, f) => x.tipo === "rutina" ? !!diaDe(f).hechas[x.id] : !!x.hecha,
  /* LA LISTA DEL DÍA — rutinas que tocan hoy + sueltos abiertos, en una sola
     columna, como el papel. Ordena por nivel y, dentro del nivel, por hora. */
  lista: f => {
    const d = diaDe(f);
    const rs = E.rutinas.filter(r => Rg.tocaRutina(r, f) && !d.fuera.includes(r.id));
    const ss = E.sueltos.filter(s => !s.archivada && (!s.hecha || s.hechaEl === f));
    return rs.concat(ss).sort((a, b) =>
      (a.nivel - b.nivel) ||
      ((a.hora || "99:99").localeCompare(b.hora || "99:99")) ||
      (a.tipo === b.tipo ? 0 : a.tipo === "rutina" ? -1 : 1));
  },
  /* ── DOS COSAS SEPARADAS, UNA DEBAJO DE LA OTRA ──
     · TU DÍA      — la rutina por franjas, con sus partes. Son las obligaciones:
       lo que hay que hacer para que las metas avancen. Se repite.
     · PENDIENTES  — el 3×3. Pasa una vez, y no tiene por qué llevar a una meta.
     No se mezclan: una rutina nunca aparece entre los pendientes ni al revés.
     Lo hecho sale de aquí y se va al repositorio, en su propio apartado.      */
  pendientes: f => E.sueltos.filter(s => !s.archivada && !s.hecha)
    .sort((a, b) => (a.nivel - b.nivel) || (a.orden - b.orden)),
  /* ── Las partes de una actividad ──
     El orden es el peso: la primera pesa más (n − i). Con cinco partes los
     pesos son 5·4·3·2·1 y las tres de arriba ya valen el 80%. Eso es lo que
     hace que exista un 20% que soltar; con pesos iguales, soltar una de
     cuatro sería el 25% y no habría holgura ninguna. */
  sub: (r, d) => (d.sub && d.sub[r.id]) ? d.sub[r.id] : (r.pasos || []).map(t => ({ t, h: false })),
  pesoSub: (i, n) => n - i,
  totalSub: n => n * (n + 1) / 2,
  pctSub: (i, n) => n ? Math.round((n - i) * 100 / Rg.totalSub(n)) : 0,
  bastanSub: n => { const t = Rg.totalSub(n); let a = 0;
    for (let k = 0; k < n; k++) { a += Rg.pesoSub(k, n); if (a * 5 >= t * 4) return k + 1; } return n; },
  estadoSub: (r, d) => {
    const sub = Rg.sub(r, d), n = sub.length, total = Rg.totalSub(n);
    const peso = sub.reduce((a, x, i) => a + (x.h ? Rg.pesoSub(i, n) : 0), 0);
    return { sub, n, total, peso, hechas: sub.filter(x => x.h).length,
      pct: total ? Math.round(peso * 100 / total) : 0,
      basta: Rg.bastanSub(n), lista: n > 0 && peso * 5 >= total * 4 };
  },
  /* La rutina de hoy, por franja y en el orden que él puso. La hora es una
     etiqueta, no el criterio: arrastrar manda sobre el reloj. */
  porHora: f => {
    const d = diaDe(f);
    const rs = E.rutinas.filter(r => Rg.tocaRutina(r, f) && !d.fuera.includes(r.id));
    return FRANJAS.map(fr => ({ fr, items: rs.filter(x => x.franja === fr.id)
      .sort((a, b) => (a.orden - b.orden) || horaEnMin(a.hora) - horaEnMin(b.hora)) }));
  },
  /* Los pendientes en tres grupos: arrastrar de uno a otro cambia el nivel */
  porNivel: f => [1, 2, 3].map(n => ({ n, items: Rg.pendientes(f).filter(x => x.nivel === n)
    .sort((a, b) => a.orden - b.orden) })),
  /* LA SEMANA — la unidad de la rutina. La meta es el 100%; el 80% ya cuenta,
     pero se dice en días, no en porcentaje: con 5, cuatro bastan. */
  objetivo: r => r.semanal > 0 ? r.semanal : (r.dias || []).length,
  basta: r => { const m = Rg.objetivo(r); return m >= 4 ? m - 1 : m; },
  semana: (r, f) => {
    const hoy = hoyISO(), dias = semanaDe(f);
    const hechos = dias.map(k => ({ fecha: k, hecha: k <= hoy && !!((E.dias[k] || {}).hechas || {})[r.id],
      toca: Rg.tocaRutina(r, k), futuro: k > hoy }));
    const n = hechos.filter(x => x.hecha).length, obj = Rg.objetivo(r), suf = Rg.basta(r);
    return { dias: hechos, n, obj, suf, completo: obj > 0 && n >= obj, cuenta: obj > 0 && n >= suf };
  },
  seguidas: () => E.rutinas.filter(r => !r.pausada && !r.mensual && Rg.objetivo(r) > 0),
  abiertos: () => E.sueltos.filter(s => !s.hecha && !s.archivada).sort((a, b) => (b.pases - a.pases) || a.nivel - b.nivel),
  archivados: () => E.sueltos.filter(s => !s.hecha && s.archivada),
  /* Los que quedaron abiertos de días pasados: lo que el pase diario revisa */
  paraPase: f => E.sueltos.filter(s => !s.hecha && !s.archivada && s.creado < f),
  /* LA FLAMA — un estado, no una barra. No mide qué tan cerca está la meta,
     porque eso no es contable. Mide si las acciones están pasando: arde
     cuando las rutinas de esa meta van en cadencia, y se apaga cuando no. */
  flama: m => {
    const rs = E.rutinas.filter(r => r.meta === m.id && !r.pausada && Rg.objetivo(r) > 0);
    if (!rs.length) return { estado: "sin", rs: 0, n: 0, de: 0, pct: 0 };
    const f = hoyISO();
    let n = 0, de = 0;
    rs.forEach(r => { const s = Rg.semana(r, f); n += Math.min(s.n, s.obj); de += s.obj; });
    /* Se mide contra lo que tocaría a estas alturas de la semana, no contra el
       total: un martes con 2 de 5 va bien, y un viernes con 2 de 5 no. */
    const hoyIdx = (deISO(f).getDay() + 6) % 7, parte = Math.max(1, hoyIdx + 1) / 7;
    const esperado = Math.max(1, de * parte), r2 = n / esperado;

      pct: Math.max(0, Math.min(100, Math.round(r2 * 100))) };
  },
  cuenta: f => { const l = Rg.lista(f); return { n: l.length, hechas: l.filter(x => Rg.hecha(x, f)).length,
    uno: l.filter(x => x.nivel === 1).length, unoHechas: l.filter(x => x.nivel === 1 && Rg.hecha(x, f)).length }; },
  /* El progreso del día, en dos cuentas separadas porque son dos cosas */
  marcador: f => {
    const r = E.rutinas.filter(x => Rg.tocaRutina(x, f) && !diaDe(f).fuera.includes(x.id));
    const abiertos = Rg.pendientes(f);
    const hoyHechos = E.sueltos.filter(s => s.hecha && s.hechaEl === f).length;
    return { rut: r.length, rutH: r.filter(x => Rg.hecha(x, f)).length,
      pend: abiertos.length + hoyHechos, pendH: hoyHechos,
      uno: abiertos.filter(x => x.nivel === 1).length + E.sueltos.filter(s => s.hecha && s.hechaEl === f && s.nivel === 1).length,
      unoH: E.sueltos.filter(s => s.hecha && s.hechaEl === f && s.nivel === 1).length };
  },
  /* El repositorio: lo hecho sale de la lista y se guarda por día */
  hechos: () => {
    const ss = E.sueltos.filter(s => s.hecha && s.hechaEl).sort((a, b) => b.hechaEl.localeCompare(a.hechaEl));
    const porDia = [];
    ss.forEach(s => { const g = porDia.find(x => x.f === s.hechaEl);

/* ════════ 5 · ACCIONES ════════ */
const A = {
  marcar(x, f) {
    if (x.tipo === "rutina") {
      const d = diaMut(f), v = !d.hechas[x.id];
      if (v) d.hechas[x.id] = true; else delete d.hechas[x.id];
      const sub = Rg.sub(x, d);
      if (sub.length) d.sub[x.id] = sub.map(y => ({ t: y.t, h: v }));
    } else { x.hecha = !x.hecha; x.hechaEl = x.hecha ? f : null; }
  },
  /* Al llegar al 80% del peso, la actividad se da por hecha sola */
  marcarSub(r, i, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    if (!sub[i]) return null;
    sub[i].h = !sub[i].h;
    const antes = !!d.hechas[r.id], e = Rg.estadoSub(r, d);
    if (e.lista) d.hechas[r.id] = true; else delete d.hechas[r.id];
    return { antes, ahora: e.lista, e };
  },
  nuevaSub(r, texto, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    sub.push({ t: texto, h: false });
    if (!Rg.estadoSub(r, d).lista) delete d.hechas[r.id];
  },
  quitarSub(r, i, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    sub.splice(i, 1);
    const e = Rg.estadoSub(r, d);
    if (sub.length && e.lista) d.hechas[r.id] = true; else delete d.hechas[r.id];
  },
  /* ── Mover un renglón ──
     Soltar en otra franja la cambia de bloque; soltar en otro nivel cambia la
     prioridad. El orden queda renumerado de 10 en 10 para que siempre quepa
     uno nuevo en medio sin tener que tocar los demás. */
  mover(x, destino, antesDe) {
    const lista = x.tipo === "rutina"
      ? (x.franja = destino, E.rutinas.filter(r => r.franja === destino && r.id !== x.id))
      : (x.nivel = +destino, E.sueltos.filter(y => !y.archivada && !y.hecha && y.nivel === +destino && y.id !== x.id));
    lista.sort((a, b) => a.orden - b.orden);
    const i = antesDe ? lista.findIndex(y => y.id === antesDe) : -1;
    const dentro = i >= 0 ? i : lista.length;
    lista.splice(dentro, 0, x);

    return true;
  },
  /* Agregar una obligación directo al bloque donde la quiere */
  nuevaRutina(texto, franja) {
    const fr = FRANJAS.find(x => x.id === franja) || FRANJAS[1];
    const hermanas = E.rutinas.filter(r => r.franja === fr.id);
    const r = rutinaNueva({ texto: texto.trim(), franja: fr.id, hora: pad2(fr.desde) + ":00",
      orden: (hermanas.length + 1) * 10, dias: [1, 2, 3, 4, 5], semanal: 5 });
    E.rutinas.push(r); return r;
  },
  /* Mover una parte cambia su peso: subir es «esta pesa más» */
  moverSub(r, i, paso, f) {
    const d = diaMut(f), sub = (d.sub[r.id] = Rg.sub(r, d).map(x => ({ t: x.t, h: x.h })));
    const j = i + paso; if (!sub[i] || !sub[j]) return false;
    const t = sub[i]; sub[i] = sub[j]; sub[j] = t;

  nivel(x) { x.nivel = x.nivel >= 3 ? 1 : x.nivel + 1; },
  agregar(texto, nivel) {
    const n = nivel || 2;
    const hermanos = E.sueltos.filter(x => !x.archivada && !x.hecha && x.nivel === n);
    const s = sueltoNuevo({ texto: texto.trim(), nivel: n, orden: (hermanos.length + 1) * 10 });
    E.sueltos.push(s); return s;
  },
  quitar(x, f) {

  traer(s) { s.archivada = false; s.creado = hoyISO(); },
  borrar(x) {
    if (x.tipo === "rutina") E.rutinas = E.rutinas.filter(r => r.id !== x.id);
    else E.sueltos = E.sueltos.filter(s => s.id !== x.id);
  },
  /* EL PASE — la versión digital de volver a escribir la nota. Lo que
     sobrevive suma un pase; eso es lo que después delata lo que lleva
     semanas en la lista sin hacerse. */
  pasar(ids, f) {
    Rg.paraPase(f).forEach(s => { if (ids.includes(s.id)) { s.pases += 1; s.creado = f; } else s.archivada = true; });
    diaMut(f).pase = true;
  }
};

/* ════════ 6 · VISTAS ════════ */
const S = { tab: "hoy", hoja: null, abiertas: [], pase: [] };

function pintar() {
  if (!E) return;
  $$(".tab").forEach(t => { const on = t.dataset.tab === S.tab;
    t.classList.toggle("activo", on); if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
  if (S.tab === "hoy") pintarHoy(); else if (S.tab === "hecho") pintarHecho(); else pintarSemana();
  lineaDia();
}
/* La línea de la izquierda es la hora del día. Se siente el tiempo sin contarlo. */
function lineaDia() {
  const n = new Date(), p = Math.max(0, Math.min(1, (n.getHours() * 60 + n.getMinutes()) / 1440));
  const el = $("#cauceAndado"), lz = $("#cauceLuz");
  if (el) el.style.height = (p * 100) + "%";
  if (lz) lz.style.top = (p * 100) + "%";
}

/* Un pendiente: nivel a la izquierda, se tacha al tocarlo, ⋯ para editarlo */
function filaPend(x) {
  const m = x.meta ? Rg.meta(x.meta) : null;
  const sub = [];
  if (x.pases > 0) sub.push(x.pases === 1 ? "1 pase" : x.pases + " pases");
  if (m) sub.push(m.nombre);
  return `<li class="it n${x.nivel}" data-arr="pen" data-id="${x.id}">` +
    `<button class="it-n n${x.nivel}" data-accion="nivel" data-id="${x.id}" aria-label="Nivel ${x.nivel} de ${esc(x.texto)}. Tocar para cambiar.">${x.nivel}</button>` +
    `<button class="it-t" data-accion="marcar" data-id="${x.id}" aria-pressed="false">` +
      `<span class="it-x">${esc(x.texto)}</span>` +
      (sub.length ? `<span class="it-s">${esc(sub.join(" · "))}</span>` : "") + `</button>` +
    `<button class="it-mas" data-nodrag data-accion="ver-item" data-id="${x.id}" aria-label="Opciones de ${esc(x.texto)}">⋯</button></li>`;
}

/* Una obligación de la rutina. Si tiene partes, el galón las despliega aquí
   mismo: sin hoja que abrir ni pantalla que cerrar. */
function filaRutina(x, f) {
  const d = diaDe(f), hecha = Rg.hecha(x, f), sem = Rg.semana(x, f), e = Rg.estadoSub(x, d);
  const abierta = S.abiertas.includes(x.id);
  const partes = !e.n ? "" : e.hechas >= e.n ? "las " + e.n + ", hechas"
    : e.lista ? e.pct + "% del peso · ya cuenta"
    : e.hechas ? e.hechas + " de " + e.n + " · " + e.pct + "%"
    : e.n + " partes · con " + e.basta + " de arriba basta";
  const sub = [x.hora || "", x.area || "",
    sem.obj > 0 ? (sem.n ? sem.n + " de " + sem.obj + " esta semana" : sem.obj + " por semana") : "",
    partes].filter(Boolean);
  let h = `<li class="rt${hecha ? " hecha" : ""}" data-arr="rut" data-id="${x.id}">` +
    `<button class="rt-c" data-accion="marcar" data-id="${x.id}" role="checkbox" aria-checked="${hecha}" aria-label="${hecha ? "Desmarcar" : "Marcar"}: ${esc(x.texto)}"><span>${ICO.check}</span></button>` +
    `<button class="rt-t" data-accion="ver-item" data-id="${x.id}">` +
      `<span class="rt-x">${esc(x.texto)}</span>` +
      (sub.length ? `<span class="rt-s">${esc(sub.join(" · "))}</span>` : "") + `</button>` +
    (e.n ? `<button class="rt-ch${abierta ? " on" : ""}" data-nodrag data-accion="plegar" data-id="${x.id}" aria-expanded="${abierta}" aria-label="${abierta ? "Ocultar" : "Ver"} las partes de ${esc(x.texto)}">${ICO.abajo}</button>` : `<span class="rt-ch vacio"></span>`) +
    `</li>`;
  if (e.n && abierta) {
    h += `<li class="partes"><ul class="pl">` + e.sub.map((y, i) =>
      `<li class="pa${y.h ? " hecha" : ""}">` +
      `<button class="pa-t" data-accion="marcar-sub" data-id="${x.id}" data-i="${i}" role="checkbox" aria-checked="${y.h}">` +
        `<span class="pa-c">${ICO.check}</span><span class="pa-x">${esc(y.t)}</span>` +
        `<span class="pa-p">${Rg.pctSub(i, e.n)}%</span></button>` +
      `<span class="pa-m">` +
        (i > 0 ? `<button class="mover" data-accion="subir-sub" data-id="${x.id}" data-i="${i}" aria-label="Subir: ${esc(y.t)} pesa más">${ICO.arriba}</button>` : "") +
        (i < e.n - 1 ? `<button class="mover" data-accion="bajar-sub" data-id="${x.id}" data-i="${i}" aria-label="Bajar: ${esc(y.t)} pesa menos">${ICO.abajo}</button>` : "") +
        `<button class="mover x" data-accion="quitar-sub" data-id="${x.id}" data-i="${i}" aria-label="Quitar ${esc(y.t)}">✕</button>` +
      `</span></li>`).join("") +
      `</ul><div class="agregar chico"><button class="agregar-mas" data-accion="enviar" data-para="sub_${x.id}" aria-label="Agregar parte">${ICO.mas}</button>` +
      `<input id="sub_${x.id}" data-enter="sub" data-rut="${x.id}" placeholder="Agregar parte de hoy…" enterkeyhint="done" autocomplete="off" aria-label="Agregar parte"></div></li>`;
  }
  return h;
}

function pintarHoy() {
  const f = hoyISO(), mk = Rg.marcador(f), bloques = Rg.porHora(f), ps = Rg.pendientes(f);
  const ahora = new Date().getHours();
  let h = `<header class="cab"><div><h1 class="dia" tabindex="-1">${esc(fechaLarga(f))}</h1>` +
    `<p class="dia-s">${[mk.rut ? "Rutina " + mk.rutH + " de " + mk.rut : "",
      mk.pend ? "Pendientes " + mk.pendH + " de " + mk.pend : ""].filter(Boolean).join(" · ") || "El día está limpio."}</p></div>` +
    `<button class="icono" data-accion="ajustes" aria-label="Ajustes">${ICO.ajustes}</button></header>`;

  /* Una línea al abrir el día; cuando lo de nivel 1 ya salió, cambia sola. */
  const cerrado = mk.uno > 0 && mk.unoH >= mk.uno;
  h += `<p class="gesto${cerrado ? " cierra" : ""}">${esc(cerrado ? fraseDelDia("cierra", f) : fraseDelDia("abrir", f))}</p>`;

  /* ── TU DÍA: las obligaciones, por franja y por hora ── */
  h += `<section class="bloque"><div class="bloque-cab"><h2 class="bloque-t">Tu día</h2>` +
    `<span class="bloque-c">${mk.rut ? mk.rutH + " de " + mk.rut : ""}</span></div>` +
    `<p class="bloque-s">Tu rutina, en el orden en que ocurre. Si una actividad tiene partes, el galón las abre aquí mismo.</p>`;
  h += bloques.map(({ fr, items }) => {
    const hechos = items.filter(x => Rg.hecha(x, f)).length;
    const enCurso = ahora >= fr.desde && ahora < fr.hasta;
    return `<div class="franja-g${enCurso ? " ahora" : ""}"><p class="franja">${esc(fr.nombre)}` +
      `<span>${fr.desde}:00–${fr.hasta === 24 ? "24" : fr.hasta}:00</span>` +
      `<em>${items.length ? hechos + " de " + items.length : "libre"}</em></p>` +
      `<ul class="rutl" data-zona="${fr.id}">${items.map(x => filaRutina(x, f)).join("") ||
        `<li class="zona-vacia">Suelta algo aquí, o escribe abajo.</li>`}</ul>` +
      `<div class="agregar chico"><button class="agregar-mas" data-accion="enviar" data-para="rut_${fr.id}" aria-label="Agregar a ${esc(fr.nombre)}">${ICO.mas}</button>` +
      `<input id="rut_${fr.id}" data-enter="rutina" data-franja="${fr.id}" placeholder="Agregar a ${esc(fr.nombre.toLowerCase())}…" enterkeyhint="done" autocomplete="off" aria-label="Agregar actividad a ${esc(fr.nombre)}"></div></div>`;
  }).join("");
  h += `</section>`;

  /* ── PENDIENTES: el 3×3. No son la rutina y no tienen que llevar a una meta. ── */
  h += `<section class="bloque"><div class="bloque-cab"><h2 class="bloque-t">Pendientes</h2>` +
    `<span class="bloque-c">${mk.uno ? "nivel 1: " + mk.uno : ps.length ? ps.length + " abiertos" : ""}</span></div>` +
    `<p class="bloque-s">Lo suelto: pasa una vez y no tiene por qué llevar a una meta. Tres niveles; toca el número para cambiarlo.</p>`;
  const NIV = [["Primero", "lo que sí o sí hoy"], ["Después", "si el día lo permite"], ["Si da tiempo", "sin prisa"]];
  h += Rg.porNivel(f).map(({ n, items }) =>
    `<p class="niv niv${n}"><span class="niv-b">${n}</span>${NIV[n - 1][0]}<em>${NIV[n - 1][1]}</em></p>` +
    `<ul class="nota" data-zona="${n}">${items.map(filaPend).join("") ||
      `<li class="zona-vacia">—</li>`}</ul>`).join("");
  h += `<div class="agregar"><button class="agregar-mas" data-accion="enviar" data-para="nuevo" aria-label="Agregar">${ICO.mas}</button>` +
    `<input id="nuevo" data-enter="nuevo" placeholder="Agregar pendiente…" enterkeyhint="done" autocomplete="off" aria-label="Agregar pendiente"></div>`;
  if (ps.length > TOPE) h += `<p class="aviso-tope">Son ${ps.length} pendientes. En papel cabían nueve. Baja a nivel 3 lo que no sea de esta semana.</p>`;
  const viejo = ps.filter(x => x.pases >= 3)[0];
  if (viejo) h += `<p class="senal">${esc(viejo.texto)} lleva ${viejo.pases} pases sin hacerse. O es más chico de lo que parece, o no es de nivel ${viejo.nivel}.</p>`;
  if (mk.pendH) h += `<p class="nota-pie"><button class="enlace" data-accion="ir-hecho">${mk.pendH === 1 ? "1 pendiente hecho hoy" : mk.pendH + " pendientes hechos hoy"} · verlos</button></p>`;
  h += `</section>`;

  $("#vista").innerHTML = h;
}

/* ── El repositorio: lo hecho, por día. No se persigue, se consulta. ── */
function pintarHecho() {
  const dias = Rg.hechos(), n = dias.reduce((a, g) => a + g.items.length, 0);
  let h = `<header class="cab"><div><h1 class="dia" tabindex="-1">Hecho</h1>` +
    `<p class="dia-s">${n ? n + (n === 1 ? " pendiente cerrado" : " pendientes cerrados") + ", del más reciente al más viejo." : "Todavía no hay nada aquí."}</p></div></header>`;
  h += dias.map(g => `<p class="franja">${esc(fechaLarga(g.f))}<em>${g.items.length}</em></p>` +
    `<ul class="nota">${g.items.map(s => `<li class="it hecha">` +
      `<span class="it-n n${s.nivel}">${s.nivel}</span>` +
      `<button class="it-t" data-accion="reabrir" data-id="${s.id}" aria-label="Reabrir ${esc(s.texto)}">` +
      `<span class="it-x">${esc(s.texto)}</span><span class="it-s">tocar para reabrir</span></button></li>`).join("")}</ul>`).join("")
    || `<p class="vacio">Cuando marques un pendiente como hecho, se guarda aquí.</p>`;
  $("#vista").innerHTML = h;
}


/* ── La flama viva ──
   El dibujo viene tal cual de la app devocional: la elipse de brillo detrás, el cuerpo de
   la llama y el núcleo claro, respirando con `llamaViva`. Lo que cambia es qué
   la alimenta: allá una práctica, aquí las semanas del mes que llegaron al
   80/20. No se llena como una barra —arde más alto o más bajo— porque llegar
   a una meta no es contable y fingir un porcentaje sería mentir. */
function flamaSVG(pct, clase) {
  const alto = (0.34 + 0.66 * (pct / 100)).toFixed(2);
  const brillo = (0.08 + 0.34 * (pct / 100)).toFixed(2);
  return `<span class="flama-v ${clase || ""}" aria-hidden="true"><svg viewBox="0 0 120 130">` +
    `<ellipse class="nivel-glow" cx="60" cy="64" rx="44" ry="50" style="--go:${brillo}"></ellipse>` +
    `<path class="nivel-flama" style="--fl:${alto};transform-origin:50% 98px" d="M60 18 C80 52 80 82 60 98 C40 82 40 52 60 18 Z"></path>` +
    `<path class="nivel-nucleo" style="--fl:${alto};transform-origin:50% 96px" d="M60 51 C71 69 71 86 60 96 C49 86 49 69 60 51 Z"></path>` +
    `</svg></span>`;
}

function pintarSemana() {
  const f = hoyISO(), seg = Rg.seguidas(), ab = Rg.abiertos(), ar = Rg.archivados();
  let h = `<header class="cab"><div><h1 class="dia" tabindex="-1">Semana</h1>` +
    `<p class="dia-s">Del ${esc(fechaCorta(lunesDe(f)))} al ${esc(fechaCorta(sumarDias(lunesDe(f), 6)))}. La meta es la semana completa; con uno menos ya cuenta.</p></div></header>`;

  if (E.metas.length) h += `<div class="metas">${E.metas.map(m => { const fl = Rg.flama(m);
    return `<button class="meta-c ${fl.estado}" data-accion="ver-meta" data-id="${m.id}">` +
      flamaSVG(fl.pct) +
      `<span class="meta-n">${esc(m.nombre)}</span>` +
      `<span class="meta-s">${fl.estado === "sin" ? "sin rutinas" : fl.estado === "viva" ? "va en cadencia"
        : fl.estado === "tibia" ? "va a medias" : fl.n ? "va atrás" : "sin movimiento"}</span></button>`; }).join("")}</div>`;

  h += `<section class="sec"><h2 class="sec-t">Rutina</h2>`;
  h += seg.length ? `<ul class="cad">${seg.map(r => { const s = Rg.semana(r, f);
    return `<li class="cad-f${s.completo ? " completo" : s.cuenta ? " cuenta" : ""}">` +
      `<button class="cad-b" data-accion="ver-item" data-id="${r.id}">` +
      `<span class="cad-n">${esc(r.texto)}</span>` +
      `<span class="cad-d" aria-hidden="true">${s.dias.map((d, i) => `<span class="d${d.hecha ? " on" : ""}${d.futuro ? " fut" : ""}${d.toca ? "" : " no"}">${LETRAS[(i + 1) % 7]}</span>`).join("")}</span>` +
      `</button><span class="cad-c">${s.n} de ${s.obj}</span></li>`; }).join("")}</ul>`
    : `<p class="vacio">Ninguna rutina lleva cadencia semanal todavía.</p>`;
  h += `</section>`;

  h += `<section class="sec"><div class="sec-cab"><h2 class="sec-t">Pendientes abiertos</h2><span class="cuenta">${ab.length}</span></div>` +
    `<p class="sec-s">Ordenados por cuántos pases llevan. Lo de arriba es lo que más veces ha reescrito sin hacer.</p>`;
  h += ab.length ? `<ul class="nota">${ab.map(s => `<li class="it"><span class="it-n n${s.nivel}">${s.nivel}</span>` +
    `<button class="it-t" data-accion="ver-item" data-id="${s.id}"><span class="it-x">${esc(s.texto)}</span>` +
    `<span class="it-s">${s.pases ? (s.pases === 1 ? "1 pase" : s.pases + " pases") : "nuevo"}${s.meta ? " · " + esc((Rg.meta(s.meta) || {}).nombre) : ""}</span></button></li>`).join("")}</ul>`
    : `<p class="vacio">Nada abierto.</p>`;
  h += `</section>`;

  if (ar.length) h += `<details class="plegable"><summary><h2 class="sec-t">Guardado (${ar.length})</h2><span class="mas">+</span></summary>` +
    `<p class="sec-s">Fuera de la lista del día, no borrado. Tráelo cuando toque.</p><ul class="nota">` +
    ar.map(s => `<li class="it"><span class="it-n n${s.nivel}">${s.nivel}</span>` +
      `<button class="it-t" data-accion="traer" data-id="${s.id}"><span class="it-x">${esc(s.texto)}</span><span class="it-s">traer al día</span></button></li>`).join("") +
    `</ul></details>`;

  $("#vista").innerHTML = h;
}

/* ════════ 7 · HOJAS ════════ */
function hoja(tit, sub, cuerpo) {
  $("#hojas").innerHTML = `<div class="velo" data-accion="cerrar-hoja"></div><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTit">` +
    `<div class="asa" aria-hidden="true"></div><h2 class="hoja-t" id="hojaTit" tabindex="-1">${tit}</h2>` +
    (sub ? `<p class="hoja-s">${sub}</p>` : "") + cuerpo + `</div>`;
  $("#appShell").setAttribute("inert", "");
  setTimeout(() => { const t = $("#hojas [data-autofoco]") || $("#hojaTit"); if (t) try { t.focus({ preventScroll: true }); } catch (e) {} }, 50);
}
function cerrarHoja() { $("#hojas").innerHTML = ""; $("#appShell").removeAttribute("inert"); }
const campo = (id, et, val, ph, tipo) => `<label class="campo"><span class="campo-et">${esc(et)}</span>` +
  `<input id="${id}" class="campo-i" type="${tipo || "text"}" value="${esc(val || "")}" placeholder="${esc(ph || "")}"></label>`;
const btn = (t, a, id, cl) => `<button class="accion${cl ? " " + cl : ""}" data-accion="${a}"${id ? ` data-id="${id}"` : ""}>${t}</button>`;
const dos = (a, b) => `<div class="acciones">${a}${b || ""}</div>`;
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };

function hojaItem(id) {
  const x = Rg.item(id); if (!x) return;
  const esRut = x.tipo === "rutina";
  const metas = [["", "Ninguna"]].concat(E.metas.map(m => [m.id, m.nombre]));
  hoja(esc(x.texto) || "Renglón",
    esRut ? "Se repite con cadencia. La semana es su unidad: la meta es completa, y con uno menos ya cuenta."
      : "Pasa una vez. Cada pase que sobrevive queda contado.",
    campo("iTxt", "Qué es", x.texto, "") +
    `<p class="campo-et">Nivel</p><div class="chips">${[1, 2, 3].map(n =>
      `<button class="chip${x.nivel === n ? " on" : ""}" data-accion="set-nivel" data-id="${x.id}" data-v="${n}">${n}</button>`).join("")}</div>` +
    campo("iHora", "Hora (opcional)", x.hora, "", "time") +
    (esRut ? `<p class="campo-et">Días</p><div class="dias">${[1, 2, 3, 4, 5, 6, 0].map(d =>
        `<button class="dia-b${(x.dias || []).includes(d) ? " on" : ""}" data-accion="set-dia" data-id="${x.id}" data-v="${d}" aria-pressed="${(x.dias || []).includes(d)}" aria-label="${DIAS_NOM[d]}">${LETRAS[d]}</button>`).join("")}</div>` +
      `<label class="campo"><span class="campo-et">¿Cuántas veces por semana quieres?</span>` +
      `<select id="iSem" class="campo-i">${[0, 1, 2, 3, 4, 5, 6, 7].map(n =>
        `<option value="${n}"${x.semanal === n ? " selected" : ""}>${n ? n + (n === 1 ? " vez" : " veces") : "Las que estén programadas"}</option>`).join("")}</select></label>` +
      `<p class="campo-ayuda">Con 4 o más, saltarte una sigue contando. Pero la semana completa es la meta.</p>` : "") +
    `<label class="campo"><span class="campo-et">Alimenta</span><select id="iMeta" class="campo-i">` +
      metas.map(m => `<option value="${m[0]}"${(x.meta || "") === m[0] ? " selected" : ""}>${esc(m[1])}</option>`).join("") + `</select></label>` +
    `<div class="acciones" style="margin-top:4px"><button class="accion" data-accion="enfocar" data-id="${x.id}">Enfocar ${METODOS[E.ajustes.metodo || 0].foco} min en esto</button></div>` +
    dos(btn("Cancelar", "cerrar-hoja"), btn("Guardar", "guardar-item", x.id, "llena")) +
    `<div class="hoja-pie">` +
      (esRut ? btn(x.pausada ? "Reactivar" : "Pausar", "pausar", x.id, "leve")
             : btn("Guardar para después", "archivar", x.id, "leve")) +
      btn("Eliminar", "borrar-item", x.id, "leve") + `</div>`);
}

function hojaMeta(id) {
  const m = Rg.meta(id); if (!m) return;
  const rs = E.rutinas.filter(r => r.meta === m.id);
  const fl = Rg.flama(m);
  hoja(esc(m.nombre),
    "La flama no mide qué tan cerca está la meta: eso no es contable. Mide si las acciones están pasando.",
    `<div class="meta-grande ${fl.estado}">${flamaSVG(fl.pct, "grande")}<p>${
      fl.estado === "sin" ? "Ninguna rutina alimenta esta meta. Mientras no haya acciones recurrentes, no hay nada que seguir."
      : fl.estado === "viva" ? "Va en cadencia esta semana."
      : fl.estado === "tibia" ? "Va a medias esta semana."
      : fl.n ? "Va atrás de la cadencia de esta semana." : "Esta semana no se ha movido."}</p></div>` +
    campo("mNom", "Nombre", m.nombre, "") +
    `<p class="campo-et">Lo que la alimenta</p>` +
    (rs.length ? `<ul class="nota">${rs.map(r => { const s = Rg.semana(r, hoyISO());
      return `<li class="it"><span class="it-n n${r.nivel}">${r.nivel}</span><button class="it-t" data-accion="ver-item" data-id="${r.id}">` +
        `<span class="it-x">${esc(r.texto)}</span><span class="it-s">${s.obj ? s.n + " de " + s.obj + " esta semana" : "sin cadencia"}</span></button></li>`; }).join("")}</ul>`
      : `<p class="vacio">Nada todavía. Abre un renglón de la lista y ponle esta meta en «Alimenta».</p>`) +
    dos(btn("Cerrar", "cerrar-hoja"), btn("Guardar", "guardar-meta", m.id, "llena")) +
    `<div class="hoja-pie">${btn("Eliminar meta", "borrar-meta", m.id, "leve")}</div>`);
}

function hojaAjustes() {
  hoja("Ajustes", "",
    campo("aNom", "Tu nombre", E.ajustes.nombre, "") +
    `<label class="campo"><span class="campo-et">Propósito · ¿para qué?</span>` +
    `<textarea id="aProp" class="campo-i campo-area" rows="3" placeholder="No es una meta. Se relee.">${esc(E.ajustes.proposito)}</textarea></label>` +

/* ════════ 8 · EL PASE DIARIO ════════
   Reemplaza el arrastre automático. En papel, lo que sobrevive se vuelve a
   escribir — y esa fricción es el filtro: lo que no vale la pena reescribir,
   no valía la pena. Aquí son dos toques por renglón, no una pluma, pero la
   decisión es la misma y queda contada.                                      */
function abrirPase() {
  const f = hoyISO(), ps = Rg.paraPase(f);
  if (!ps.length) { diaMut(f).pase = true; guardar(); return; }
  S.pase = ps.map(s => s.id);
  pintarPase();
}
function pintarPase() {
  const f = hoyISO(), ps = Rg.paraPase(f);
  const cuerpo = `<div class="pase-l">${ps.map(s => {
    const on = S.pase.includes(s.id);
    return `<button class="pase-i${on ? " on" : ""}" data-accion="pase-toggle" data-id="${s.id}" aria-pressed="${on}">` +
      `<span class="pase-c" aria-hidden="true">${ICO.check}</span>` +
      `<span class="pase-x"><span class="pase-t">${esc(s.texto)}</span>` +
      `<span class="pase-s">${s.pases ? (s.pases === 1 ? "lo has pasado 1 vez" : "lo has pasado " + s.pases + " veces") : "de ayer"}</span></span></button>`;
  }).join("")}</div>`;
  $("#flujoCont").innerHTML = `<h1 class="paso-t">Lo que quedó abierto</h1>` +
    `<p class="paso-s">Marca lo que sigue hoy. Lo que no, se guarda — no se borra.</p>` +
    `<p class="gesto">${esc(fraseDelDia("pase", f))}</p>` + cuerpo +
    `<div class="paso-acc"><button class="accion llena" data-accion="pase-ok">Escribir la lista</button></div>`;
  $("#flujo").classList.remove("oculto");
  $("#appShell").setAttribute("inert", "");
}
